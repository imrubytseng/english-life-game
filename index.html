 "en": "Good, because it's cold, and I have my daughter with me.", "zh": "太好了，因為天氣很冷，而且我女兒跟我在一起。"}, {"s": "A", "en": "Please keep her warm, and stay together. If you ever feel unsafe, call the emergency number.", "zh": "請讓她保暖，並待在一起。如果您覺得不安全，請撥打緊急電話。"}, {"s": "B", "en": "Okay. Can I get a rental car while mine is being repaired?", "zh": "好的。我的車在維修時，我可以租車嗎？"}, {"s": "A", "en": "Your membership includes one day of free rental car. The repair shop can arrange it for you.", "zh": "您的會員資格包含一天免費租車。維修廠可以幫您安排。"}, {"s": "B", "en": "Thank you so much for your help.", "zh": "非常謝謝你的協助。"}, {"s": "A", "en": "You're welcome. Stay safe. The tow truck will be there soon.", "zh": "不客氣。請注意安全。拖吊車很快就到。"}]}

}

function hashStr(str){
  let h=2166136261;
  for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619)>>>0; }
  h^=h>>>15; h=Math.imul(h,2246822519)>>>0; h^=h>>>13; h=Math.imul(h,3266489917)>>>0; h^=h>>>16;
  return h>>>0;
}

/* ============ 語音（瀏覽器內建 Web Speech API） ============ */
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voices = [];
let slow = false;
let tok = 0;

function loadVoices(){
  if(!hasTTS) return;
  voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  if(window.__onVoices) window.__onVoices();
}
if(hasTTS){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
// 排除會讓聲音沙啞、怪異的特效/低品質語音
const BAD_VOICE = /Whisper|Bad News|Good News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Hysterical|Jester|Organ|Superstar|Trinoids|Wobble|Zarvox|Albert|Fred|Junior|Ralph|eSpeak|Pipe/i;
const FEMALE = /Samantha|Aria|Jenny|Ava|Zira|Allison|Susan|Karen|Moira|Tessa|Serena|Joanna|Salli|Kendra|Female|Libby|Sonia|Emma|Michelle/i;
const MALE   = /Guy|Davis|Andrew|Brian|Christopher|Eric|Roger|Steffan|Ryan|Daniel|Aaron|Alex|Matthew|David|Mark|Tom|Joey|Justin|Male|Google UK English Male/i;
function score(v, role){
  const n = v.name;
  let s = 0;
  if(/^en[-_]US/i.test(v.lang)) s += 3;
  if(/Natural|Neural|Online|Enhanced|Premium/i.test(n)) s += 6;
  if(/Google/i.test(n)) s += 2;
  if(v.localService===false) s += 1;
  if(role==='A' && FEMALE.test(n)) s += 4;
  if(role==='B' && MALE.test(n)) s += 4;
  return s;
}
const cfg = {voiceA:'', voiceB:'', rate:0.95, sfx:true};
function voiceFor(role){
  const saved = role==='A' ? cfg.voiceA : cfg.voiceB;
  if(saved){ const sv = voices.find(v=>v.name===saved); if(sv) return sv; }
  const pool = voices.filter(v=>!BAD_VOICE.test(v.name));
  if(!pool.length) return voices[0] || null;
  const a = pool.slice().sort((x,y)=>score(y,'A')-score(x,'A'))[0];
  if(role==='A') return a;
  const rest = pool.filter(v=>v!==a);
  if(!rest.length) return a;
  return rest.sort((x,y)=>score(y,'B')-score(x,'B'))[0];
}
/* ---- 真人錄音檔（選用）：audio/manifest.json 存在時優先播放錄音 ---- */
let AUDIO = {};
let curAudio = null;
function loadAudioManifest(){
  try{
    fetch('audio/manifest.json',{cache:'no-cache'})
      .then(r=>r.ok?r.json():null)
      .then(m=>{ if(m && m.files) AUDIO = m.files; })
      .catch(()=>{});
  }catch(e){}
}
const audioOn = ()=>Object.keys(AUDIO).length>0;

function stopSpeech(){
  tok++;
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; }
  if(hasTTS) speechSynthesis.cancel();
}
function speakTTS(text, role, done, myTok){
  const fin = ()=>{ if(myTok===tok && done) done(); };
  if(!hasTTS){ setTimeout(fin, 600); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  const v = voiceFor(role);
  if(v) u.voice = v;
  const usable = voices.filter(x=>!BAD_VOICE.test(x.name));
  const same = usable.length < 2 && !cfg.voiceA && !cfg.voiceB;
  // 只有一種聲音時，用「提高音高」區分角色；絕不壓低，避免沙啞
  u.pitch = same ? (role==='B' ? 1.0 : 1.3) : 1;
  u.rate = slow ? cfg.rate*0.68 : cfg.rate;
  u.onend = fin;
  u.onerror = fin;
  speechSynthesis.speak(u);
}
function say(text, role, done, myTok){
  const f = AUDIO[text];
  if(!f){ speakTTS(text, role, done, myTok); return; }
  let fellBack = false;
  const fallback = ()=>{ if(fellBack || myTok!==tok) return; fellBack = true; speakTTS(text, role, done, myTok); };
  const a = new Audio('audio/'+f);
  a.playbackRate = slow ? 0.8 : 1;
  curAudio = a;
  a.onended = ()=>{ if(myTok===tok && done) done(); };
  a.onerror = fallback;
  const p = a.play();
  if(p && p.catch) p.catch(fallback);
}
function speakOne(text, role, done){
  stopSpeech();
  const my = tok;
  say(text, role, done, my);
}

/* ============ 音效（用瀏覽器合成，不需要音檔） ============ */
let actx = null;
function audioCtx(){
  try{
    if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); }
    if(actx && actx.state==='suspended') actx.resume();
  }catch(e){}
  return actx;
}
function tone(freq, start, dur, type, vol){
  const c = audioCtx(); if(!c) return;
  const t = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.05);
}
function sfx(kind){
  if(!cfg.sfx) return;
  if(kind==='right'){            // 叮叮叮：往上的三個音
    tone(784, 0, .16, 'sine', .28);
    tone(1046.5, .11, .2, 'sine', .28);
    tone(1318.5, .22, .38, 'triangle', .2);
  } else if(kind==='wrong'){     // 嗚：往下的兩個柔和低音
    tone(247, 0, .2, 'triangle', .3);
    tone(175, .17, .38, 'triangle', .3);
    try{ if(navigator.vibrate) navigator.vibrate(90); }catch(e){}
  } else if(kind==='win'){       // 過關小號
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, i*.12, .26, 'triangle', .22));
    tone(1046.5, .52, .6, 'sine', .2);
  } else if(kind==='lose'){      // 加油
    tone(330, 0, .26, 'sine', .22);
    tone(262, .24, .26, 'sine', .22);
    tone(196, .48, .5, 'sine', .22);
  }
}

      <input type="range" min="0.7" max="1.1" step="0.05" value="${cfg.rate}" oninput="setRate(this.value)" style="width:100%">

    <p class="hint">小技巧：名稱含 Natural、Neural、Premium、Enhanced 或 Google 的語音通常最像真人。選好後會自動記住。</p>`;
}
function toggleSfx(){ cfg.sfx=!cfg.sfx; saveProgress(); renderSettings(); if(cfg.sfx) sfx('right'); }
function setVoice(role,name){ if(role==='A') cfg.voiceA=name; else cfg.voiceB=name; saveProgress(); testVoice(role); }
function setRate(v){ cfg.rate=parseFloat(v); document.getElementById('rateV').textContent=cfg.rate.toFixed(2); saveProgress(); }
function testVoice(role){
  speakOne(role==='A' ? "Hi there! Welcome. How can I help you today?" : "Thanks a lot. I'd like a cup of coffee, please.", role);
}

/* ============ 畫面 ============ */
function render(){
  if(state.screen==='home') return renderHome();
  if(state.screen==='learn') return renderLearn();
  if(state.screen==='quiz') return renderQuiz();
  if(state.screen==='result') return renderResult();
  if(state.screen==='settings') return renderSettings();
}

function renderHome(){
  const cardOf = sc=>`
    <button class="card" style="background-color:${artOf(sc)[0]}" onclick="openScene('${sc.id}')">
      <span class="cprops">${artOf(sc)[1].slice(1).join('')}</span>
      <span class="ic">${sc.icon}</span>
      <b>${sc.title}</b>
      <small>${sc.en}</small>
      <small class="dur">⏱ 約 ${estMin(sc)} 分鐘</small>
      ${state.completed[sc.id]?`<span class="done">已通關 ${'⭐'.repeat(state.stars[sc.id]||0)}</span>`:''}
    </button>`;
  const listed = new Set(CATS.flatMap(c=>c.ids));
  const groups = CATS.map(c=>({name:c.name, items:c.ids.map(id=>SCENES.find(s=>s.id===id)).filter(Boolean)}));
  const rest = SCENES.filter(s=>!listed.has(s.id));
  if(rest.length) groups.push({name:'其他', items:rest});
  const doneCount = SCENES.filter(s=>state.completed[s.id]).length;
  if(!state.openInit){ state.open = {}; if(groups[0]) state.open[groups[0].name] = true; state.openInit = true; }
  const cards = groups.map(g=>{
    const done = g.items.filter(x=>state.completed[x.id]).length;
    const isOpen = !!state.open[g.name];
    return `<button class="cat ${isOpen?'open':''}" onclick="toggleCat('${g.name}')" aria-expanded="${isOpen}">
        <span>${g.name}</span><span class="catinfo">${done} / ${g.items.length} <i>${isOpen?'▲':'▼'}</i></span>
      </button>
      ${isOpen ? `<div class="grid" style="margin:12px 0 22px">${g.items.map(cardOf).join('')}</div>` : ''}`;
  }).join('');
  $app.innerHTML = `
    <div class="logo"><span class="b1">Talk</span><span class="b2">Talk</span></div>
    <p class="sub">生活英語會話：先聽對話、點句子重聽，再用聽力挑戰檢驗自己。${state.best?`<br><b>最高分：${state.best}</b>`:''}</p>
    ${hasTTS?'':'<div class="notice">這個瀏覽器不支援語音朗讀，請改用 Chrome、Safari 或 Edge 開啟。</div>'}
    <button class="challenge" onclick="startQuiz(null)">
      <span class="big">🎧</span>
      <span><b>聽力挑戰</b><span>全部情境隨機 8 題，答錯 3 次就結束</span></span>
    </button>
    <p class="sub" style="margin:0 0 14px"><b>通關進度：${doneCount} / ${SCENES.length}</b>（每個情境學完都有測驗）</p>
    ${cards}
    <p class="hint">提示：手機請先關閉靜音模式並調高音量。進度會自動存在這支手機的瀏覽器裡。</p>
    <p style="text-align:center;margin-top:18px"><button class="btn" onclick="go('settings')">⚙️ 聲音與音效設定</button></p>
    <p style="text-align:center;margin-top:8px"><button class="showtxt" onclick="resetProgress()">清除學習進度</button></p>`;
}

function toggleCat(name){ state.open[name] = !state.open[name]; renderHome(); }

function openScene(id){
  go('learn',{scene:SCENES.find(s=>s.id===id), showZh:true, hideEn:false});
}

function renderLearn(){
  const sc = state.scene;
  const chat = sc.lines.map((l,i)=>`
    ${l.h ? `<div class="part">${esc(l.h)}</div>` : ''}
    <div class="row ${l.s}">
      <span class="who">${esc(sc.roles[l.s])}</span>
      <div class="line">
        ${avatar(sc.id, l.s)}
        <button class="bubble" id="b${i}" onclick="playLine(${i})" aria-label="播放第 ${i+1} 句">
          <div class="en">🔊 ${esc(l.en)}</div>
          <div class="zh">${esc(l.zh)}</div>
        </button>
      </div>
    </div>`).join('');
  $app.innerHTML = `
    <div class="top">
      <button class="back" onclick="go('home')" aria-label="回首頁">←</button>
      <h2>${sc.title}</h2>
    </div>
    ${banner(sc)}
    <div class="tools">
      <button class="btn primary" id="playAll" onclick="togglePlayAll()">${state.playingAll?'⏹ 停止':'▶ 播放全部'}</button>
      <button class="btn ${slow?'on':''}" onclick="toggleSlow()">🐢 慢速</button>
      <button class="btn ${state.showZh?'':'sun'}" onclick="toggleZh()">${state.showZh?'隱藏中文':'顯示中文'}</button>
      <button class="btn ${state.hideEn?'sun':''}" onclick="toggleEn()">${state.hideEn?'顯示英文':'遮住英文'}</button>
    </div>
    <div class="chat ${state.showZh?'':'hide-zh'} ${state.hideEn?'hide-en':''}" id="chat">${chat}</div>
    <p class="hint">點任何一句即可重聽。熟了之後試試「遮住英文」，只靠耳朵聽。</p>
    <div id="quizCta" style="margin-top:20px"><button class="btn primary" style="width:100%;padding:14px" onclick="startQuiz('${sc.id}')">✅ 對話學完了，開始測驗</button></div>`;
}

function toggleSlow(){ slow=!slow; saveProgress(); renderLearn(); }
function toggleZh(){ state.showZh=!state.showZh; renderLearn(); }
function toggleEn(){ state.hideEn=!state.hideEn; renderLearn(); }

function mark(i){
  document.querySelectorAll('.bubble').forEach(b=>b.classList.remove('playing'));
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('speaking'));
  if(i!=null){
    const el=document.getElementById('b'+i);
    if(el){
      el.classList.add('playing');
      if(el.closest){ const r=el.closest('.row'); if(r) r.classList.add('speaking'); }
      el.scrollIntoView({block:'center',behavior:'smooth'});
    }
  }
}
function playLine(i){
  state.playingAll=false; setPlayBtn();
  const l = state.scene.lines[i];
  mark(i);
  speakOne(l.en, l.s, ()=>mark(null));
}
function setPlayBtn(){
  const b=document.getElementById('playAll');
  if(b) b.textContent = state.playingAll?'⏹ 停止':'▶ 播放全部';
}
function togglePlayAll(){
  if(state.playingAll){ stopSpeech(); state.playingAll=false; mark(null); setPlayBtn(); return; }
  state.playingAll=true; setPlayBtn();
  stopSpeech();
  const my=tok, lines=state.scene.lines;
  const next=i=>{
    if(my!==tok) return;
    if(i>=lines.length){
      state.playingAll=false; mark(null); setPlayBtn();
      const cta=document.getElementById('quizCta');
      if(cta){
        cta.innerHTML = `<div class="donebar">🎉 對話聽完了！準備好就來測驗吧</div><button class="btn primary" style="width:100%;padding:14px;margin-top:10px" onclick="startQuiz('${state.scene.id}')">🎧 開始測驗</button>`;
        cta.scrollIntoView({block:'center',behavior:'smooth'});
      }
      return;
    }
    mark(i);
    say(lines[i].en, lines[i].s, ()=>setTimeout(()=>next(i+1),450), my);
  };
  next(0);
}

/* ============ 聽力挑戰 ============ */
function startQuiz(sceneId){
  const scenes = sceneId ? SCENES.filter(s=>s.id===sceneId) : SCENES;
  let pairs=[];
  scenes.forEach(sc=>{ for(let i=0;i<sc.lines.length-1;i++) pairs.push({sc,i}); });
  const longScene = sceneId && scenes[0].lines.length>20;
  pairs = shuffle(pairs).slice(0, longScene ? 10 : 8);

  const makeFill = (line, sc)=>{
    const clean = w=>w.replace(/^'+|'+$/g,'').toLowerCase();
    const words = (line.en.match(/[A-Za-z']{4,}/g)||[]).map(clean).filter(w=>w.length>=4);
    if(!words.length) return null;
    const w = words[Math.floor(Math.random()*words.length)];
    const re = new RegExp("\\b"+w+"\\b","i");
    if(!re.test(line.en)) return null;
    const blanked = line.en.replace(re,'_____');
    const pool = shuffle([...new Set(SCENES.flatMap(s=>s.lines).flatMap(l=>(l.en.match(/[A-Za-z']{4,}/g)||[]).map(clean)))])
      .filter(x=>x!==w && x.length>=4 && Math.abs(x.length-w.length)<=3);
    const distract = pool.slice(0,2);
    if(distract.length<2) return null;
    return {type:'fill', audio:line.en, role:line.s, text:blanked, full:line.en, zh:line.zh,
            correct:w, options:shuffle([w,...distract]), explain:`${line.en}\n${line.zh}`};
  };

  const qs = pairs.map(p=>{
    const prompt = p.sc.lines[p.i], reply = p.sc.lines[p.i+1];
    const others = SCENES.filter(s=>s!==p.sc);
    const r = Math.random();
    if(r<0.3){ const f=makeFill(prompt,p.sc); if(f) return f; }
    if(r<0.65 && prompt.s!==reply.s){   // 「選回應」只出在對方說完換你回答的地方
      // 題型一：聽句子，選合適的回應
      const pool = shuffle(others.flatMap(s=>s.lines.filter(l=>l.s===reply.s && l.en.split(' ').length>=4 && l.en!==reply.en)));
      const seenEn = new Set([reply.en]), distract = [];
      for(const l of pool){ if(!seenEn.has(l.en)){ seenEn.add(l.en); distract.push(l.en); if(distract.length===2) break; } }
      return {type:'reply', audio:prompt.en, role:prompt.s, text:prompt.en, zh:prompt.zh,
              correct:reply.en, options:shuffle([reply.en,...distract]), explain:`${reply.en}\n${reply.zh}`};
    } else {
      // 題型二：聽句子，選中文意思
      const pool = shuffle(others.flatMap(s=>s.lines));
      const seenZh = new Set([prompt.zh]), distract = [];
      for(const l of pool){ if(!seenZh.has(l.zh)){ seenZh.add(l.zh); distract.push(l.zh); if(distract.length===2) break; } }
      return {type:'meaning', audio:prompt.en, role:prompt.s, text:prompt.en, zh:prompt.zh,
              correct:prompt.zh, options:shuffle([prompt.zh,...distract]), explain:`${prompt.en}\n${prompt.zh}`};
    }
  });
  qs.forEach((q,i)=>{ q.sid = pairs[i].sc.id; });
  const maxHearts = sceneId ? 5 : 3;
  go('quiz',{quiz:{sceneId, qs, idx:0, score:0, hearts:maxHearts, maxHearts, answered:false, picked:-1, showText:false}});
  setTimeout(()=>playQ(),350);
}
function playQ(){
  const q=state.quiz.qs[state.quiz.idx];
  speakOne(q.audio, q.role);
}
function renderQuiz(){
  const Z=state.quiz, q=Z.qs[Z.idx];
  const pct = Math.round(Z.idx/Z.qs.length*100);
  const label = q.type==='reply' ? '聽一聽，選最合適的回應'
              : q.type==='fill' ? '聽一聽，選出空格裡的單字'
              : '聽一聽，選正確的中文意思';
  const opts = q.options.map((o,i)=>{
    let cls='opt';
    if(Z.answered){
      cls+=' lock';
      if(o===q.correct) cls+=' right';
      else if(i===Z.picked) cls+=' wrong';
    }
    const ear = q.type==='reply' ? `<span class="ear" onclick="event.stopPropagation();hearOpt(${i})" role="button" aria-label="聽選項">🔊</span>` : '';
    return `<button class="${cls}" onclick="pick(${i})"><span class="t">${esc(o)}</span>${ear}</button>`;
  }).join('');
  let fb='';
  if(Z.answered){
    const ok = q.options[Z.picked]===q.correct;
    const e = q.explain.split('\n');
    fb = `<div class="feedback ${ok?'ok':'no'}">${ok?'答對了！':'再試試看，正確答案是：'}<small>${esc(e[0])}<br>${esc(e[1])}</small></div>
          <button class="btn primary" style="width:100%" onclick="nextQ()">${Z.idx+1>=Z.qs.length||Z.hearts<=0?'看成績':'下一題'}</button>`;
  }
  $app.innerHTML = `
    <div class="top">
      <button class="back" onclick="go('home')" aria-label="離開">✕</button>
      <h2>聽力挑戰</h2>
      <span class="pill">${Z.idx+1} / ${Z.qs.length}</span>
      <span class="hearts" aria-label="生命">${'❤️'.repeat(Z.hearts)}${'🖤'.repeat(Z.maxHearts-Z.hearts)}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="qbox">
      ${(()=>{ const sc=SCENES.find(x=>x.id===q.sid); return sc ? `<span class="qart" style="background-color:${artOf(sc)[0]}" title="${esc(sc.title)}">${sc.icon}</span>` : ''; })()}
      <div class="qtype">${label}</div>
      <button class="speak" onclick="playQ()">🔊 播放</button>
      <button class="speak" style="margin-top:10px;background:var(--paper);font-size:15px;padding:10px" onclick="slowQ()">🐢 慢速再聽一次</button>
      ${q.type==='fill'
        ? `<div class="qtext">${esc(Z.answered?q.full:q.text)}</div><div style="font-size:14px;opacity:.8;margin-top:4px">${esc(q.zh)}</div>`
        : (Z.showText||Z.answered ? `<div class="qtext">${esc(q.text)}</div>` : `<button class="showtxt" onclick="showText()">顯示英文文字</button>`)}
    </div>
    <div class="opts">${opts}</div>
    ${fb}`;
}
function slowQ(){
  const was=slow; slow=true;
  const q=state.quiz.qs[state.quiz.idx];
  speakOne(q.audio,q.role);
  slow=was;
}
function showText(){ state.quiz.showText=true; renderQuiz(); }
function hearOpt(i){
  const q=state.quiz.qs[state.quiz.idx];
  const role = state.quiz.qs[state.quiz.idx].role==='A' ? 'B' : 'A';
  speakOne(q.options[i], role);
}
function pick(i){
  const Z=state.quiz, q=Z.qs[Z.idx];
  if(Z.answered) return;
  Z.answered=true; Z.picked=i;
  const ok = q.options[i]===q.correct;
  if(ok){ Z.score+=10; } else { Z.hearts--; }
  sfx(ok ? 'right' : 'wrong');
  renderQuiz();
  const at = Z.idx;
  setTimeout(()=>{
    if(state.screen!=='quiz' || state.quiz!==Z || Z.idx!==at) return;
    if(q.type==='reply'){ speakOne(q.correct, q.role==='A'?'B':'A'); }
    else if(q.type==='fill'){ speakOne(q.audio, q.role); }
  }, 650);
}
function nextQ(){
  const Z=state.quiz;
  if(Z.idx+1>=Z.qs.length || Z.hearts<=0){ finishQuiz(); return; }
  Z.idx++; Z.answered=false; Z.picked=-1; Z.showText=false;
  renderQuiz();
  setTimeout(playQ,250);
}
function finishQuiz(){
  const Z=state.quiz;
  const max = Z.qs.length*10;
  if(Z.score>state.best && !Z.sceneId) state.best=Z.score;
  if(Z.sceneId){
    const r = Z.score/max;
    const n = r>=0.85?3 : r>=0.6?2 : r>0?1:0;
    if(r>=0.6) state.completed[Z.sceneId]=true;
    if(n > (state.stars[Z.sceneId]||0)) state.stars[Z.sceneId]=n;
  }
  saveProgress();
  go('result');
}
function renderResult(){
  const Z=state.quiz, max=Z.qs.length*10, r=Z.score/max;
  const n = r>=0.85?3 : r>=0.6?2 : r>0?1:0;
  const msg = n===3?'太棒了，說得出口也聽得懂！':n===2?'不錯喔，再練一次會更穩。':'多聽幾次對話，下次會更好。';
  setTimeout(()=>sfx(n>=1?'win':'lose'), 200);
  let nextBtn='';
  if(Z.sceneId){
    const k = SCENES.findIndex(s=>s.id===Z.sceneId);
    const nx = SCENES[k+1];
    if(nx) nextBtn = `<button class="btn primary" style="background:var(--mint);color:var(--ink)" onclick="openScene('${nx.id}')">下一個情境：${nx.icon} ${nx.title}</button>`;
  }
  $app.innerHTML = `
    <div class="result">
      <div class="mascot">${(()=>{ const sc=Z.sceneId && SCENES.find(x=>x.id===Z.sceneId); return sc ? sc.icon : '🎧'; })()}</div>
      <div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div>
      <h1>${msg}</h1>
      <div class="score">${Z.score} / ${max} 分</div>
      <div class="btns">
        <button class="btn primary" onclick="startQuiz(${Z.sceneId?`'${Z.sceneId}'`:'null'})">再挑戰一次</button>
        ${Z.sceneId?`<button class="btn sun" onclick="openScene('${Z.sceneId}')">回到對話複習</button>`:''}
        ${nextBtn}
        <button class="btn" onclick="go('home')">回首頁</button>
      </div>
    </div>`;
}

render();
</script>
