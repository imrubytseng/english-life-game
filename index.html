rs per day, and it reduces the deductible to zero.", "zh": "有，我們的全險每天十五元，可以把自負額降到零。"}, {"s": "B", "en": "I'll take the full coverage, just to be safe.", "zh": "為了安全起見，我要全險。"}, {"s": "A", "en": "Before you go, let's check the car together.", "zh": "出發前，我們一起檢查車子。", "h": "3. 檢查車況"}, {"s": "B", "en": "I see a scratch on the rear bumper.", "zh": "我看到後保險桿有一道刮痕。"}, {"s": "A", "en": "Thank you for pointing that out. Let me mark it on the form so you won't be charged for it.", "zh": "謝謝您指出來。我把它標記在表格上，這樣就不會向您收費。"}, {"s": "B", "en": "Could you also check the tires? They look a little low.", "zh": "你可以也檢查一下輪胎嗎？看起來有點扁。"}, {"s": "A", "en": "Sure. You're right. I'll have them filled up right away.", "zh": "好的。您說得對。我馬上叫人去充氣。"}, {"s": "B", "en": "The gas tank is full. Do I need to return it full as well?", "zh": "油箱是滿的。我也需要把它加滿再還嗎？"}, {"s": "A", "en": "Yes, please. Otherwise, we charge a refueling fee. The nearest gas station is two blocks from here.", "zh": "是的，麻煩您。否則我們會收加油費。最近的加油站離這裡兩個街口。"}, {"s": "B", "en": "What should I do if I have an accident or a flat tire?", "zh": "如果我出車禍或爆胎，該怎麼辦？"}, {"s": "A", "en": "Call this number on the key tag. Roadside assistance is available twenty-four hours a day.", "zh": "打鑰匙牌上的這支電話。道路救援二十四小時服務。"}, {"s": "B", "en": "Is there a mileage limit?", "zh": "有里程限制嗎？", "h": "4. 簽約與出發"}, {"s": "A", "en": "No, it's unlimited mileage.", "zh": "沒有，里程不限。"}, {"s": "B", "en": "Are there any toll roads around here?", "zh": "這附近有收費道路嗎？"}, {"s": "A", "en": "Yes, a few. You can pay cash, or use the electronic pass in the car, and we'll charge it to your card afterward.", "zh": "有，幾條。您可以付現金，或使用車上的電子票證，我們之後會從您的卡上扣款。"}, {"s": "B", "en": "That's convenient. Can I return the car at the airport?", "zh": "很方便。我可以在機場還車嗎？"}, {"s": "A", "en": "Yes, but there's a one-way fee of twenty dollars.", "zh": "可以，但需要收二十元的異地還車費。"}, {"s": "B", "en": "I'll return it here then, to save the fee.", "zh": "那我就在這裡還車，省下這筆費用。"}, {"s": "A", "en": "Sounds good. Please sign here and here. The estimated total is four hundred eighty dollars.", "zh": "好的。請在這裡和這裡簽名。預估總額是四百八十元。"}, {"s": "B", "en": "Done. Where is the car parked?", "zh": "簽好了。車子停在哪裡？"}, {"s": "A", "en": "Parking space fourteen, right outside. Here are your keys.", "zh": "十四號停車位，就在外面。這是您的鑰匙。"}, {"s": "B", "en": "Thank you for your help.", "zh": "謝謝你的協助。"}, {"s": "A", "en": "You're welcome. Drive safely, and enjoy your trip!", "zh": "不客氣。請小心駕駛，旅途愉快！"}]},
  {"id": "tour", "icon": "🎟️", "title": "景點購票與參觀", "en": "Buying Tickets at an Attraction", "roles": {"A": "Ticket seller 售票員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hello, how much is admission to the museum?", "zh": "你好，博物館的入場費是多少？", "h": "1. 票價與優惠"}, {"s": "A", "en": "Adults are fifteen dollars, children under twelve are seven, and students are ten with a valid ID.", "zh": "成人十五元，十二歲以下兒童七元，學生出示有效證件十元。"}, {"s": "B", "en": "I'm traveling with my friend, who is a student, and my nephew, who is eight.", "zh": "我和我的朋友一起旅行，他是學生，還有我八歲的外甥。"}, {"s": "A", "en": "Then that's one adult ticket, one student ticket, and one child ticket. The total is thirty-two dollars.", "zh": "那就是一張全票、一張學生票和一張兒童票。總共三十二元。"}, {"s": "B", "en": "Is there a family or group discount?", "zh": "有家庭或團體優惠嗎？"}, {"s": "A", "en": "We have a family pass for two adults and up to three children for forty dollars, but it doesn't include students.", "zh": "我們有一張兩位大人加最多三位小孩的家庭票，四十元，但不包含學生。"}, {"s": "B", "en": "I see. Then the separate tickets are cheaper. We'll take those.", "zh": "我明白了。那分開買比較便宜。我們買那個。"}, {"s": "A", "en": "Would you like to add an audio guide? It's five dollars per person.", "zh": "你們想加購語音導覽嗎？每人五元。", "h": "2. 導覽與路線"}, {"s": "B", "en": "Do you have one in Chinese?", "zh": "有中文的嗎？"}, {"s": "A", "en": "Yes, we have Chinese, Japanese, Korean, Spanish, and French. There's also a special version for children.", "zh": "有，我們有中文、日文、韓文、西班牙文和法文。也有給兒童的特別版本。"}, {"s": "B", "en": "That's great. We'll take two regular ones and one for children.", "zh": "太好了。我們要兩個一般的和一個兒童版的。"}, {"s": "A", "en": "Sure. That's fifteen dollars more. Please leave your ID as a deposit, and you'll get it back when you return the guides.", "zh": "好的。這樣要多十五元。請留下您的證件作為押金，歸還導覽機時就會退還。"}, {"s": "B", "en": "Here's my driver's license. What are the highlights that we shouldn't miss?", "zh": "這是我的駕照。有哪些重點是我們不該錯過的？"}, {"s": "A", "en": "The ancient art collection on the second floor is very famous. And the dinosaur hall on the first floor is popular with children.", "zh": "二樓的古代藝術收藏非常有名。一樓的恐龍廳很受孩子們歡迎。"}, {"s": "B", "en": "How long does it take to see everything?", "zh": "把所有東西看完需要多久？"}, {"s": "A", "en": "About three hours, if you don't hurry. There's a map at the entrance, and the main route takes about ninety minutes.", "zh": "如果不趕時間，大約三小時。入口有地圖，主要路線大約要九十分鐘。"}, {"s": "B", "en": "Are there any special exhibitions today?", "zh": "今天有任何特展嗎？", "h": "3. 規定與設施"}, {"s": "A", "en": "Yes, there's an exhibition about space exploration on the third floor. It costs five dollars extra, but it's included in the family pass.", "zh": "有，三樓有一場太空探索展。要另外收五元，但家庭票有包含。"}, {"s": "B", "en": "That would be perfect for my nephew. We'll add it.", "zh": "那對我外甥來說太完美了。我們加購。"}, {"s": "A", "en": "Great. Please remember that photos are allowed, but you can't use a flash. And please don't touch the exhibits.", "zh": "好的。請記得可以拍照，但不能使用閃光燈。也請不要觸摸展品。"}, {"s": "B", "en": "Understood. Can we bring our backpacks inside?", "zh": "了解。我們可以把背包帶進去嗎？"}, {"s": "A", "en": "Small bags are fine, but large backpacks must go in the lockers, which are free. They're just behind you.", "zh": "小包包可以，但大型背包必須放進置物櫃，免費使用。就在您後面。"}, {"s": "B", "en": "Is there a place to eat inside?", "zh": "裡面有地方可以吃東西嗎？"}, {"s": "A", "en": "Yes, there's a café on the first floor, and a picnic area in the garden. Outside food is not allowed in the galleries.", "zh": "有，一樓有咖啡廳，花園裡有野餐區。展廳內不可飲食。"}, {"s": "B", "en": "Where are the restrooms?", "zh": "洗手間在哪裡？"}, {"s": "A", "en": "On every floor, next to the elevators. There's also a baby room on the second floor.", "zh": "每一層樓都有，在電梯旁邊。二樓還有哺乳室。"}, {"s": "B", "en": "What time does the museum close?", "zh": "博物館幾點關門？", "h": "4. 營業時間與紀念品"}, {"s": "A", "en": "We close at six, and the last entry is at five thirty. On Fridays, we stay open until eight.", "zh": "我們六點閉館，最後入場時間是五點半。週五開到晚上八點。"}, {"s": "B", "en": "Can I use the ticket again tomorrow if we don't finish?", "zh": "如果我們沒看完，明天可以再使用這張票嗎？"}, {"s": "A", "en": "Unfortunately not, but you can upgrade to a two-day pass for ten dollars more, if you decide today.", "zh": "很遺憾不行，但如果您今天決定，可以多付十元升級成兩日券。"}, {"s": "B", "en": "Hmm, let's see how it goes. Do you have a gift shop?", "zh": "嗯，我們看看情況再說。你們有紀念品店嗎？"}, {"s": "A", "en": "Yes, it's by the exit. It has books, postcards, and toys. You get a ten percent discount with your ticket.", "zh": "有，在出口旁邊。有書、明信片和玩具。憑票可以打九折。"}, {"s": "B", "en": "That's nice. Thank you for all the information.", "zh": "真不錯。謝謝你提供的所有資訊。"}, {"s": "A", "en": "You're welcome. Here are your tickets and audio guides. Enjoy your visit!", "zh": "不客氣。這是您的門票和語音導覽機。祝您參觀愉快！"}, {"s": "B", "en": "Thank you. Have a good day!", "zh": "謝謝。祝你有美好的一天！"}]},
  {"id": "roomissue", "icon": "🛏️", "title": "飯店房間有問題", "en": "A Problem in the Hotel Room", "roles": {"A": "Front desk 櫃台人員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hello, this is room three-ten. I'm calling because the air conditioner isn't working.", "zh": "你好，這裡是 310 號房。我打來是因為冷氣壞了。", "h": "1. 通報冷氣問題"}, {"s": "A", "en": "I'm very sorry about that. Can you tell me what exactly is happening?", "zh": "非常抱歉。你可以告訴我確切是什麼情況嗎？"}, {"s": "B", "en": "I turned it on, and the screen lights up, but only warm air comes out. The room is really hot.", "zh": "我把它打開了，螢幕有亮，但只有吹出熱風。房間真的很熱。"}, {"s": "A", "en": "Did you try changing the temperature setting or turning it off and on again?", "zh": "你有試過調整溫度設定，或關掉再重新打開嗎？"}, {"s": "B", "en": "Yes, I tried both several times, and it didn't help.", "zh": "有，我兩個都試了好幾次，沒有用。"}, {"s": "A", "en": "I understand. I'll send a technician to your room right away. Will you be in the room for the next fifteen minutes?", "zh": "我了解。我會馬上派技師到您的房間。接下來十五分鐘您會在房間嗎？"}, {"s": "B", "en": "Yes, I'll wait here. Also, there are no towels in the bathroom.", "zh": "會，我會在這裡等。另外，浴室裡沒有毛巾。"}, {"s": "A", "en": "I'm so sorry. I'll ask housekeeping to bring some fresh towels. How many do you need?", "zh": "非常抱歉。我請房務人員送一些乾淨的毛巾過去。您需要幾條？"}, {"s": "B", "en": "Four bath towels and two hand towels, please. We're two people.", "zh": "四條浴巾和兩條擦手巾，麻煩你。我們是兩個人。"}, {"s": "A", "en": "Of course. They'll be there in about ten minutes.", "zh": "沒問題。大約十分鐘後會送到。"}, {"s": "A", "en": "Hello, this is the front desk again. The technician has just checked your air conditioner.", "zh": "您好，這裡又是櫃台。技師剛檢查完您的冷氣。", "h": "2. 技師檢查與其他問題"}, {"s": "B", "en": "What did he find?", "zh": "他發現了什麼？"}, {"s": "A", "en": "He says the cooling system needs a new part, and it can't be fixed until tomorrow morning.", "zh": "他說冷卻系統需要換新零件，要到明天早上才能修好。"}, {"s": "B", "en": "That's a problem. It's very hot tonight, and we can't sleep without air conditioning.", "zh": "這是個問題。今晚很熱，沒有冷氣我們睡不著。"}, {"s": "A", "en": "I understand completely. Would you like to move to another room?", "zh": "我完全了解。您想要換到別的房間嗎？"}, {"s": "B", "en": "Yes, please. Is there a room available on the same floor or nearby?", "zh": "好的，麻煩你。同一層樓或附近有空房嗎？"}, {"s": "A", "en": "Let me check. I have a room on the fifth floor, room five-oh-four. It has a similar view, but it's a little smaller.", "zh": "我查一下。五樓有一間 504 號房。景觀類似，但稍微小一點。"}, {"s": "B", "en": "That's fine. One more problem: the hot water in the shower wasn't working properly this morning.", "zh": "沒關係。還有一個問題：今天早上淋浴間的熱水不太正常。", "h": "3. 換房與熱水問題"}, {"s": "A", "en": "I'm sorry to hear that. Was it too cold, or did the temperature change?", "zh": "很遺憾聽到這件事。是太冷，還是溫度忽冷忽熱？"}, {"s": "B", "en": "It was lukewarm at first, and then it turned very cold after two minutes.", "zh": "一開始是溫的，兩分鐘後就變得很冷。"}, {"s": "A", "en": "I'll ask the technician to check the new room's shower before you move in, so you won't have the same problem.", "zh": "我會請技師在您入住之前先檢查新房間的淋浴設備，這樣您就不會遇到同樣的問題。"}, {"s": "B", "en": "Thank you. I appreciate it. How do we move our luggage?", "zh": "謝謝你。我很感激。我們要怎麼搬行李？"}, {"s": "A", "en": "A bellhop will come to your room and carry everything for you. You don't need to do anything.", "zh": "行李員會到您的房間幫您搬運所有東西。您什麼都不需要做。"}, {"s": "B", "en": "Great. We have two suitcases and a few shopping bags.", "zh": "太好了。我們有兩個行李箱和幾個購物袋。"}, {"s": "A", "en": "No problem. He'll be there in five minutes. Here are the new key cards, which I'll send up with him.", "zh": "沒問題。他五分鐘後會到。新的房卡我會請他一起帶上去。"}, {"s": "B", "en": "Thank you. Will the charge for the room stay the same?", "zh": "謝謝。房價會維持不變嗎？", "h": "4. 補償與道歉"}, {"s": "A", "en": "Yes, there's no change. And because of the trouble, we'd like to offer you a free breakfast tomorrow for two.", "zh": "會，價格不變。而且因為造成不便，我們想招待您明天兩人份的免費早餐。"}, {"s": "B", "en": "That's very kind of you. Thank you.", "zh": "你們真貼心。謝謝。"}, {"s": "A", "en": "We'd also like to give you a ten percent discount on tonight's room rate.", "zh": "我們也想給您今晚房價九折的優惠。"}, {"s": "B", "en": "I appreciate that. I understand these things happen.", "zh": "我很感激。我了解這種事難免會發生。"}, {"s": "A", "en": "Thank you for being so understanding. Please call us if there's anything else you need.", "zh": "謝謝您這麼體諒。如果還需要什麼，請打給我們。"}, {"s": "B", "en": "I will. What time does breakfast start?", "zh": "我會的。早餐幾點開始？"}, {"s": "A", "en": "Breakfast is from six thirty to ten in the restaurant on the second floor.", "zh": "早餐從六點半到十點，在二樓的餐廳。"}, {"s": "B", "en": "Perfect. Thanks for taking care of everything.", "zh": "太好了。謝謝你處理好一切。"}, {"s": "A", "en": "My pleasure. We hope you enjoy the rest of your stay. Good night!", "zh": "這是我的榮幸。希望您接下來的住宿愉快。晚安！"}]},
  {"id": "haircut", "icon": "💇", "title": "美髮沙龍", "en": "At the Hair Salon", "roles": {"A": "Stylist 設計師", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi! Welcome to Style Studio. Do you have an appointment?", "zh": "嗨！歡迎光臨風格工作室。您有預約嗎？", "h": "1. 討論髮型"}, {"s": "B", "en": "Yes, I have a two o'clock appointment under Lee.", "zh": "有，我預約了兩點，名字是李。"}, {"s": "A", "en": "Great. Please have a seat. I'll be with you in just a moment.", "zh": "太好了。請坐。我馬上為您服務。"}, {"s": "A", "en": "All right, come on over. What would you like to do today?", "zh": "好了，請過來。您今天想做什麼？"}, {"s": "B", "en": "I'd like a haircut and maybe some color.", "zh": "我想剪頭髮，也許再染個顏色。"}, {"s": "A", "en": "Sure. Let's start with the cut. How much would you like to take off?", "zh": "好的。我們先從剪髮開始。您想剪掉多少？"}, {"s": "B", "en": "About five centimeters. I'd like to keep the length, but get rid of the split ends.", "zh": "大約五公分。我想維持長度，但去掉分叉的髮尾。"}, {"s": "A", "en": "Do you want layers, or would you like it all one length?", "zh": "您想要層次，還是全部剪成同樣長度？"}, {"s": "B", "en": "I think some layers would be nice, especially around my face.", "zh": "我覺得一些層次不錯，尤其是臉旁邊。"}, {"s": "A", "en": "Do you have a picture of the style you like?", "zh": "您有想要的髮型照片嗎？"}, {"s": "B", "en": "Yes, let me show you on my phone.", "zh": "有，我用手機給你看。"}, {"s": "A", "en": "Oh, that's a beautiful cut. I can do that for you.", "zh": "哦，這個髮型很漂亮。我可以幫您剪。"}, {"s": "A", "en": "Let's go to the sink first. Is the water temperature okay?", "zh": "我們先到洗頭台。水溫可以嗎？", "h": "2. 洗頭與剪髮"}, {"s": "B", "en": "It's a little hot. Could you make it cooler?", "zh": "有點熱。可以調涼一點嗎？"}, {"s": "A", "en": "Of course. How's that?", "zh": "當然。這樣如何？"}, {"s": "B", "en": "Perfect.", "zh": "剛剛好。"}, {"s": "A", "en": "Would you like a scalp massage?", "zh": "您想要頭皮按摩嗎？"}, {"s": "B", "en": "Yes, please. That feels great.", "zh": "好的，麻煩你。感覺很棒。"}, {"s": "A", "en": "Now let's start cutting. Please tell me if it's too short.", "zh": "現在開始剪。如果太短請告訴我。"}, {"s": "B", "en": "Okay. Could you leave my bangs a little longer?", "zh": "好的。可以把我的瀏海留長一點嗎？"}, {"s": "A", "en": "Sure. I'll just trim them slightly.", "zh": "當然。我只會稍微修一下。"}, {"s": "A", "en": "Now for the color. What color are you thinking?", "zh": "現在談染髮。您想染什麼顏色？", "h": "3. 染髮"}, {"s": "B", "en": "I'd like a light brown with a few caramel highlights.", "zh": "我想染淺棕色，加幾絲焦糖挑染。"}, {"s": "A", "en": "That will look lovely with your skin tone. The color will take about an hour to set.", "zh": "那會很襯您的膚色。染髮大約需要一小時定色。"}, {"s": "B", "en": "That's fine. Is the dye safe for sensitive scalps? I tend to get itchy.", "zh": "沒問題。染劑對敏感頭皮安全嗎？我容易發癢。"}, {"s": "A", "en": "Yes, we use a gentle, ammonia-free formula.", "zh": "是的，我們使用溫和、不含氨的配方。"}, {"s": "B", "en": "Good. Could I have a magazine while I wait?", "zh": "太好了。等待時可以給我一本雜誌嗎？"}, {"s": "A", "en": "Of course. Would you like some tea or coffee?", "zh": "當然。您想喝茶或咖啡嗎？"}, {"s": "B", "en": "Green tea, please.", "zh": "綠茶，麻煩你。"}, {"s": "A", "en": "All done! Let me blow-dry your hair and style it.", "zh": "完成了！我幫您吹乾並整理造型。", "h": "4. 完成與結帳"}, {"s": "A", "en": "Here's a mirror so you can see the back. What do you think?", "zh": "這是鏡子，讓您看後面。您覺得如何？"}, {"s": "B", "en": "I love it! The color is exactly what I wanted.", "zh": "我好喜歡！顏色正是我想要的。"}, {"s": "A", "en": "I'm so glad. To keep the color fresh, use a sulfate-free shampoo and avoid washing your hair every day.", "zh": "太好了。為了讓顏色持久，請使用不含硫酸鹽的洗髮精，並避免每天洗頭。"}, {"s": "B", "en": "Thanks for the tip. How much do I owe you?", "zh": "謝謝你的建議。我該付多少錢？"}, {"s": "A", "en": "The haircut is fifty dollars, and the color with highlights is one hundred twenty dollars, so one hundred seventy dollars in total.", "zh": "剪髮五十元，染髮加挑染一百二十元，總共一百七十元。"}, {"s": "B", "en": "Can I pay by card? And is a tip included?", "zh": "我可以刷卡嗎？小費有包含嗎？"}, {"s": "A", "en": "Yes, you can pay by card. The tip isn't included.", "zh": "可以刷卡。小費沒有包含。"}, {"s": "B", "en": "Here you go. I'll add twenty percent for you.", "zh": "給你。我會加兩成給你。"}, {"s": "A", "en": "Thank you so much! Would you like to book your next appointment?", "zh": "非常謝謝！您想預約下一次嗎？"}, {"s": "B", "en": "Yes. Can I come back in six weeks for a trim?", "zh": "好的。我可以六週後回來修剪嗎？"}, {"s": "A", "en": "Sure. I'll book you in for the twentieth. See you then!", "zh": "好的。我幫您預約二十號。到時見！"}]},
  {"id": "dentist", "icon": "🦷", "title": "看牙醫", "en": "Visiting the Dentist", "roles": {"A": "Dentist 牙醫", "B": "You 你"}, "lines": [{"s": "A", "en": "Good afternoon. Please have a seat. What brings you in today?", "zh": "午安。請坐。今天為什麼來看診呢？", "h": "1. 說明症狀"}, {"s": "B", "en": "I've had a toothache on the lower right side for three days.", "zh": "我右下方的牙齒痛了三天。"}, {"s": "A", "en": "Does it hurt all the time, or only when you eat or drink something?", "zh": "是一直痛，還是只有吃東西或喝東西的時候才痛？"}, {"s": "B", "en": "Mostly when I drink something cold or sweet. Last night it hurt so much that I couldn't sleep.", "zh": "大多是喝冰的或甜的東西時。昨晚痛到我睡不著。"}, {"s": "A", "en": "I see. Have you noticed any swelling or bleeding?", "zh": "我明白了。你有發現任何腫脹或出血嗎？"}, {"s": "B", "en": "No swelling, but my gums bleed a little when I brush my teeth.", "zh": "沒有腫，但刷牙時牙齦會有一點出血。"}, {"s": "A", "en": "Have you had any dental problems before?", "zh": "你以前有過任何牙齒問題嗎？"}, {"s": "B", "en": "I had a cavity filled two years ago, but nothing since then.", "zh": "兩年前補過一顆蛀牙，之後就沒有問題了。"}, {"s": "A", "en": "Please lean back and open wide. Let me take a look.", "zh": "請往後靠，張大嘴。讓我看看。", "h": "2. 檢查與 X 光"}, {"s": "A", "en": "Does it hurt when I tap here?", "zh": "我敲這裡會痛嗎？"}, {"s": "B", "en": "Ouch! Yes, that hurts.", "zh": "哎喲！會，很痛。"}, {"s": "A", "en": "Sorry about that. I'd like to take an X-ray to see what's going on.", "zh": "抱歉。我想拍一張 X 光，看看是什麼情況。"}, {"s": "B", "en": "Will it hurt?", "zh": "會痛嗎？"}, {"s": "A", "en": "Not at all. Please wear this lead apron and bite down on this piece.", "zh": "一點也不會。請穿上這件鉛衣，並咬住這個片子。"}, {"s": "A", "en": "All done. Take a look at the screen. You can see a dark area here. That's a cavity, and it's deep.", "zh": "好了。請看螢幕。你可以看到這裡有一塊暗處。那是蛀牙，而且很深。"}, {"s": "B", "en": "Is it serious?", "zh": "嚴重嗎？"}, {"s": "A", "en": "Not yet. But it's close to the nerve, so we shouldn't wait. If it gets infected, you'll need a root canal.", "zh": "還不嚴重。但它靠近神經，所以我們不應該拖。如果感染了，你就需要做根管治療。"}, {"s": "B", "en": "I don't want that. What do you recommend?", "zh": "我不想那樣。你建議怎麼做？"}, {"s": "A", "en": "I recommend filling the cavity today.", "zh": "我建議今天就把蛀牙補起來。", "h": "3. 補牙治療"}, {"s": "B", "en": "How long will it take?", "zh": "要多久時間？"}, {"s": "A", "en": "About thirty to forty minutes. I'll numb the area first.", "zh": "大約三十到四十分鐘。我會先麻醉那個部位。"}, {"s": "B", "en": "Will I feel any pain?", "zh": "我會感覺到痛嗎？"}, {"s": "A", "en": "You'll feel a small pinch from the injection. After that, the area will feel numb.", "zh": "打針時你會感覺到輕微的刺痛。之後那個部位就會麻麻的。"}, {"s": "B", "en": "Okay. I'm a little nervous.", "zh": "好的。我有點緊張。"}, {"s": "A", "en": "That's perfectly normal. If you want me to stop at any time, just raise your left hand.", "zh": "這很正常。如果你想要我隨時停下來，只要舉起你的左手。"}, {"s": "A", "en": "Is your mouth numb now?", "zh": "你的嘴巴現在麻了嗎？"}, {"s": "B", "en": "Yes, my lip feels strange.", "zh": "對，我的嘴唇感覺怪怪的。"}, {"s": "A", "en": "Good. I'll start now. You may feel some pressure, but it shouldn't hurt.", "zh": "很好。我現在開始。你可能會感覺到一些壓力，但不應該痛。"}, {"s": "A", "en": "Almost done. Please bite down gently. Does it feel too high?", "zh": "快好了。請輕輕咬合。會覺得太高嗎？"}, {"s": "B", "en": "A little bit, yes.", "zh": "有一點，對。"}, {"s": "A", "en": "Let me adjust it. How does that feel?", "zh": "我來調整一下。現在感覺如何？"}, {"s": "B", "en": "Much better. Thank you.", "zh": "好多了。謝謝。"}, {"s": "A", "en": "The filling is done. Don't eat anything for two hours, until the numbness goes away.", "zh": "補好了。兩小時內不要吃東西，等麻藥退掉。", "h": "4. 術後注意事項"}, {"s": "B", "en": "Can I drink water?", "zh": "我可以喝水嗎？"}, {"s": "A", "en": "Yes, but be careful not to bite your tongue or cheek while it's numb.", "zh": "可以，但麻醉還沒退時，小心不要咬到舌頭或臉頰。"}, {"s": "B", "en": "What about brushing my teeth tonight?", "zh": "那今晚刷牙呢？"}, {"s": "A", "en": "Brush gently with a soft toothbrush, and remember to floss every day.", "zh": "用軟毛牙刷輕輕刷，並記得每天使用牙線。"}, {"s": "B", "en": "Should I come back for another visit?", "zh": "我需要再回診嗎？"}, {"s": "A", "en": "Yes. You have some gum inflammation, so I'd like you to come back next week for a cleaning.", "zh": "需要。你有一些牙齦發炎，所以我希望你下週回來洗牙。"}, {"s": "B", "en": "How much is today's treatment?", "zh": "今天的治療費用是多少？"}, {"s": "A", "en": "The filling is one hundred twenty dollars, and your insurance covers eighty percent, so you pay twenty-four dollars.", "zh": "補牙是一百二十元，你的保險負擔百分之八十，所以你要付二十四元。"}, {"s": "B", "en": "That's reasonable. Thank you, Doctor.", "zh": "很合理。謝謝您，醫生。"}, {"s": "A", "en": "You're welcome. Call us if the pain comes back. Take care!", "zh": "不客氣。如果疼痛又出現，請打電話給我們。保重！"}]},
  {"id": "library", "icon": "📚", "title": "辦借書證與借書", "en": "At the Library", "roles": {"A": "Librarian 圖書館員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, I'd like to get a library card, please.", "zh": "嗨，我想辦一張借書證。", "h": "1. 辦理借書證"}, {"s": "A", "en": "Of course. Are you a resident of this city?", "zh": "當然。您是這座城市的居民嗎？"}, {"s": "B", "en": "Yes, I moved here two months ago.", "zh": "是的，我兩個月前搬來這裡。"}, {"s": "A", "en": "Welcome! Do you have a photo ID and something that shows your address, like a utility bill or a rental contract?", "zh": "歡迎！您有附照片的證件，和可以證明地址的文件嗎？例如水電費帳單或租賃合約。"}, {"s": "B", "en": "Yes, here is my passport and my rental contract.", "zh": "有，這是我的護照和租賃合約。"}, {"s": "A", "en": "Perfect. Please fill out this application form, and choose a four-digit PIN for your account.", "zh": "很好。請填寫這份申請表，並為您的帳號選一組四位數密碼。"}, {"s": "B", "en": "Okay. Is there a fee for the library card?", "zh": "好的。辦借書證要收費嗎？"}, {"s": "A", "en": "No, it's completely free for residents. Here's your card. You can start borrowing right away.", "zh": "不用，居民完全免費。這是您的卡片。您可以馬上開始借書。"}, {"s": "B", "en": "How many books can I borrow at a time?", "zh": "我一次可以借幾本書？", "h": "2. 借書規則"}, {"s": "A", "en": "You can borrow up to ten books, plus five DVDs, for three weeks.", "zh": "您最多可以借十本書，加上五張 DVD，借期三週。"}, {"s": "B", "en": "Can I renew them if I haven't finished reading?", "zh": "如果我還沒讀完，可以續借嗎？"}, {"s": "A", "en": "Yes, you can renew each item twice, either online, by phone, or at the desk, unless someone else has reserved it.", "zh": "可以，每項物品可以續借兩次，在網路上、電話中或櫃台都可以，除非有人預約了。"}, {"s": "B", "en": "What happens if I return a book late?", "zh": "如果我晚還書會怎麼樣？"}, {"s": "A", "en": "There's a late fee of ten cents per day for each book. If it's more than a month late, your account will be suspended.", "zh": "每本書每天罰款十分錢。如果逾期超過一個月，您的帳號會被暫停。"}, {"s": "B", "en": "That's fair. What if I lose a book?", "zh": "很合理。如果我弄丟一本書呢？"}, {"s": "A", "en": "You'd pay the price of the book plus a five-dollar handling fee. But please come and talk to us first.", "zh": "您需要賠償書的價格，加上五元的處理費。但請先來和我們談談。"}, {"s": "B", "en": "Okay. I'm looking for a few books on learning English. Where should I look?", "zh": "好的。我在找幾本學英文的書。我應該去哪裡找？", "h": "3. 找書與使用設施"}, {"s": "A", "en": "Those are in the language section on the second floor, in the back, next to the windows.", "zh": "那些在二樓的語言區，在後面靠窗的地方。"}, {"s": "B", "en": "Is there a way to search for a specific book?", "zh": "有辦法搜尋特定的書嗎？"}, {"s": "A", "en": "Yes, you can use the computers over there or our app. Type the title or the author, and it shows if the book is available.", "zh": "有，您可以使用那邊的電腦或我們的 App。輸入書名或作者，就會顯示書有沒有在館。"}, {"s": "B", "en": "What if the book I want is already borrowed?", "zh": "如果我想要的書已經被借走了呢？"}, {"s": "A", "en": "You can reserve it. We'll send you an email when it's ready, and we'll hold it for you for seven days.", "zh": "您可以預約。書備妥時我們會寄電子郵件給您，並為您保留七天。"}, {"s": "B", "en": "Great. Do you have a quiet place to study?", "zh": "太好了。你們有安靜的地方可以讀書嗎？"}, {"s": "A", "en": "Yes, the third floor is a silent study area, and you can also book a small study room for two hours at a time.", "zh": "有，三樓是靜音自習區，您也可以一次預約一間小型自習室，使用兩小時。"}, {"s": "B", "en": "Is there free Wi-Fi?", "zh": "有免費 Wi-Fi 嗎？"}, {"s": "A", "en": "Yes, the password is on the board by the entrance. You can also use the printers. Printing costs ten cents per page.", "zh": "有，密碼在入口旁邊的板子上。您也可以使用印表機。影印每頁十分錢。"}, {"s": "B", "en": "Do you offer any classes or events?", "zh": "你們有舉辦任何課程或活動嗎？"}, {"s": "A", "en": "Yes, we have a free English conversation group every Tuesday evening, and a story time for children on Saturday mornings.", "zh": "有，我們每週二晚上有免費的英文會話小組，週六早上有兒童故事時間。"}, {"s": "B", "en": "The conversation group sounds perfect for me. Do I need to register?", "zh": "英文會話小組對我來說聽起來很完美。我需要報名嗎？", "h": "4. 借書與離開"}, {"s": "A", "en": "Just show up at six thirty. But please sign up at the desk so we can plan for enough chairs.", "zh": "直接在六點半出現就可以。但請在櫃台登記，我們才能準備足夠的椅子。"}, {"s": "B", "en": "I'll sign up now. Could you also help me check out these three books?", "zh": "我現在就登記。你也可以幫我辦理這三本書的借閱嗎？"}, {"s": "A", "en": "Of course. Please scan your card here, and place the books on the pad.", "zh": "當然。請在這裡刷您的卡片，並把書放在感應板上。"}, {"s": "B", "en": "Like this? It says the books are due on the thirty-first.", "zh": "這樣嗎？上面顯示書要在三十一號到期。"}, {"s": "A", "en": "That's right. Here is your receipt, with the due date.", "zh": "沒錯。這是您的收據，上面有到期日。"}, {"s": "B", "en": "Can I return the books at any branch of the library?", "zh": "我可以在任何一間分館還書嗎？"}, {"s": "A", "en": "Yes, you can return them at any branch, or put them in the drop box outside, even when we're closed.", "zh": "可以，您可以在任何分館還書，也可以放進外面的還書箱，即使我們沒有營業也可以。"}, {"s": "B", "en": "That's very convenient. Thank you for your help.", "zh": "非常方便。謝謝你的協助。"}, {"s": "A", "en": "You're welcome. Enjoy your books!", "zh": "不客氣。祝您閱讀愉快！"}]},
  {"id": "mobile", "icon": "📱", "title": "辦手機門號", "en": "Getting a Phone Plan", "roles": {"A": "Sales rep 業務人員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, I just moved here, and I need a phone plan. Can you help me?", "zh": "嗨，我剛搬來這裡，需要辦一個手機方案。你可以幫我嗎？", "h": "1. 選擇方案"}, {"s": "A", "en": "Of course. Welcome! Are you looking for a contract plan or a prepaid plan?", "zh": "當然。歡迎！您想找月租合約方案，還是預付卡方案？"}, {"s": "B", "en": "What's the difference?", "zh": "有什麼差別？"}, {"s": "A", "en": "A contract plan has a monthly bill, and it usually requires a one- or two-year agreement. With a prepaid plan, you pay in advance, and there's no contract.", "zh": "月租方案每月寄帳單，通常需要簽一到兩年的合約。預付卡方案是先付費，不需要簽約。"}, {"s": "B", "en": "I'll only be here for about a year, so I think prepaid is better.", "zh": "我只會在這裡待大約一年，所以我覺得預付卡比較好。"}, {"s": "A", "en": "That makes sense. How much data do you use per month?", "zh": "有道理。您每個月用多少流量？"}, {"s": "B", "en": "I watch a lot of videos, so probably about twenty gigabytes.", "zh": "我常看影片，所以大概二十 GB。"}, {"s": "A", "en": "We have a plan with thirty gigabytes for forty dollars a month, with unlimited calls and texts.", "zh": "我們有一個方案，每月四十元，有三十 GB 流量，通話和簡訊不限量。"}, {"s": "B", "en": "That sounds good. Does it include international calls to Taiwan?", "zh": "聽起來不錯。有包含打到台灣的國際電話嗎？", "h": "2. 國際電話與證件"}, {"s": "A", "en": "Not by default, but you can add an international pack for ten dollars, which gives you one hundred minutes.", "zh": "預設不包含，但您可以加購十元的國際通話包，有一百分鐘。"}, {"s": "B", "en": "I think messaging apps are enough for me, so I'll skip that.", "zh": "我想用通訊軟體就夠了，所以我先不加購。"}, {"s": "A", "en": "No problem. Do you want to keep your old phone number?", "zh": "沒問題。您想保留舊的電話號碼嗎？"}, {"s": "B", "en": "I'd like to keep it as a second number. Can I use two SIM cards?", "zh": "我想把它當作第二個號碼保留。我可以用兩張 SIM 卡嗎？"}, {"s": "A", "en": "If your phone supports dual SIM, yes. Is your phone unlocked?", "zh": "如果您的手機支援雙卡，就可以。您的手機已解鎖嗎？"}, {"s": "B", "en": "Yes, it is, and it supports dual SIM.", "zh": "是的，已解鎖，也支援雙卡。"}, {"s": "A", "en": "Great. I'll need to see your passport and a proof of address.", "zh": "太好了。我需要看您的護照和地址證明。"}, {"s": "B", "en": "Here's my passport, and here's my rental contract.", "zh": "這是我的護照，這是我的租賃合約。"}, {"s": "A", "en": "Thank you. Let me set up the SIM card for you.", "zh": "謝謝。我來幫您設定 SIM 卡。", "h": "3. 開通與設定"}, {"s": "A", "en": "Please turn off your phone and insert this card into the second tray.", "zh": "請把您的手機關機，並把這張卡插進第二個卡槽。"}, {"s": "B", "en": "Okay. Now I'll turn it back on.", "zh": "好的。現在我把它開機。"}, {"s": "B", "en": "It says No Service. Is something wrong?", "zh": "螢幕顯示「無服務」。有什麼問題嗎？"}, {"s": "A", "en": "Don't worry. It takes a few minutes to activate. Let's restart the phone.", "zh": "別擔心。開通需要幾分鐘。我們重新開機一次。"}, {"s": "B", "en": "Now I have four bars. It's working!", "zh": "現在有四格訊號了。成功了！"}, {"s": "A", "en": "Perfect. Let me send a test message to make sure everything is working.", "zh": "太好了。我傳一則測試簡訊，確認一切正常。"}, {"s": "B", "en": "I got it. How can I check my data usage?", "zh": "我收到了。我要怎麼查詢我的流量使用量？"}, {"s": "A", "en": "You can download our app, or just dial star one two three.", "zh": "您可以下載我們的 App，或直接撥 *123。"}, {"s": "B", "en": "And how do I top up when I run out of money?", "zh": "那我用完額度時要怎麼儲值？"}, {"s": "A", "en": "You can top up in the app, at any convenience store, or at the kiosk right over there.", "zh": "您可以在 App 上儲值、到任何便利商店儲值，或使用那邊的自助機台。"}, {"s": "B", "en": "What happens when I run out of data?", "zh": "如果流量用完會怎麼樣？", "h": "4. 費用與注意事項"}, {"s": "A", "en": "Your speed will slow down, or you can buy an extra data pack. It's five dollars for five gigabytes.", "zh": "您的速度會變慢，或者您可以加購流量包。五元可以買五 GB。"}, {"s": "B", "en": "Is there a fee for the SIM card itself?", "zh": "SIM 卡本身要收費嗎？"}, {"s": "A", "en": "Yes, there's a one-time fee of ten dollars. So your total today is fifty dollars.", "zh": "要，一次性費用十元。所以您今天的總額是五十元。"}, {"s": "B", "en": "Can I pay by card?", "zh": "我可以刷卡嗎？"}, {"s": "A", "en": "Of course. Please insert your card here.", "zh": "當然。請把卡片插入這裡。"}, {"s": "B", "en": "Does the plan expire if I don't use it?", "zh": "如果我沒有使用，方案會過期嗎？"}, {"s": "A", "en": "Each top-up is valid for thirty days. After that, you'll need to top up again to keep your number.", "zh": "每次儲值有效期是三十天。之後您需要再儲值，才能保留您的號碼。"}, {"s": "B", "en": "What should I do if I lose my phone?", "zh": "如果我的手機遺失了該怎麼辦？"}, {"s": "A", "en": "Call customer service at six one one, and they'll suspend your SIM right away.", "zh": "請打客服專線 611，他們會立刻幫您停用 SIM 卡。"}, {"s": "B", "en": "Thank you for all your help.", "zh": "謝謝你的所有協助。"}, {"s": "A", "en": "You're welcome. Enjoy your new number!", "zh": "不客氣。祝您使用新號碼愉快！"}]},
  {"id": "meeting", "icon": "🗓️", "title": "職場開會", "en": "In a Team Meeting", "roles": {"A": "Team lead 組長", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning, everyone. Let's get started. Today we have three items on the agenda: last month's sales, the new campaign, and next week's schedule.", "zh": "大家早安。我們開始吧。今天議程有三項：上個月的銷售、新的行銷活動，以及下週的行程。", "h": "1. 開場與議程"}, {"s": "B", "en": "Good morning. Sorry I'm a few minutes late. Could you tell me which item you've covered so far?", "zh": "早安。抱歉我遲到了幾分鐘。可以告訴我你們到目前討論到哪一項嗎？"}, {"s": "A", "en": "No problem. We've only just started, so you haven't missed anything. Let's begin with the sales numbers.", "zh": "沒關係。我們才剛開始，所以你沒有錯過任何事。我們從銷售數字開始。"}, {"s": "B", "en": "Sure. I've prepared a short report. Overall, our sales went up ten percent compared with the previous month.", "zh": "好的。我準備了一份簡短的報告。整體來說，我們的銷售額比上個月成長了百分之十。", "h": "2. 報告銷售數字"}, {"s": "A", "en": "That's great news. What caused the increase?", "zh": "這是好消息。是什麼原因造成成長？"}, {"s": "B", "en": "Mostly the new advertising campaign on social media. Our online orders increased by twenty-five percent.", "zh": "主要是社群媒體上的新廣告活動。我們的線上訂單增加了百分之二十五。"}, {"s": "A", "en": "Impressive. And what about our in-store sales?", "zh": "很亮眼。那我們的實體店銷售呢？"}, {"s": "B", "en": "They stayed about the same, but the average amount each customer spends went up slightly.", "zh": "差不多持平，但每位顧客的平均消費金額略有上升。"}, {"s": "A", "en": "Good. Were there any problems we should know about?", "zh": "很好。有任何我們需要知道的問題嗎？"}, {"s": "B", "en": "Yes. We had some delivery delays because of the holiday, and a few customers complained.", "zh": "有的。因為假期，我們有一些配送延遲，有幾位顧客抱怨。"}, {"s": "A", "en": "I see. How did we handle the complaints?", "zh": "我明白了。我們是怎麼處理這些抱怨的？"}, {"s": "B", "en": "We apologized right away and offered a ten percent discount on their next order.", "zh": "我們立刻道歉，並提供他們下次訂單九折優惠。"}, {"s": "A", "en": "That sounds fair. Thank you for the clear report. Does anyone have any questions?", "zh": "聽起來很合理。謝謝你清楚的報告。有人有問題嗎？"}, {"s": "B", "en": "I have a suggestion about the new campaign. I think we should expand it to video platforms.", "zh": "我對新活動有一個建議。我認為我們應該把它擴展到影音平台。", "h": "3. 討論新活動"}, {"s": "A", "en": "Interesting. Why video?", "zh": "有意思。為什麼是影片？"}, {"s": "B", "en": "Our customers are young, and they spend most of their free time watching short videos.", "zh": "我們的顧客很年輕，他們大部分的空閒時間都在看短影片。"}, {"s": "A", "en": "That makes sense. But what about the budget? We don't have much room this quarter.", "zh": "有道理。但預算呢？這一季我們沒有太多空間。"}, {"s": "B", "en": "I checked the numbers. If we cut the print ads, we would save about three thousand dollars, and that would cover the videos.", "zh": "我查過數字了。如果我們減少平面廣告，大約可以省下三千元，那就夠支付影片的費用。"}, {"s": "A", "en": "Good thinking. But I'm worried about the timeline. Can we finish the videos in two weeks?", "zh": "想得很周到。但我擔心時程。我們能在兩週內完成影片嗎？"}, {"s": "B", "en": "It will be tight, but I think it's possible if we start this week and ask the design team to help.", "zh": "會很趕，但我覺得如果我們這週就開始，並請設計團隊幫忙，是有可能的。"}, {"s": "A", "en": "I like the idea, but let's start with a small test first. Two videos, and then we'll look at the results.", "zh": "我喜歡這個想法，但我們先從小規模測試開始。兩支影片，然後看看成效。"}, {"s": "B", "en": "That's a good plan. I'll prepare a short proposal with the cost and the schedule.", "zh": "這是個好計畫。我會準備一份簡短的提案，包含成本和時程。"}, {"s": "A", "en": "Okay, let's summarize. You will prepare the video proposal, and Tom will contact the design team.", "zh": "好的，我們來總結。你負責準備影片提案，湯姆負責聯絡設計團隊。", "h": "4. 分配工作與結束"}, {"s": "B", "en": "When do you need the proposal?", "zh": "你什麼時候需要這份提案？"}, {"s": "A", "en": "By next Wednesday, so we can discuss it at the next meeting.", "zh": "下週三前，這樣我們才能在下次會議上討論。"}, {"s": "B", "en": "Understood. I'll send it by Tuesday afternoon, one day early.", "zh": "了解。我會在週二下午寄出，提早一天。"}, {"s": "A", "en": "Great. Now, about next week's schedule: I'll be away on Thursday and Friday for a business trip.", "zh": "太好了。接下來談下週的行程：我週四和週五要出差。"}, {"s": "B", "en": "Who should we contact if there's an urgent problem?", "zh": "如果有緊急問題，我們該聯絡誰？"}, {"s": "A", "en": "Please contact Emily. She'll be in charge while I'm away.", "zh": "請聯絡艾蜜莉。我不在的時候由她負責。"}, {"s": "B", "en": "Okay. Is our next meeting still on Monday at ten?", "zh": "好的。我們下次會議還是週一十點嗎？"}, {"s": "A", "en": "Yes, same time, same place. Please send me any agenda items by Friday.", "zh": "對，同樣的時間、同樣的地點。請在週五前把任何議程項目寄給我。"}, {"s": "B", "en": "Will you send out the meeting notes today?", "zh": "你今天會寄出會議紀錄嗎？"}, {"s": "A", "en": "Yes, I'll email them to everyone by the end of the day.", "zh": "會，我今天下班前會寄給大家。"}, {"s": "B", "en": "Thanks. Is there anything else we need to cover?", "zh": "謝謝。還有什麼需要討論的嗎？"}, {"s": "A", "en": "No, I think that's everything. Thank you all for your hard work today.", "zh": "沒有了，我想就這些。謝謝大家今天的辛苦。"}, {"s": "B", "en": "Thank you. Have a great day, everyone!", "zh": "謝謝。祝大家有美好的一天！"}]},
  {"id": "leave", "icon": "🏖️", "title": "向主管請假", "en": "Asking for Time Off", "roles": {"A": "Manager 主管", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, do you have a moment? I'd like to talk to you about taking some time off.", "zh": "不好意思，你有空嗎？我想和你談談請假的事。", "h": "1. 提出請假"}, {"s": "A", "en": "Of course. Come in and have a seat. When are you thinking of going?", "zh": "當然。請進來坐。你打算什麼時候請？"}, {"s": "B", "en": "I'd like to take five days off, from the fifteenth to the nineteenth of next month.", "zh": "我想請五天假，下個月十五號到十九號。"}, {"s": "A", "en": "That's a busy period for us. May I ask what the reason is?", "zh": "那是我們很忙的時期。請問原因是什麼？"}, {"s": "B", "en": "My sister is getting married, and I need to travel back home to attend the wedding.", "zh": "我姐姐要結婚了，我需要回家參加婚禮。"}, {"s": "A", "en": "Congratulations to your sister! That's wonderful news. Have you already booked your tickets?", "zh": "恭喜你姐姐！這是好消息。你已經訂好機票了嗎？"}, {"s": "B", "en": "Not yet. I wanted to talk to you first before buying anything.", "zh": "還沒有。我想先跟你談，再買任何東西。"}, {"s": "A", "en": "I appreciate that. Let me check the team calendar.", "zh": "我很感謝你這樣做。我來看一下團隊行事曆。"}, {"s": "A", "en": "It looks like Tom is also off on the sixteenth, so two people would be away on the same day.", "zh": "看起來湯姆在十六號也休假，所以同一天會有兩個人不在。", "h": "2. 確認日期與假別"}, {"s": "B", "en": "I see. Would it help if I moved my dates a little earlier, from the twelfth to the sixteenth?", "zh": "我明白了。如果我把日期提早一點，從十二號到十六號，會有幫助嗎？"}, {"s": "A", "en": "Hmm, the twelfth is the deadline for the quarterly report, so that wouldn't work either.", "zh": "嗯，十二號是季報的截止日，所以那樣也不行。"}, {"s": "B", "en": "I could finish the report before I leave. I can even submit it a few days early.", "zh": "我可以在離開前完成報告。我甚至可以提早幾天交。"}, {"s": "A", "en": "That would be great. In that case, your original dates should be fine.", "zh": "那太好了。這樣的話，你原本的日期應該沒問題。"}, {"s": "B", "en": "Thank you so much. Is it paid leave? I think I have eight days of annual leave left.", "zh": "非常謝謝你。這是帶薪假嗎？我想我還剩八天年假。"}, {"s": "A", "en": "Yes, it will come out of your annual leave. You'll still have three days left after that.", "zh": "是的，會從你的年假扣除。之後你還會剩三天。"}, {"s": "A", "en": "Who will cover your work while you're away?", "zh": "你不在的時候，誰會代理你的工作？", "h": "3. 工作交接"}, {"s": "B", "en": "I talked to Emily, and she's willing to handle my daily tasks.", "zh": "我跟艾蜜莉談過了，她願意處理我的日常工作。"}, {"s": "A", "en": "What about the clients you're working with? Will they need anything while you're gone?", "zh": "那你負責的客戶呢？你不在的時候，他們會需要什麼嗎？"}, {"s": "B", "en": "I'll write a handover document with each client's contact information and the current progress of each project.", "zh": "我會寫一份交接文件，包含每位客戶的聯絡資料和每個專案目前的進度。"}, {"s": "A", "en": "Good. Will you be reachable in case of an emergency?", "zh": "很好。如果有緊急狀況，聯絡得到你嗎？"}, {"s": "B", "en": "I'll check my email once a day and keep my phone on, but I'd like to disconnect as much as possible.", "zh": "我每天會查一次電子郵件，也會開著手機，但我希望盡可能不被打擾。"}, {"s": "A", "en": "That's reasonable. Please set an automatic reply in your email, and give people Emily's contact information.", "zh": "這很合理。請在你的電子郵件設定自動回覆，並提供艾蜜莉的聯絡資訊。"}, {"s": "B", "en": "Of course. I'll set it up on my last day before I leave.", "zh": "當然。我會在離開前的最後一天設定好。"}, {"s": "A", "en": "Please fill out the leave request form and send it to Human Resources.", "zh": "請填寫請假單，並寄給人資部門。", "h": "4. 填表與確認"}, {"s": "B", "en": "Where can I find the form?", "zh": "我在哪裡可以找到表格？"}, {"s": "A", "en": "It's on the company website, on the Employee Services page. You can fill it out online.", "zh": "在公司網站的員工服務頁面。你可以線上填寫。"}, {"s": "B", "en": "Do I need your signature?", "zh": "需要你的簽名嗎？"}, {"s": "A", "en": "Just send it to me for approval, and I'll approve it today.", "zh": "只要寄給我審核，我今天就會核准。"}, {"s": "B", "en": "Thank you. I really appreciate your understanding.", "zh": "謝謝你。我真的很感謝你的體諒。"}, {"s": "A", "en": "No problem. Family comes first. I just want to make sure the team is ready.", "zh": "沒問題。家人最重要。我只是想確保團隊準備好。"}, {"s": "B", "en": "I'll have everything ready a week before I go.", "zh": "我會在出發前一週把所有事情準備好。"}, {"s": "A", "en": "Perfect. Have a wonderful time at the wedding.", "zh": "太好了。祝你在婚禮上玩得開心。"}, {"s": "B", "en": "Thank you. I'll bring back some wedding candy for everyone.", "zh": "謝謝。我會帶一些喜糖回來給大家。"}, {"s": "A", "en": "That would be lovely. Thanks for planning ahead.", "zh": "那太好了。謝謝你提早規劃。"}, {"s": "B", "en": "Thanks again. Have a good afternoon!", "zh": "再次謝謝。祝你下午愉快！"}]},
  {"id": "firstday", "icon": "🆕", "title": "新人第一天上班", "en": "First Day at Work", "roles": {"A": "Coworker 同事", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi, you must be the new hire. Welcome to the team! I'm Jessica.", "zh": "嗨，你一定是新來的同事。歡迎加入團隊！我是潔西卡。", "h": "1. 迎接與參觀"}, {"s": "B", "en": "Hi, Jessica. Nice to meet you. I'm really excited to be here.", "zh": "嗨，潔西卡。很高興認識你。我真的很興奮來到這裡。"}, {"s": "A", "en": "We're glad to have you. Let me show you around. This is the main office area, and your desk is right over there, next to the window.", "zh": "我們很高興你加入。我帶你參觀一下。這是主要辦公區，你的座位就在那邊，靠窗。"}, {"s": "B", "en": "That's a great spot. Thank you.", "zh": "那個位子很棒。謝謝。"}, {"s": "A", "en": "The meeting rooms are down the hall. You can book them on the shared calendar.", "zh": "會議室在走廊那頭。你可以在共用行事曆上預約。"}, {"s": "B", "en": "Good to know. Where is the break room?", "zh": "知道了。休息室在哪裡？"}, {"s": "A", "en": "It's on the left, past the printer. There's free coffee, tea, and a refrigerator for your lunch.", "zh": "在左邊，經過影印機之後。那裡有免費的咖啡、茶，還有可以放午餐的冰箱。"}, {"s": "B", "en": "And where are the restrooms?", "zh": "那洗手間在哪裡？"}, {"s": "A", "en": "Right next to the elevators. You'll need your access card to open the door.", "zh": "就在電梯旁邊。你需要用你的門禁卡開門。"}, {"s": "A", "en": "Speaking of which, here is your access card and your laptop. The IT team has already set everything up for you.", "zh": "說到這個，這是你的門禁卡和筆電。資訊部門已經幫你設定好了。", "h": "2. 設備與帳號"}, {"s": "B", "en": "Thank you. How do I log in?", "zh": "謝謝。我要怎麼登入？"}, {"s": "A", "en": "Your username is your first name and last name, and your temporary password is on this note. You'll need to change it the first time.", "zh": "你的帳號是你的名字加姓氏，臨時密碼寫在這張便條上。你第一次需要更改它。"}, {"s": "B", "en": "Okay. Is there a guide for the company's software?", "zh": "好的。有公司軟體的使用指南嗎？"}, {"s": "A", "en": "Yes, there's a folder on the shared drive called New Employees. It has guides and videos.", "zh": "有，共用雲端硬碟裡有一個叫「新進員工」的資料夾。裡面有指南和影片。"}, {"s": "B", "en": "Great. I'll look at it this afternoon. Who should I ask if I have questions?", "zh": "太好了。我今天下午會看。如果有問題要問誰？"}, {"s": "A", "en": "You can ask me anytime. We also have a team chat group, and I'll add you to it right now.", "zh": "你隨時都可以問我。我們也有團隊聊天群組，我現在就把你加進去。"}, {"s": "A", "en": "Your manager, Mr. Wilson, will meet you at ten for a short orientation.", "zh": "你的主管威爾森先生十點會跟你見面，做一個簡短的新人說明。", "h": "3. 工作規定與午餐"}, {"s": "B", "en": "What should I expect during the orientation?", "zh": "新人說明會有什麼內容？"}, {"s": "A", "en": "He'll explain your role, your goals for the first three months, and the company rules.", "zh": "他會說明你的職責、前三個月的目標，還有公司規定。"}, {"s": "B", "en": "What are the working hours?", "zh": "上班時間是幾點？"}, {"s": "A", "en": "We start at nine and finish at six, with a one-hour lunch break. But we're flexible if you need to arrive a bit later.", "zh": "我們九點開始、六點結束，中間有一小時午休。但如果你需要晚一點到，我們也很有彈性。"}, {"s": "B", "en": "That's good to hear. What's the dress code?", "zh": "聽起來不錯。服裝規定是什麼？"}, {"s": "A", "en": "It's business casual. No suits needed, except for client meetings.", "zh": "是商務休閒。不需要穿西裝，除非是和客戶開會。"}, {"s": "A", "en": "Would you like to have lunch with the team today? We usually go out on Fridays, but we can go together today to welcome you.", "zh": "你今天想跟團隊一起吃午餐嗎？我們通常週五才出去吃，但今天可以一起去歡迎你。"}, {"s": "B", "en": "I'd love to. Thank you for including me.", "zh": "我很樂意。謝謝你邀請我。"}, {"s": "A", "en": "There's a nice Thai restaurant around the corner. Is that okay with you?", "zh": "轉角有一家不錯的泰式餐廳。你可以嗎？"}, {"s": "B", "en": "Sounds great. I'm not good with very spicy food, though.", "zh": "聽起來很棒。不過我不太能吃很辣的東西。"}, {"s": "A", "en": "No problem. You can order it mild. We'll leave at twelve thirty.", "zh": "沒問題。你可以點小辣。我們十二點半出發。"}, {"s": "B", "en": "Excuse me, Jessica, I have a quick question about the schedule.", "zh": "不好意思，潔西卡，我對行程有個小問題。", "h": "4. 一天的收尾"}, {"s": "A", "en": "Sure. What is it?", "zh": "當然。是什麼？"}, {"s": "B", "en": "Do I need to attend any meetings this week?", "zh": "這週我需要參加任何會議嗎？"}, {"s": "A", "en": "Yes, there's a team meeting on Wednesday at ten. You'll just listen this time, and you can introduce yourself briefly.", "zh": "有，週三十點有一場團隊會議。這次你只需要聽，也可以簡短地自我介紹。"}, {"s": "B", "en": "Thanks for the heads-up. I'll prepare a short introduction.", "zh": "謝謝你事先告訴我。我會準備一段簡短的自我介紹。"}, {"s": "A", "en": "Don't be nervous. Everyone here is very friendly.", "zh": "別緊張。這裡的每個人都很友善。"}, {"s": "B", "en": "Thank you so much for your help today. I feel much more comfortable now.", "zh": "非常謝謝你今天的幫忙。我現在覺得自在多了。"}, {"s": "A", "en": "You're welcome. Let me know if you need anything. See you at lunch!", "zh": "不客氣。有需要什麼隨時告訴我。午餐見！"}]},
  {"id": "coworker", "icon": "💬", "title": "和同事閒聊", "en": "Chatting with a Coworker", "roles": {"A": "Coworker 同事", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning! How was your weekend?", "zh": "早安！你週末過得怎麼樣？", "h": "1. 聊週末"}, {"s": "B", "en": "It was great, thanks. I went hiking with some friends. How about you?", "zh": "很棒，謝謝。我和幾個朋友去健行。你呢？"}, {"s": "A", "en": "That sounds fun. Where did you go?", "zh": "聽起來很有趣。你們去了哪裡？"}, {"s": "B", "en": "A mountain about an hour from the city. The view from the top was amazing.", "zh": "離市區大約一小時的一座山。山頂的風景很棒。"}, {"s": "A", "en": "I should try that sometime. I stayed home all weekend and watched TV.", "zh": "我應該找時間試試。我整個週末都待在家裡看電視。"}, {"s": "B", "en": "Sometimes that's exactly what you need. Did you watch anything good?", "zh": "有時候那正是你需要的。你有看到什麼好看的嗎？"}, {"s": "A", "en": "Yes, I finished a series about a detective. I couldn't stop watching.", "zh": "有，我看完了一部關於偵探的影集。我根本停不下來。"}, {"s": "B", "en": "Oh, I've heard about that one. Is it worth watching?", "zh": "哦，我聽過那部。值得看嗎？"}, {"s": "A", "en": "Definitely. I'll send you the title later.", "zh": "絕對值得。我晚點把名字傳給你。"}, {"s": "A", "en": "By the way, are you free for lunch today?", "zh": "對了，你今天中午有空吃午餐嗎？", "h": "2. 午餐邀約"}, {"s": "B", "en": "Sure. I don't have any meetings until two. Where do you want to go?", "zh": "好啊。我兩點前沒有任何會議。你想去哪裡？"}, {"s": "A", "en": "How about the new Italian place across the street? I heard the pasta is really good.", "zh": "對面那家新開的義大利餐廳怎麼樣？我聽說義大利麵很好吃。"}, {"s": "B", "en": "I'd love to try it. Should we ask anyone else to join us?", "zh": "我很想試試。我們要找其他人一起來嗎？"}, {"s": "A", "en": "Good idea. Let me ask Tom and Emily.", "zh": "好主意。我來問問湯姆和艾蜜莉。"}, {"s": "B", "en": "Perfect. What time should we leave?", "zh": "太好了。我們幾點出發？"}, {"s": "A", "en": "Let's leave at twelve fifteen, before the crowd arrives.", "zh": "我們十二點十五分出發，在人潮來之前。"}, {"s": "A", "en": "So, how is your project going? I heard it's due next week.", "zh": "那麼，你的專案進行得怎麼樣？我聽說下週要交。", "h": "3. 聊工作與壓力"}, {"s": "B", "en": "It's going okay, but I'm a little stressed. There's still a lot to do.", "zh": "還可以，但我有點壓力。還有很多事要做。"}, {"s": "A", "en": "I know the feeling. Is there anything I can help with?", "zh": "我懂那種感覺。有什麼我可以幫忙的嗎？"}, {"s": "B", "en": "Thanks for offering. Actually, could you look over my presentation slides when you have time?", "zh": "謝謝你的好意。其實，等你有空的時候，可以幫我看一下簡報嗎？"}, {"s": "A", "en": "Of course. Send them to me this afternoon, and I'll give you some feedback by tomorrow.", "zh": "當然。今天下午寄給我，我明天前給你一些意見。"}, {"s": "B", "en": "That would be a huge help. I owe you a coffee.", "zh": "那幫助太大了。我欠你一杯咖啡。"}, {"s": "A", "en": "Don't worry about it. We all help each other here.", "zh": "別擔心。我們在這裡都是互相幫忙。"}, {"s": "B", "en": "Do you ever feel overwhelmed by the workload?", "zh": "你有時候會覺得工作量太大，喘不過氣嗎？"}, {"s": "A", "en": "Sometimes. When that happens, I go for a short walk, or I talk to my manager about changing my priorities.", "zh": "有時候會。遇到那種情況，我就去散個步，或是和主管討論調整優先順序。"}, {"s": "B", "en": "That's good advice. I'll try that.", "zh": "這是很好的建議。我會試試看。"}, {"s": "A", "en": "Do you have any plans after work today?", "zh": "你今天下班後有什麼計畫嗎？", "h": "4. 下班後的計畫"}, {"s": "B", "en": "I'm going to the gym, and then I'll cook dinner at home. What about you?", "zh": "我要去健身房，然後回家煮晚餐。你呢？"}, {"s": "A", "en": "I'm meeting a friend for dinner, and then we're going to see a movie.", "zh": "我要和朋友吃晚餐，然後我們要去看電影。"}, {"s": "B", "en": "That sounds like a nice evening. What movie are you going to see?", "zh": "聽起來是個不錯的夜晚。你們要看什麼電影？"}, {"s": "A", "en": "A comedy that just came out. I need a good laugh after this week.", "zh": "一部剛上映的喜劇片。這週過後我需要好好笑一笑。"}, {"s": "B", "en": "Enjoy it! Tell me how it was tomorrow.", "zh": "好好享受！明天告訴我好不好看。"}, {"s": "A", "en": "I will. By the way, the company party is next Friday. Are you coming?", "zh": "我會的。對了，公司派對在下週五。你會來嗎？"}, {"s": "B", "en": "Yes, I'm planning to. I heard they're ordering pizza and there will be games.", "zh": "會，我打算去。我聽說他們會訂披薩，還有遊戲。"}, {"s": "A", "en": "Great. It should be fun. Well, I'd better get back to work. See you at lunch!", "zh": "太好了。應該會很好玩。好了，我該回去工作了。午餐見！"}, {"s": "B", "en": "See you at lunch. Have a good morning!", "zh": "午餐見。祝你早上順利！"}]},
  {"id": "party", "icon": "🎉", "title": "參加派對", "en": "At a Party", "roles": {"A": "Host 主人", "B": "You 你"}, "lines": [{"s": "A", "en": "Hey, you made it! Come on in!", "zh": "嘿，你來了！快進來！", "h": "1. 抵達與招待"}, {"s": "B", "en": "Hi! Thanks for inviting me. Happy birthday! I brought you a little gift.", "zh": "嗨！謝謝你邀請我。生日快樂！我帶了一個小禮物給你。"}, {"s": "A", "en": "Oh, you didn't have to do that. That's so kind of you. Thank you!", "zh": "哦，你不用這樣。你真貼心。謝謝你！"}, {"s": "B", "en": "I also brought some snacks. Where should I put them?", "zh": "我也帶了一些點心。我應該放在哪裡？"}, {"s": "A", "en": "You can put them on the kitchen table, next to the cake. Can I get you something to drink?", "zh": "你可以放在廚房桌上，蛋糕旁邊。要我給你拿點飲料嗎？"}, {"s": "B", "en": "Yes, please. What do you have?", "zh": "好的，麻煩你。你們有什麼？"}, {"s": "A", "en": "We have soda, juice, beer, and a fruit punch that my sister made.", "zh": "我們有汽水、果汁、啤酒，還有我姐姐調的水果賓治。"}, {"s": "B", "en": "The fruit punch sounds good. I'll try that.", "zh": "水果賓治聽起來不錯。我試試看。"}, {"s": "A", "en": "Great. Come with me, and I'll introduce you to some people. Everyone, this is my friend Ming.", "zh": "太好了。跟我來，我介紹你認識一些人。各位，這是我的朋友小明。", "h": "2. 認識新朋友"}, {"s": "B", "en": "Hi, everyone. Nice to meet you all.", "zh": "嗨，大家好。很高興認識大家。"}, {"s": "A", "en": "Ming, this is my cousin, Jack. And this is Lisa, my neighbor.", "zh": "小明，這是我表哥傑克。這是麗莎，我的鄰居。"}, {"s": "B", "en": "Hi, Jack. Hi, Lisa. How do you know the birthday girl?", "zh": "嗨，傑克。嗨，麗莎。你們怎麼認識壽星的？"}, {"s": "A", "en": "Lisa lives next door. We've been friends since we were kids. And Jack is my cousin, as I said.", "zh": "麗莎住在隔壁。我們從小就是朋友了。而傑克是我表哥，就像我說的。"}, {"s": "B", "en": "That's wonderful. I know her from the language club. We met about two months ago.", "zh": "真好。我是在語言社認識她的。我們大約兩個月前認識。"}, {"s": "A", "en": "Oh, you're in the language club too? That's where I met her. She's always organizing fun events.", "zh": "哦，你也在語言社嗎？我就是在那裡認識她的。她總是在籌辦有趣的活動。"}, {"s": "B", "en": "Yes, she's great at that. Do you all live nearby?", "zh": "對，她很擅長這個。你們都住在附近嗎？"}, {"s": "A", "en": "I do, just across the street. Jack lives in another city, so he came for the weekend.", "zh": "我是，就在對面。傑克住在別的城市，所以他是為了週末特地過來。"}, {"s": "A", "en": "Have you tried the pizza? There's a pepperoni one and a vegetarian one.", "zh": "你吃過披薩了嗎？有一個是臘腸的，一個是蔬菜的。", "h": "3. 食物與聊天"}, {"s": "B", "en": "Not yet. I'll take a slice of the vegetarian one. It looks delicious.", "zh": "還沒。我拿一片蔬菜的。看起來很好吃。"}, {"s": "A", "en": "The cake is coming out in about an hour, after we sing. It's chocolate with strawberries.", "zh": "蛋糕大約一小時後出來，在我們唱歌之後。是巧克力口味，上面有草莓。"}, {"s": "B", "en": "That sounds amazing. Who made it?", "zh": "聽起來太棒了。是誰做的？"}, {"s": "A", "en": "My mom made it. She bakes the best cakes in town.", "zh": "我媽媽做的。她烤的蛋糕是全鎮最好吃的。"}, {"s": "B", "en": "Then I'm definitely looking forward to it.", "zh": "那我一定很期待。"}, {"s": "A", "en": "So, what do you do for fun? Do you play any sports?", "zh": "那你平常有什麼娛樂？你有玩任何運動嗎？"}, {"s": "B", "en": "I like hiking and playing badminton. How about you?", "zh": "我喜歡健行和打羽毛球。你呢？"}, {"s": "A", "en": "I play tennis on weekends. We should play together sometime.", "zh": "我週末打網球。我們找時間一起打吧。"}, {"s": "B", "en": "I'd love that. I'm not very good, but I enjoy it.", "zh": "我很樂意。我打得不太好，但我很喜歡。"}, {"s": "A", "en": "That's all that matters. Let's exchange numbers before the end of the party.", "zh": "這才是最重要的。我們在派對結束前交換電話吧。"}, {"s": "B", "en": "Sure. Hey, the music is great. Who made the playlist?", "zh": "好啊。嘿，這音樂很棒。是誰做的歌單？"}, {"s": "A", "en": "The host did, of course. Let's go and sing Happy Birthday.", "zh": "當然是主人囉。我們去唱生日快樂歌吧。", "h": "4. 唱歌與道別"}, {"s": "B", "en": "Happy birthday to you! Make a wish!", "zh": "祝你生日快樂！許個願吧！"}, {"s": "A", "en": "Thank you, everyone. Okay, I've made my wish. Let's have some cake!", "zh": "謝謝大家。好了，我許完願了。我們來吃蛋糕吧！"}, {"s": "B", "en": "This cake is delicious. Thank you for inviting me tonight.", "zh": "這蛋糕太好吃了。謝謝你今晚邀請我。"}, {"s": "A", "en": "I'm so glad you came. Are you leaving already? It's still early.", "zh": "我很高興你來了。你已經要走了嗎？還很早呢。"}, {"s": "B", "en": "I have to get up early tomorrow, so I should head home. I had a great time.", "zh": "我明天要早起，所以我該回家了。我玩得很開心。"}, {"s": "A", "en": "Thank you for coming, and thank you for the gift. Get home safely!", "zh": "謝謝你來，也謝謝你的禮物。路上平安！"}, {"s": "B", "en": "Thanks. Happy birthday again! Bye, everyone!", "zh": "謝謝。再次祝你生日快樂！大家再見！"}]},
  {"id": "date", "icon": "💕", "title": "邀請約會", "en": "Asking Someone Out", "roles": {"A": "Friend 朋友", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, Sarah. Do you have a minute? I wanted to ask you something.", "zh": "嗨，莎拉。你有空嗎？我想問你一件事。", "h": "1. 提出邀約"}, {"s": "A", "en": "Sure. What's up?", "zh": "當然。怎麼了？"}, {"s": "B", "en": "I've really enjoyed working on the project with you these past few weeks.", "zh": "這幾週和你一起做專案，我真的很開心。"}, {"s": "A", "en": "I've enjoyed it too. You've been a great teammate.", "zh": "我也很開心。你是很棒的隊友。"}, {"s": "B", "en": "Thanks. So, I was wondering if you'd like to have dinner with me this Saturday.", "zh": "謝謝。所以，我在想你這個週六想不想和我一起吃晚餐。"}, {"s": "A", "en": "Oh, that's very sweet of you. I'd love to!", "zh": "哦，你真貼心。我很樂意！"}, {"s": "B", "en": "Really? That's great. What kind of food do you like?", "zh": "真的嗎？太好了。你喜歡什麼樣的食物？"}, {"s": "A", "en": "I like almost everything, but I especially love Italian and Japanese food.", "zh": "我幾乎什麼都喜歡，但我特別喜歡義大利菜和日本料理。", "h": "2. 選擇餐廳"}, {"s": "B", "en": "I know a nice Italian restaurant near the river. It's quiet, and the pasta is wonderful.", "zh": "我知道河邊有一家不錯的義大利餐廳。很安靜，義大利麵也很棒。"}, {"s": "A", "en": "That sounds lovely. Is it expensive?", "zh": "聽起來很棒。貴嗎？"}, {"s": "B", "en": "It's a little pricey, but I'd like to treat you. It's my invitation.", "zh": "有一點貴，但我想請你。是我邀請的。"}, {"s": "A", "en": "Thank you, that's very generous. Do you need to make a reservation?", "zh": "謝謝你，你真慷慨。需要訂位嗎？"}, {"s": "B", "en": "Yes, I'll call today. What time would be good for you?", "zh": "需要，我今天會打電話。你幾點方便？"}, {"s": "A", "en": "Seven o'clock would be perfect. I finish work at five thirty, so I'll have time to change.", "zh": "七點最好。我五點半下班，所以有時間換衣服。"}, {"s": "B", "en": "Great. Should I pick you up, or would you rather meet at the restaurant?", "zh": "太好了。我要去接你，還是你比較想在餐廳碰面？"}, {"s": "A", "en": "You can pick me up. I live on Maple Street, near the subway station.", "zh": "你可以來接我。我住在楓樹街，靠近捷運站。"}, {"s": "B", "en": "Okay. I'll text you when I'm outside. Is there any food you don't eat?", "zh": "好的。我到了會傳訊息給你。有什麼食物是你不吃的嗎？"}, {"s": "A", "en": "I'm allergic to nuts, so I have to be careful with desserts and sauces.", "zh": "我對堅果過敏，所以吃甜點和醬料要小心。", "h": "3. 餐廳裡"}, {"s": "B", "en": "Thanks for telling me. I'll let the restaurant know when I make the reservation.", "zh": "謝謝你告訴我。我訂位時會讓餐廳知道。"}, {"s": "B", "en": "Here we are. You look lovely tonight.", "zh": "我們到了。你今晚看起來很漂亮。"}, {"s": "A", "en": "Thank you. You look very nice too. This place is beautiful.", "zh": "謝謝你。你也很帥。這個地方好美。"}, {"s": "B", "en": "I'm glad you like it. Let's go in. A table for two under the name Chen, please.", "zh": "我很高興你喜歡。我們進去吧。麻煩給兩位，以陳的名字訂位。"}, {"s": "A", "en": "What are you going to order?", "zh": "你打算點什麼？"}, {"s": "B", "en": "I think I'll have the mushroom risotto. What about you?", "zh": "我想我會點蘑菇燉飯。你呢？"}, {"s": "A", "en": "I'm going to try the seafood pasta. Please tell the waiter about my allergy.", "zh": "我要試試海鮮義大利麵。請告訴服務生我的過敏。"}, {"s": "B", "en": "Of course. Excuse me, my friend is allergic to nuts. Is this dish safe for her?", "zh": "當然。不好意思，我朋友對堅果過敏。這道菜對她安全嗎？"}, {"s": "A", "en": "The dish doesn't contain nuts, and the chef will take extra care in the kitchen.", "zh": "這道菜不含堅果，主廚也會在廚房特別小心。"}, {"s": "B", "en": "Thank you. So, tell me about your family. Do you have any brothers or sisters?", "zh": "謝謝。那麼，跟我聊聊你的家人吧。你有兄弟姊妹嗎？", "h": "4. 聊天與結束"}, {"s": "A", "en": "I have an older brother and a younger sister. We're very close. What about you?", "zh": "我有一個哥哥和一個妹妹。我們感情很好。你呢？"}, {"s": "B", "en": "I'm an only child, but I have a lot of cousins, so it feels like a big family.", "zh": "我是獨生子，但我有很多表兄弟姊妹，所以感覺像一個大家庭。"}, {"s": "A", "en": "That sounds nice. I had a wonderful evening, thank you for dinner.", "zh": "聽起來很棒。我今晚過得很愉快，謝謝你請我吃晚餐。"}, {"s": "B", "en": "I had a great time too. I'm glad you said yes.", "zh": "我也玩得很開心。我很高興你答應了。"}, {"s": "A", "en": "Would you like to do something again next weekend? Maybe a movie?", "zh": "你想下週末再做點什麼嗎？也許看電影？"}, {"s": "B", "en": "I'd love that. I'll check what's playing, and I'll text you tomorrow.", "zh": "我很樂意。我會查查有什麼電影，明天傳訊息給你。"}, {"s": "B", "en": "Here we are, back at your place. Thanks again for tonight.", "zh": "到你家了。再次謝謝你今晚。"}, {"s": "A", "en": "Thank you. Good night, and drive safely!", "zh": "謝謝你。晚安，開車小心！"}]},
  {"id": "hobbies", "icon": "🎸", "title": "聊音樂與興趣", "en": "Talking About Music and Hobbies", "roles": {"A": "Friend 朋友", "B": "You 你"}, "lines": [{"s": "A", "en": "Hey, I like the song that's playing. What is it?", "zh": "嘿，我喜歡現在播的這首歌。這是什麼歌？", "h": "1. 聊音樂喜好"}, {"s": "B", "en": "It's a song by a band called Blue Waves. They're one of my favorites.", "zh": "是一個叫藍色波浪的樂團的歌。他們是我最喜歡的樂團之一。"}, {"s": "A", "en": "I haven't heard of them. What kind of music do they play?", "zh": "我沒聽過他們。他們演奏什麼類型的音樂？"}, {"s": "B", "en": "It's indie rock with a bit of folk. The lyrics are very poetic.", "zh": "是獨立搖滾，帶一點民謠。歌詞非常有詩意。"}, {"s": "A", "en": "That sounds interesting. I mostly listen to pop music, but I like to try new things.", "zh": "聽起來很有意思。我大多聽流行音樂，但我喜歡嘗試新東西。"}, {"s": "B", "en": "I'll send you a playlist later. Do you play any instruments?", "zh": "我晚點傳一個歌單給你。你會演奏任何樂器嗎？"}, {"s": "A", "en": "I played the violin when I was a kid, but I stopped when I started high school. What about you?", "zh": "我小時候拉過小提琴，但上高中時就停了。你呢？"}, {"s": "B", "en": "I play the guitar. I started three years ago, and I practice about thirty minutes every day.", "zh": "我彈吉他。三年前開始學的，我每天大約練習三十分鐘。", "h": "2. 學樂器的經驗"}, {"s": "A", "en": "Wow, that's dedication. Did you take lessons, or did you teach yourself?", "zh": "哇，真有毅力。你有上課，還是自學的？"}, {"s": "B", "en": "Both, actually. I took lessons for the first year, and then I learned from videos online.", "zh": "其實兩種都有。第一年我去上課，之後從網路影片學習。"}, {"s": "A", "en": "Is it hard to learn?", "zh": "很難學嗎？"}, {"s": "B", "en": "The first few months were difficult. My fingers hurt a lot, and the chords were hard to change quickly.", "zh": "最初幾個月很困難。我的手指很痛，和弦也很難快速轉換。"}, {"s": "A", "en": "I can imagine. What was the first song you learned?", "zh": "我可以想像。你學的第一首歌是什麼？"}, {"s": "B", "en": "A simple song with only three chords. I played it for my parents, and they were so proud.", "zh": "一首只有三個和弦的簡單歌曲。我彈給我爸媽聽，他們非常驕傲。"}, {"s": "A", "en": "That's sweet. Do you ever play in front of other people?", "zh": "真窩心。你曾經在其他人面前演奏嗎？"}, {"s": "B", "en": "Sometimes at open mic nights. I was really nervous the first time, but now I enjoy it.", "zh": "有時候在公開麥克風之夜。第一次我真的很緊張，但現在我很享受。"}, {"s": "A", "en": "I'd love to see you perform. When is the next one?", "zh": "我很想看你表演。下一次是什麼時候？", "h": "3. 演唱會與計畫"}, {"s": "B", "en": "This Friday, at a café downtown. It starts at eight. You should come!", "zh": "這週五，在市中心的一家咖啡店。八點開始。你應該來！"}, {"s": "A", "en": "I'd love to. Is it free?", "zh": "我很樂意。免費嗎？"}, {"s": "B", "en": "Yes, but you need to buy a drink. The coffee there is great, by the way.", "zh": "是的，但你需要點一杯飲料。對了，那裡的咖啡很棒。"}, {"s": "A", "en": "Perfect. By the way, have you been to any concerts recently?", "zh": "太好了。對了，你最近有去看演唱會嗎？"}, {"s": "B", "en": "Yes, I saw Blue Waves last month. It was the best night of my year.", "zh": "有，我上個月看了藍色波浪。那是我今年最棒的夜晚。"}, {"s": "A", "en": "That's awesome. Were the tickets expensive?", "zh": "太棒了。票很貴嗎？"}, {"s": "B", "en": "They were about eighty dollars, but it was worth it. I stood close to the stage the whole time.", "zh": "大約八十元，但很值得。我整場都站在離舞台很近的地方。"}, {"s": "A", "en": "I saw my favorite singer last year, and I cried when she sang my favorite song.", "zh": "我去年看了我最喜歡的歌手，她唱我最愛的歌時我哭了。"}, {"s": "B", "en": "That's so cool. Music can be really emotional.", "zh": "太酷了。音樂真的能讓人很感動。"}, {"s": "A", "en": "What other hobbies do you have besides music?", "zh": "除了音樂，你還有什麼其他興趣？", "h": "4. 其他興趣"}, {"s": "B", "en": "I also enjoy photography, and I cook a lot on weekends. How about you?", "zh": "我也喜歡攝影，週末常常做菜。你呢？"}, {"s": "A", "en": "I love painting and reading. I'm reading a mystery novel right now.", "zh": "我喜歡畫畫和閱讀。我現在正在讀一本推理小說。"}, {"s": "B", "en": "Is it good? I've been looking for something new to read.", "zh": "好看嗎？我一直在找新的書來讀。"}, {"s": "A", "en": "It's fantastic. I'll lend it to you when I'm finished.", "zh": "非常精彩。我讀完後借給你。"}, {"s": "B", "en": "Thanks. Would you like to try the guitar sometime? I could teach you the basics.", "zh": "謝謝。你想找時間試試吉他嗎？我可以教你基本功。"}, {"s": "A", "en": "Really? That would be fun, but I'm afraid I'd be terrible.", "zh": "真的嗎？那會很好玩，但我怕我會彈得很糟。"}, {"s": "B", "en": "Everyone is terrible at first. I'll bring my extra guitar next Saturday.", "zh": "每個人一開始都很糟。我下週六會帶我多的那把吉他。"}, {"s": "A", "en": "It's a deal. I'll make us some tea, and we can practice.", "zh": "一言為定。我來泡茶，我們可以一起練習。"}, {"s": "B", "en": "Sounds great. See you at the café on Friday!", "zh": "太棒了。週五咖啡店見！"}]},
  {"id": "apology", "icon": "🙏", "title": "道歉與原諒", "en": "Saying Sorry to a Friend", "roles": {"A": "Friend 朋友", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, Anna. Do you have a few minutes? I really need to talk to you.", "zh": "嗨，安娜。你有幾分鐘嗎？我真的需要和你談談。", "h": "1. 誠心道歉"}, {"s": "A", "en": "Hi. Sure, but I have to say, I'm still a little upset about yesterday.", "zh": "嗨。可以，但我得說，我對昨天的事還是有點難過。"}, {"s": "B", "en": "I know, and that's exactly why I'm here. I'm really sorry that I missed your birthday dinner.", "zh": "我知道，這正是我來的原因。我真的很抱歉我錯過了你的生日晚餐。"}, {"s": "A", "en": "We waited for you for almost an hour. I called you three times, and you didn't answer.", "zh": "我們等了你將近一個小時。我打了三次電話給你，你都沒接。"}, {"s": "B", "en": "I'm so sorry. I should have called you or sent a message. There's no excuse for that.", "zh": "我真的很抱歉。我應該打電話給你或傳訊息的。這件事沒有任何藉口。"}, {"s": "A", "en": "It really hurt, because I thought you knew how important it was to me.", "zh": "我真的很難過，因為我以為你知道這對我有多重要。"}, {"s": "B", "en": "I did know. You told me about it weeks ago, and I even wrote it on my calendar.", "zh": "我知道。你幾週前就告訴過我了，我甚至把它寫在行事曆上。"}, {"s": "A", "en": "Then what happened?", "zh": "那到底發生了什麼事？", "h": "2. 說明原因"}, {"s": "B", "en": "I'll tell you honestly. My boss asked me to finish an urgent report, and I stayed at the office until nine.", "zh": "我老實告訴你。我老闆要我完成一份緊急的報告，我在辦公室待到九點。"}, {"s": "A", "en": "But you could have told me. I would have understood.", "zh": "但你可以告訴我的。我會理解的。"}, {"s": "B", "en": "You're right. My phone also died, and I panicked. I didn't think clearly.", "zh": "你說得對。我的手機也沒電了，我當時慌了。我沒有想清楚。"}, {"s": "A", "en": "Why didn't you use your computer to send me a message?", "zh": "你為什麼不用電腦傳訊息給我？"}, {"s": "B", "en": "Honestly, I was ashamed. I thought you'd be angry, so I kept putting it off, and then it was too late.", "zh": "老實說，我覺得很羞愧。我想你會生氣，所以一直拖延，然後就太晚了。"}, {"s": "A", "en": "I appreciate you being honest. That's better than making up a story.", "zh": "我很感謝你這麼誠實。這比編一個故事好多了。"}, {"s": "B", "en": "I never want to lie to you. Our friendship means a lot to me.", "zh": "我從來不想對你說謊。我們的友誼對我來說很重要。"}, {"s": "A", "en": "It means a lot to me too. That's why I was so upset.", "zh": "對我來說也是。這就是為什麼我才那麼難過。", "h": "3. 表達感受與原諒"}, {"s": "B", "en": "I understand. How are you feeling now?", "zh": "我了解。你現在感覺如何？"}, {"s": "A", "en": "A little better, now that I know the reason. I was worried that you didn't care.", "zh": "現在知道原因後好一點了。我本來擔心你不在乎。"}, {"s": "B", "en": "I care very much. I felt terrible all night. I couldn't sleep.", "zh": "我非常在乎。我整晚都覺得很糟。我睡不著。"}, {"s": "A", "en": "Thank you for coming to apologize in person. Many people would just send a text.", "zh": "謝謝你親自來道歉。很多人只會傳個訊息。"}, {"s": "B", "en": "I wanted you to see that I'm sincere. A text didn't feel like enough.", "zh": "我想讓你看到我的誠意。傳訊息感覺不夠。"}, {"s": "A", "en": "Okay. I forgive you. Everyone makes mistakes, and this was a mistake, not a choice.", "zh": "好吧。我原諒你。每個人都會犯錯，這是一個錯誤，不是一個選擇。"}, {"s": "B", "en": "Thank you so much. That means a lot to me.", "zh": "非常謝謝你。這對我來說意義重大。"}, {"s": "A", "en": "But please, next time, just tell me. Even a short message would have helped.", "zh": "但請你，下次直接告訴我。就算只是一則簡短的訊息也會有幫助。"}, {"s": "B", "en": "I promise I will. I'll always let you know if something comes up.", "zh": "我保證。如果發生任何事，我都會讓你知道。"}, {"s": "A", "en": "Good. Now, how can we fix this?", "zh": "很好。那我們該怎麼補救？", "h": "4. 補救與和好"}, {"s": "B", "en": "I'd like to make it up to you. Let me take you out for a birthday dinner this weekend, my treat.", "zh": "我想彌補你。這週末讓我請你吃生日晚餐，我請客。"}, {"s": "A", "en": "That's a nice idea. Where would you like to go?", "zh": "這是個好主意。你想去哪裡？"}, {"s": "B", "en": "Wherever you want. You choose the restaurant, and I'll make the reservation.", "zh": "你想去哪裡都可以。你選餐廳，我來訂位。"}, {"s": "A", "en": "How about the Thai restaurant that I love? It's near my place.", "zh": "去我很愛的那家泰式餐廳怎麼樣？離我家很近。"}, {"s": "B", "en": "Perfect. I'll book a table for Saturday at seven, and I'll set three alarms so I don't forget.", "zh": "太好了。我會訂週六七點的位子，而且會設三個鬧鐘，這樣我才不會忘記。"}, {"s": "A", "en": "Three alarms? That's funny.", "zh": "三個鬧鐘？真好笑。"}, {"s": "B", "en": "I mean it. I also got you a small present. It's not much, but I hope you like it.", "zh": "我是認真的。我也幫你準備了一份小禮物。不多，但希望你喜歡。"}, {"s": "A", "en": "Oh, you didn't have to. Thank you. This is so thoughtful.", "zh": "哦，你不用這樣。謝謝你。你真貼心。"}, {"s": "B", "en": "Happy belated birthday, Anna. I'm really glad we're okay.", "zh": "遲來的生日快樂，安娜。我真的很高興我們沒事了。"}, {"s": "A", "en": "Me too. Now let's get some coffee. My treat this time.", "zh": "我也是。現在我們去喝杯咖啡吧。這次我請客。"}]},
  {"id": "emergency", "icon": "🚑", "title": "叫救護車", "en": "Calling for an Ambulance", "roles": {"A": "Operator & Paramedic 調度員與救護員", "B": "You 你"}, "lines": [{"s": "A", "en": "Nine-one-one. What is the address of your emergency?", "zh": "九一一緊急專線。請問您的緊急狀況地址在哪裡？", "h": "1. 說明緊急狀況"}, {"s": "B", "en": "Hello, please send an ambulance. My friend has collapsed, and he isn't responding to me.", "zh": "你好，請派救護車。我的朋友昏倒了，而且對我沒有反應。"}, {"s": "A", "en": "Okay, I'm sending help right now. Can you tell me exactly where you are?", "zh": "好的，我現在就派人過去。你能告訴我你確切在哪裡嗎？"}, {"s": "B", "en": "I'm at the corner of Main Street and Oak Avenue, in front of the pharmacy.", "zh": "我在主街和橡樹大道的轉角，藥局前面。"}, {"s": "A", "en": "Main Street and Oak Avenue, in front of the pharmacy. Is that correct?", "zh": "主街和橡樹大道，藥局前面。對嗎？"}, {"s": "B", "en": "Yes, that's correct. Please hurry.", "zh": "對，沒錯。請快一點。"}, {"s": "A", "en": "Help is on the way. Please stay on the line with me. What is your name?", "zh": "救援已經在路上了。請不要掛斷電話。你叫什麼名字？"}, {"s": "B", "en": "My name is Daniel Lin.", "zh": "我叫丹尼爾·林。"}, {"s": "A", "en": "Daniel, is your friend breathing?", "zh": "丹尼爾，你的朋友有呼吸嗎？", "h": "2. 回答調度員的問題"}, {"s": "B", "en": "Yes, he is breathing, but very slowly, and his eyes are closed.", "zh": "有，他有呼吸，但很慢，而且他的眼睛閉著。"}, {"s": "A", "en": "Okay. Does he respond if you talk to him or touch his shoulder?", "zh": "好的。你對他說話或碰他的肩膀時，他有反應嗎？"}, {"s": "B", "en": "No, he doesn't respond at all.", "zh": "沒有，他完全沒有反應。"}, {"s": "A", "en": "How old is he, and did anything happen before he fell?", "zh": "他幾歲？他倒下之前發生過什麼事嗎？"}, {"s": "B", "en": "He's about thirty-five. He said he felt dizzy and had a headache, and then he suddenly fell down.", "zh": "他大約三十五歲。他說他覺得頭暈、頭痛，然後突然就倒下了。"}, {"s": "A", "en": "Did he hit his head when he fell?", "zh": "他倒下時有撞到頭嗎？"}, {"s": "B", "en": "I don't think so. I caught him, and we both sat on the ground.", "zh": "我想沒有。我接住了他，我們兩個都坐到地上。"}, {"s": "A", "en": "Good. Do you know if he has any medical conditions or takes any medicine?", "zh": "很好。你知道他有任何健康狀況或正在吃藥嗎？"}, {"s": "B", "en": "I'm not sure about medicine, but he told me he skipped breakfast and lunch today.", "zh": "藥的部分我不確定，但他告訴我他今天沒吃早餐和午餐。"}, {"s": "A", "en": "Thank you. That's useful information. Now please listen carefully.", "zh": "謝謝。這是很有用的資訊。現在請仔細聽。", "h": "3. 等待救護車時的指示"}, {"s": "A", "en": "Don't move him, and don't give him anything to eat or drink.", "zh": "不要移動他，也不要給他任何東西吃或喝。"}, {"s": "B", "en": "Okay, I won't. Should I do anything else?", "zh": "好的，我不會。我還需要做什麼嗎？"}, {"s": "A", "en": "Please loosen anything tight around his neck, like a collar or a scarf, and keep him warm.", "zh": "請把他脖子周圍緊的東西鬆開，像是衣領或圍巾，並讓他保暖。"}, {"s": "B", "en": "I've loosened his collar, and I'm putting my jacket over him. He's still breathing.", "zh": "我已經把他的衣領鬆開了，我正在把我的外套蓋在他身上。他還有呼吸。"}, {"s": "A", "en": "Good. Keep watching his breathing, and tell me right away if anything changes.", "zh": "很好。繼續注意他的呼吸，如果有任何變化請馬上告訴我。"}, {"s": "B", "en": "It's the same. How long will the ambulance take?", "zh": "沒有變化。救護車要多久才會到？"}, {"s": "A", "en": "It should arrive in about five minutes. Is there anyone nearby who can help you?", "zh": "大約五分鐘內會到。附近有人可以幫你嗎？"}, {"s": "B", "en": "Yes, a woman from the pharmacy came out. She can wave to the ambulance.", "zh": "有，藥局裡有一位女士出來了。她可以向救護車揮手。"}, {"s": "A", "en": "That's very helpful. Please ask her to stand by the road.", "zh": "那很有幫助。請她站在路邊。"}, {"s": "B", "en": "She's doing that now. I can hear a siren!", "zh": "她現在正在做。我聽到警笛聲了！"}, {"s": "A", "en": "That's the ambulance. Please stay with him. You're doing very well.", "zh": "那是救護車。請陪在他身邊。你做得很好。"}, {"s": "A", "en": "Hello, we're the paramedics. Can you tell us what happened?", "zh": "你好，我們是救護人員。你可以告訴我們發生了什麼事嗎？", "h": "4. 救護人員抵達"}, {"s": "B", "en": "He said he felt dizzy, and then he collapsed about ten minutes ago. He hasn't woken up.", "zh": "他說他覺得頭暈，然後大約十分鐘前昏倒了。他一直沒有醒來。"}, {"s": "A", "en": "Thank you. We'll check him now. Sir, can you hear me? We're going to take you to the hospital.", "zh": "謝謝。我們現在來檢查他。先生，你聽得到我說話嗎？我們要送你去醫院。"}, {"s": "B", "en": "Is he going to be okay?", "zh": "他會沒事嗎？"}, {"s": "A", "en": "His condition is stable right now. We'll give him treatment on the way to the hospital.", "zh": "他目前的狀況穩定。我們會在去醫院的路上給他治療。"}, {"s": "B", "en": "Can I come with you in the ambulance?", "zh": "我可以跟你們一起坐救護車嗎？"}, {"s": "A", "en": "Yes, you can sit in the front. Please bring his bag and his phone.", "zh": "可以，你可以坐在前面。請帶著他的包包和手機。"}, {"s": "B", "en": "Which hospital are you taking him to?", "zh": "你們要送他去哪間醫院？"}, {"s": "A", "en": "City General Hospital. It's only ten minutes from here. Can you give us the number of his family?", "zh": "市立綜合醫院。離這裡只有十分鐘。你可以給我們他家人的電話嗎？"}, {"s": "B", "en": "Yes, here is his wife's number. Thank you so much for coming so quickly.", "zh": "可以，這是他太太的電話。非常謝謝你們這麼快趕到。"}, {"s": "A", "en": "You did a great job staying calm. Let's go.", "zh": "你保持冷靜，做得很好。我們出發吧。"}]},
  {"id": "police", "icon": "🚓", "title": "報案遭竊", "en": "Reporting a Theft", "roles": {"A": "Police officer 警察", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, officer. I'd like to report a theft.", "zh": "不好意思，警察先生。我想報案，有東西被偷了。", "h": "1. 報案與個人資料"}, {"s": "A", "en": "I'm sorry to hear that. Please have a seat. Are you hurt, or is anyone in danger?", "zh": "很遺憾聽到這件事。請坐。你有受傷嗎？或有任何人有危險嗎？"}, {"s": "B", "en": "No, I'm fine. Nobody was hurt. Someone took my bag at a café about an hour ago.", "zh": "沒有，我沒事。沒有人受傷。大約一小時前，有人在咖啡店拿走了我的包包。"}, {"s": "A", "en": "Okay. Let me get a form and take some details. May I have your full name?", "zh": "好的。我拿一份表格，記錄一些細節。可以給我你的全名嗎？"}, {"s": "B", "en": "My name is Susan Wu. That's S-U-S-A-N, W-U.", "zh": "我叫蘇珊·吳。S-U-S-A-N，W-U。"}, {"s": "A", "en": "Thank you, Ms. Wu. And may I see some identification?", "zh": "謝謝你，吳小姐。我可以看一下你的身分證件嗎？"}, {"s": "B", "en": "That's the problem. My passport was in the bag. But I have a photo of it on my phone.", "zh": "這就是問題所在。我的護照在包包裡。但我手機裡有一張護照的照片。"}, {"s": "A", "en": "That will help. Where are you staying in the city?", "zh": "那會有幫助。你住在這座城市的哪裡？"}, {"s": "B", "en": "At the Riverside Hotel, room five twelve. I arrived three days ago.", "zh": "住在河濱飯店，512 號房。我三天前到的。"}, {"s": "A", "en": "What exactly was in the bag?", "zh": "包包裡確切有什麼東西？", "h": "2. 描述失物"}, {"s": "B", "en": "It was a black leather backpack with a small red tag on the zipper.", "zh": "是一個黑色皮革後背包，拉鍊上有一個小紅標籤。"}, {"s": "A", "en": "And what was inside?", "zh": "那裡面有什麼？"}, {"s": "B", "en": "My wallet with about two hundred dollars and two credit cards, my phone, a camera, and my passport.", "zh": "我的錢包，裡面有大約兩百元和兩張信用卡，還有我的手機、一台相機和我的護照。"}, {"s": "A", "en": "Do you know the value of the camera?", "zh": "你知道相機的價值嗎？"}, {"s": "B", "en": "It's worth about eight hundred dollars. I can show you the receipt from my email.", "zh": "大約值八百元。我可以讓你看我電子郵件裡的收據。"}, {"s": "A", "en": "Good. Is the location feature on your phone turned on? Maybe we can find it.", "zh": "很好。你手機的定位功能有開著嗎？也許我們可以找到它。"}, {"s": "B", "en": "Yes, I checked already. The last location was near the train station.", "zh": "有，我已經查過了。最後的位置在火車站附近。"}, {"s": "A", "en": "That's useful. Let me write it down. Now, can you tell me what happened?", "zh": "那很有用。我把它記下來。現在，你可以告訴我發生了什麼事嗎？", "h": "3. 說明事發經過"}, {"s": "B", "en": "I was sitting at a table by the door, and I put my bag on the chair next to me.", "zh": "我坐在門邊的一張桌子，把包包放在旁邊的椅子上。"}, {"s": "A", "en": "Then what happened?", "zh": "然後發生了什麼事？"}, {"s": "B", "en": "I went to the counter to order another coffee. It took about three minutes. When I came back, the bag was gone.", "zh": "我去櫃台再點一杯咖啡。大約花了三分鐘。我回來的時候，包包不見了。"}, {"s": "A", "en": "Did you see anyone near your table?", "zh": "你有看到任何人在你的桌子附近嗎？"}, {"s": "B", "en": "There was a man in a gray jacket and a baseball cap. He left the café quickly.", "zh": "有一個穿灰色夾克、戴棒球帽的男人。他很快就離開了咖啡店。"}, {"s": "A", "en": "Can you describe him in more detail?", "zh": "你可以更詳細地描述他嗎？"}, {"s": "B", "en": "He was about one meter seventy-five, thin, maybe thirty years old. He was carrying a blue shopping bag.", "zh": "他大約一百七十五公分，很瘦，可能三十歲左右。他提著一個藍色的購物袋。"}, {"s": "A", "en": "Thank you. Does the café have security cameras?", "zh": "謝謝。咖啡店有監視器嗎？"}, {"s": "B", "en": "Yes, I saw one above the counter.", "zh": "有，我看到櫃台上方有一個。"}, {"s": "A", "en": "Good. We'll ask the manager for the video.", "zh": "很好。我們會向經理調閱影像。"}, {"s": "A", "en": "I've written down everything. Please read this report and sign it.", "zh": "我都記下來了。請閱讀這份報案單並簽名。", "h": "4. 後續處理"}, {"s": "B", "en": "Everything is correct. How soon might you find it?", "zh": "全部都正確。你們多久可能找到它？"}, {"s": "A", "en": "I can't promise anything, but we'll do our best. We'll contact you if we find something.", "zh": "我不能保證，但我們會盡力。如果找到任何東西，我們會聯絡你。"}, {"s": "B", "en": "Should I wait at the hotel?", "zh": "我應該在飯店等嗎？"}, {"s": "A", "en": "You can go back to the hotel. Do you prefer a phone call or an email?", "zh": "你可以回飯店。你想要電話還是電子郵件？"}, {"s": "B", "en": "Email is better, because my phone was stolen.", "zh": "電子郵件比較好，因為我的手機被偷了。"}, {"s": "A", "en": "Of course. Here is your report number. You'll need it for your insurance and your embassy.", "zh": "當然。這是你的報案編號。你的保險和大使館都需要用到。"}, {"s": "B", "en": "What should I do about my credit cards?", "zh": "我的信用卡該怎麼辦？"}, {"s": "A", "en": "Call your bank right away to cancel them. You can use the phone at the front desk.", "zh": "請馬上打給你的銀行取消它們。你可以使用櫃台的電話。"}, {"s": "B", "en": "And my passport? I fly home in four days.", "zh": "那我的護照呢？我四天後要飛回家。"}, {"s": "A", "en": "Contact your embassy. They can issue a temporary travel document. Here's their address and phone number.", "zh": "請聯絡你的大使館。他們可以核發臨時旅行文件。這是他們的地址和電話。"}, {"s": "B", "en": "Thank you so much for your help.", "zh": "非常謝謝你的協助。"}, {"s": "A", "en": "You're welcome. I'm sorry this happened during your trip.", "zh": "不客氣。很遺憾你的旅途中發生了這種事。"}]},
  {"id": "carbreak", "icon": "🚙", "title": "車子拋錨", "en": "Car Trouble on the Highway", "roles": {"A": "Operator 道路救援人員", "B": "You 你"}, "lines": [{"s": "A", "en": "Road Assistance, this is Mark. How can I help you?", "zh": "道路救援，我是馬克。有什麼可以幫您的嗎？", "h": "1. 通報與安全"}, {"s": "B", "en": "Hello, my car broke down on the highway, and I need help.", "zh": "你好，我的車在高速公路上拋錨了，我需要協助。"}, {"s": "A", "en": "I'm sorry to hear that. First, are you safe? Is anyone hurt?", "zh": "很遺憾聽到這件事。首先，您安全嗎？有人受傷嗎？"}, {"s": "B", "en": "No one is hurt. I'm on the shoulder, and I've turned on my hazard lights.", "zh": "沒有人受傷。我在路肩，也開了警示燈。"}, {"s": "A", "en": "Good. Are you and your passengers outside the car, away from the traffic?", "zh": "很好。您和乘客有下車並遠離車流嗎？"}, {"s": "B", "en": "I'm still inside the car. There are two passengers with me.", "zh": "我還在車裡。有兩位乘客跟我在一起。"}, {"s": "A", "en": "Please get out on the side away from the traffic, and wait behind the guardrail if you can.", "zh": "請從遠離車流的那一側下車，可以的話，到護欄後面等候。"}, {"s": "B", "en": "Okay, we're getting out now.", "zh": "好的，我們現在下車。"}, {"s": "A", "en": "Can you tell me where you are?", "zh": "您可以告訴我您在哪裡嗎？", "h": "2. 說明位置"}, {"s": "B", "en": "I'm on Highway Five, heading north. I just passed exit twenty-two.", "zh": "我在五號公路，往北行駛。我剛剛經過二十二號出口。"}, {"s": "A", "en": "Is there a kilometer marker nearby?", "zh": "附近有里程標誌嗎？"}, {"s": "B", "en": "Yes, I can see one. It says forty-seven point five.", "zh": "有，我看得到一個。上面寫著四十七點五。"}, {"s": "A", "en": "Thank you. Highway Five north, kilometer forty-seven point five, just after exit twenty-two. Is that right?", "zh": "謝謝。五號公路北上，四十七點五公里處，剛過二十二號出口。對嗎？"}, {"s": "B", "en": "Yes, that's right.", "zh": "對，沒錯。"}, {"s": "A", "en": "What kind of car do you drive, and what color is it?", "zh": "您開的是什麼車？什麼顏色？"}, {"s": "B", "en": "It's a white Toyota sedan. The license plate is A-B-C, one two three four.", "zh": "是白色豐田轎車。車牌是 A-B-C，1234。"}, {"s": "A", "en": "What seems to be the problem with the car?", "zh": "車子看起來是什麼問題？", "h": "3. 描述故障與等待"}, {"s": "B", "en": "The engine suddenly made a loud noise and then stopped. Now there's some smoke coming out from the front.", "zh": "引擎突然發出很大的聲音然後熄火了。現在前面冒出一些煙。"}, {"s": "A", "en": "Please stay away from the car, and do not open the hood.", "zh": "請離車子遠一點，也不要打開引擎蓋。"}, {"s": "B", "en": "Understood. We're standing about twenty meters away.", "zh": "了解。我們站在大約二十公尺外。"}, {"s": "A", "en": "Good. Did any warning lights come on before the engine stopped?", "zh": "很好。引擎熄火之前，有任何警示燈亮起嗎？"}, {"s": "B", "en": "Yes, the temperature light was red for a few minutes. I thought it was a mistake.", "zh": "有，溫度燈紅了好幾分鐘。我以為是誤報。"}, {"s": "A", "en": "That may mean the engine overheated. We'll send a tow truck right away.", "zh": "那可能表示引擎過熱了。我們會馬上派拖吊車過去。"}, {"s": "B", "en": "How long will it take to get here?", "zh": "大概多久會到？"}, {"s": "A", "en": "About thirty minutes. The driver will call you when he's close.", "zh": "大約三十分鐘。司機接近時會打給您。"}, {"s": "B", "en": "Is this service free? I'm not sure about my membership.", "zh": "這項服務免費嗎？我不確定我的會員資格。"}, {"s": "A", "en": "May I have your membership number?", "zh": "可以給我您的會員編號嗎？"}, {"s": "B", "en": "It's four, seven, two, nine, one, six.", "zh": "是 472916。"}, {"s": "A", "en": "Thank you. Your membership is active, and towing up to fifty kilometers is free.", "zh": "謝謝。您的會員資格有效，五十公里內的拖吊免費。", "h": "4. 拖吊與維修廠"}, {"s": "B", "en": "What happens after the tow truck arrives?", "zh": "拖吊車到了之後會怎麼樣？"}, {"s": "A", "en": "He'll tow your car to a repair shop. Do you have a preferred shop?", "zh": "他會把您的車拖到維修廠。您有偏好的維修廠嗎？"}, {"s": "B", "en": "I don't know this area. Can you recommend one?", "zh": "我不熟這一帶。你可以推薦一家嗎？"}, {"s": "A", "en": "Yes. Best Auto Repair is about twenty kilometers from your location, and it's open until six.", "zh": "可以。最佳汽車維修廠離您的位置大約二十公里，營業到六點。"}, {"s": "B", "en": "That's fine. Can we ride in the tow truck?", "zh": "可以。我們可以搭拖吊車嗎？"}, {"s": "A", "en": "Up to three passengers can ride in the truck's cab.", "zh": "最多三位乘客可以坐在拖吊車的駕駛室。"}, {"s": "B",
