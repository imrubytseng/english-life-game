  {"id": "doctor", "icon": "🩺", "title": "看醫生", "en": "Visiting the Doctor", "roles": {"A": "Doctor 醫生", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning. Please have a seat. What brings you in today?", "zh": "早安。請坐。今天為什麼來看診呢？", "h": "1. 詢問症狀"}, {"s": "B", "en": "Good morning, Doctor. I've had a fever and a bad cough for three days.", "zh": "早安，醫生。我發燒和咳嗽三天了，咳得很厲害。"}, {"s": "A", "en": "I'm sorry to hear that. How high has your fever been?", "zh": "很遺憾聽到這件事。你的體溫最高到幾度？"}, {"s": "B", "en": "It was thirty-nine degrees last night.", "zh": "昨晚三十九度。"}, {"s": "A", "en": "Do you have any other symptoms, like a sore throat, a runny nose, or body aches?", "zh": "你還有其他症狀嗎？例如喉嚨痛、流鼻水或全身痠痛？"}, {"s": "B", "en": "Yes, my throat hurts a lot, and my whole body feels sore.", "zh": "有，我喉嚨很痛，全身也很痠。"}, {"s": "A", "en": "Have you had any trouble breathing or chest pain?", "zh": "你有呼吸困難或胸痛嗎？"}, {"s": "B", "en": "No, but I feel very tired, and I can't sleep well because of the coughing.", "zh": "沒有，但我覺得非常疲倦，而且因為咳嗽睡不好。"}, {"s": "A", "en": "Have you taken any medicine so far?", "zh": "你到目前為止有吃過什麼藥嗎？"}, {"s": "B", "en": "I took some cold medicine yesterday, but it didn't help much.", "zh": "我昨天吃了一些感冒藥，但幫助不大。"}, {"s": "A", "en": "Do you have any allergies to medicine?", "zh": "你對藥物有任何過敏嗎？"}, {"s": "B", "en": "No, I don't have any allergies.", "zh": "沒有，我沒有任何過敏。"}, {"s": "A", "en": "Good. And are you taking any other medicine regularly?", "zh": "很好。那你有定期服用其他藥物嗎？"}, {"s": "B", "en": "No, I'm generally healthy. This is the first time I've been this sick in years.", "zh": "沒有，我平常很健康。這是我好幾年來第一次病得這麼嚴重。"}, {"s": "A", "en": "Okay. Let me check your temperature and listen to your lungs.", "zh": "好的。我來量你的體溫，並聽一下你的肺部。", "h": "2. 檢查身體"}, {"s": "A", "en": "Please take a deep breath, and then breathe out slowly.", "zh": "請深呼吸，然後慢慢吐氣。"}, {"s": "B", "en": "Is something wrong?", "zh": "有什麼問題嗎？"}, {"s": "A", "en": "Your lungs sound a little rough, but nothing serious. Now please open your mouth and say ah.", "zh": "你的肺部聲音有點粗，但不嚴重。現在請張開嘴，說「啊」。"}, {"s": "B", "en": "Ah.", "zh": "啊。"}, {"s": "A", "en": "Your throat is quite red and swollen. Your temperature is thirty-eight point five.", "zh": "你的喉嚨又紅又腫。體溫是三十八點五度。"}, {"s": "B", "en": "Is it the flu?", "zh": "是流感嗎？"}, {"s": "A", "en": "It could be. I'd like to do a quick flu test to be sure.", "zh": "有可能。我想做個快速流感檢測來確認。"}, {"s": "B", "en": "Okay. Will it hurt?", "zh": "好的。會痛嗎？"}, {"s": "A", "en": "It's a little uncomfortable, but it only takes a few seconds.", "zh": "會有點不舒服，但只要幾秒鐘。"}, {"s": "A", "en": "The test results are back. You have the flu.", "zh": "檢測結果出來了。你得了流感。", "h": "3. 診斷與用藥"}, {"s": "B", "en": "I see. What should I do?", "zh": "我明白了。我該怎麼做？"}, {"s": "A", "en": "I'll prescribe some medicine. Take this antiviral pill twice a day, after meals, for five days.", "zh": "我會開藥給你。這個抗病毒藥一天吃兩次，飯後吃，連續五天。"}, {"s": "B", "en": "Okay. Is there anything else I should take?", "zh": "好的。還有其他需要吃的藥嗎？"}, {"s": "A", "en": "Yes, this cough syrup three times a day. You can also take a fever reducer if your temperature goes above thirty-eight.", "zh": "有，這個咳嗽糖漿一天三次。如果體溫超過三十八度，也可以吃退燒藥。"}, {"s": "B", "en": "Should I stay home from work?", "zh": "我需要在家休息不去上班嗎？"}, {"s": "A", "en": "Yes, I recommend resting at home for at least three days. The flu is very contagious.", "zh": "是的，我建議在家休息至少三天。流感傳染力很強。"}, {"s": "B", "en": "Could you write a medical certificate for my company?", "zh": "你可以幫我開一張給公司的診斷證明嗎？"}, {"s": "A", "en": "Of course. I'll write it for three days.", "zh": "當然。我開三天的。"}, {"s": "B", "en": "Is there anything I should avoid eating or drinking?", "zh": "有什麼飲食需要避免嗎？", "h": "4. 生活建議與回診"}, {"s": "A", "en": "Avoid cold drinks and spicy food. Drink lots of warm water, and eat light meals like soup or porridge.", "zh": "避免冰飲和辛辣食物。多喝溫水，吃清淡的食物，像是湯或粥。"}, {"s": "B", "en": "How long will it take to recover?", "zh": "要多久才會康復？"}, {"s": "A", "en": "Most people feel better in about a week.", "zh": "大多數人大約一週後會好轉。"}, {"s": "B", "en": "Can I go back to work after three days?", "zh": "三天後我可以回去上班嗎？"}, {"s": "A", "en": "If your fever is gone and you feel strong enough, yes. Otherwise, rest a little longer.", "zh": "如果燒退了而且你覺得體力足夠，就可以。否則請再多休息一下。"}, {"s": "B", "en": "What if my fever doesn't go down?", "zh": "如果我的燒退不下來怎麼辦？"}, {"s": "A", "en": "If it's still high after two days, or if you have trouble breathing, come back right away.", "zh": "如果兩天後還是很高，或出現呼吸困難，請馬上回來。"}, {"s": "B", "en": "I understand. Thank you so much, Doctor.", "zh": "我了解了。非常謝謝您，醫生。"}, {"s": "A", "en": "You're welcome. Please pick up your medicine at the pharmacy downstairs. Take care and get well soon!", "zh": "不客氣。請到樓下藥局領藥。多保重，早日康復！"}, {"s": "B", "en": "Thank you. Goodbye!", "zh": "謝謝。再見！"}]},
  {"id": "bank", "icon": "🏦", "title": "銀行開戶與匯款", "en": "Opening a Bank Account", "roles": {"A": "Teller 行員", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning. How can I help you today?", "zh": "早安。今天有什麼可以為您服務的？", "h": "1. 開戶"}, {"s": "B", "en": "Good morning. I'd like to open a savings account, please.", "zh": "早安。我想開一個儲蓄帳戶。"}, {"s": "A", "en": "Certainly. Are you a new customer?", "zh": "沒問題。您是新客戶嗎？"}, {"s": "B", "en": "Yes, I just moved to this city.", "zh": "是的，我剛搬來這座城市。"}, {"s": "A", "en": "Welcome. May I see your passport and proof of address?", "zh": "歡迎。可以看一下您的護照和地址證明嗎？"}, {"s": "B", "en": "Here is my passport. For proof of address, I have my rental contract.", "zh": "這是我的護照。地址證明的話，我有租賃合約。"}, {"s": "A", "en": "That works. Please fill out this application form.", "zh": "可以的。請填寫這份申請表。"}, {"s": "B", "en": "Okay. Could you explain the difference between a savings account and a checking account?", "zh": "好的。你可以說明儲蓄帳戶和支票帳戶的差別嗎？"}, {"s": "A", "en": "A savings account earns interest, and it's best for saving money. A checking account is for daily spending and comes with a debit card.", "zh": "儲蓄帳戶會有利息，最適合存錢。支票帳戶用於日常消費，並附有金融卡。"}, {"s": "B", "en": "I think I need both.", "zh": "我想我兩種都需要。"}, {"s": "A", "en": "No problem. We can open both for you. The checking account has a monthly fee of five dollars, but it's free if you keep at least five hundred dollars in the account.", "zh": "沒問題。我們可以幫您兩個都開。支票帳戶每月有五元手續費，但如果帳戶裡至少保持五百元就免費。"}, {"s": "B", "en": "That's good to know. What's the interest rate on the savings account?", "zh": "知道了。儲蓄帳戶的利率是多少？"}, {"s": "A", "en": "It's two percent per year.", "zh": "年利率是百分之二。"}, {"s": "B", "en": "Okay. I'd like to deposit five hundred dollars to start.", "zh": "好的。我想先存五百元。"}, {"s": "A", "en": "Wonderful. Please sign here and here.", "zh": "太好了。請在這裡和這裡簽名。", "h": "2. 金融卡與網路銀行"}, {"s": "B", "en": "Done.", "zh": "簽好了。"}, {"s": "A", "en": "Your account is now open. Your debit card will arrive by mail in about seven days.", "zh": "您的帳戶已開通。您的金融卡大約七天後會寄到。"}, {"s": "B", "en": "Can I use my account before the card arrives?", "zh": "在卡片寄到前我可以使用帳戶嗎？"}, {"s": "A", "en": "Yes, you can make deposits and withdrawals at the counter.", "zh": "可以，您可以在櫃台存款和提款。"}, {"s": "B", "en": "Great. Can I also set up online banking?", "zh": "太好了。我也可以設定網路銀行嗎？"}, {"s": "A", "en": "Of course. I'll give you a temporary password. You'll need to change it the first time you log in.", "zh": "當然。我會給您一組臨時密碼。第一次登入時需要更改。"}, {"s": "B", "en": "Excuse me, I'd also like to send money to my family overseas.", "zh": "不好意思，我還想匯款給海外的家人。", "h": "3. 海外匯款"}, {"s": "A", "en": "Sure. How much would you like to send, and to which country?", "zh": "好的。您想匯多少錢，匯到哪個國家？"}, {"s": "B", "en": "One thousand dollars to Taiwan.", "zh": "一千元，匯到台灣。"}, {"s": "A", "en": "There's a transfer fee of twenty dollars, and the exchange rate today is thirty point five.", "zh": "手續費是二十元，今天的匯率是三十點五。"}, {"s": "B", "en": "How long will it take for the money to arrive?", "zh": "錢多久會到？"}, {"s": "A", "en": "Usually two to three business days.", "zh": "通常是兩到三個工作天。"}, {"s": "B", "en": "Okay. I have the recipient's bank details here.", "zh": "好的。收款人的銀行資料在這裡。"}, {"s": "A", "en": "Thank you. Please check that the name and account number are correct.", "zh": "謝謝。請確認姓名和帳號是否正確。"}, {"s": "B", "en": "Yes, everything is correct.", "zh": "對，全部正確。"}, {"s": "A", "en": "Please sign here to confirm the transfer.", "zh": "請在這裡簽名確認匯款。"}, {"s": "B", "en": "Done.", "zh": "簽好了。"}, {"s": "A", "en": "Your transfer is complete. Here's your receipt. Please keep it for your records.", "zh": "您的匯款完成了。這是您的收據。請保留作為紀錄。", "h": "4. 結束"}, {"s": "B", "en": "Thank you. Is there anything else I should know about the account?", "zh": "謝謝。關於這個帳戶，還有什麼需要注意的嗎？"}, {"s": "A", "en": "Please never share your PIN or password with anyone, and call us right away if you lose your card.", "zh": "請絕對不要把密碼告訴任何人，如果卡片遺失，請立刻打電話給我們。"}, {"s": "B", "en": "I will. Where is the nearest ATM if I need cash after hours?", "zh": "我會的。如果下班後我需要現金，最近的提款機在哪裡？"}, {"s": "A", "en": "There's one right outside the front door, and it's open twenty-four hours.", "zh": "大門外就有一台，二十四小時開放。"}, {"s": "B", "en": "Perfect. Thank you for your help today.", "zh": "太好了。謝謝你今天的協助。"}, {"s": "A", "en": "You're welcome. Have a wonderful day!", "zh": "不客氣。祝您有美好的一天！"}]},
  {"id": "apartment", "icon": "🏠", "title": "租房看房", "en": "Viewing an Apartment", "roles": {"A": "Agent 房仲", "B": "You 你"}, "lines": [{"s": "A", "en": "Hello, thanks for coming. I'm Jason from Bright Homes. You must be here to see the apartment.", "zh": "你好，謝謝你來。我是明亮房屋的傑森。你一定是來看房子的。", "h": "1. 客廳與廚房"}, {"s": "B", "en": "Yes, hi. Nice to meet you. I'm interested in the two-bedroom apartment.", "zh": "對，嗨。很高興認識你。我對兩房的公寓有興趣。"}, {"s": "A", "en": "Great. Let me show you around. This is the living room.", "zh": "太好了。我帶你參觀一下。這是客廳。"}, {"s": "B", "en": "It's bright and spacious. Does it get a lot of sunlight?", "zh": "又明亮又寬敞。陽光多嗎？"}, {"s": "A", "en": "Yes, it faces south, so it's sunny all afternoon.", "zh": "是的，朝南，所以整個下午都有陽光。"}, {"s": "B", "en": "Wonderful. Can I see the kitchen?", "zh": "太好了。我可以看廚房嗎？"}, {"s": "A", "en": "Sure. It has a new refrigerator, a stove, and a microwave.", "zh": "當然。有新的冰箱、爐子和微波爐。"}, {"s": "B", "en": "Is there a washing machine?", "zh": "有洗衣機嗎？"}, {"s": "A", "en": "Yes, it's in the small room next to the bathroom.", "zh": "有，在浴室旁邊的小房間。"}, {"s": "A", "en": "This is the main bedroom. It has a big closet and a window overlooking the garden.", "zh": "這是主臥室。有大衣櫃，窗戶看出去是花園。", "h": "2. 臥室與浴室"}, {"s": "B", "en": "It's lovely. And the second bedroom?", "zh": "很棒。那第二間臥室呢？"}, {"s": "A", "en": "It's a bit smaller, but it works well as a home office.", "zh": "稍微小一點，但很適合當作居家辦公室。"}, {"s": "B", "en": "Perfect. I work from home a few days a week. How's the internet here?", "zh": "太好了。我每週有幾天在家工作。這裡網路如何？"}, {"s": "A", "en": "Fiber optic internet is available in the building, and you can sign up with any provider.", "zh": "大樓有光纖網路，你可以向任何業者申請。"}, {"s": "B", "en": "Good. Is there hot water all the time?", "zh": "很好。熱水隨時都有嗎？"}, {"s": "A", "en": "Yes, there's a gas water heater, so you always have hot water.", "zh": "有的，有瓦斯熱水器，所以隨時都有熱水。"}, {"s": "B", "en": "How much is the monthly rent?", "zh": "每個月租金多少？", "h": "3. 租金與租約"}, {"s": "A", "en": "It's one thousand two hundred dollars, and utilities are not included.", "zh": "一千兩百元，水電費不含在內。"}, {"s": "B", "en": "How much are the utilities usually?", "zh": "水電費通常多少？"}, {"s": "A", "en": "About one hundred to one hundred fifty dollars a month, depending on the season.", "zh": "每個月大約一百到一百五十元，依季節而定。"}, {"s": "B", "en": "What about the deposit?", "zh": "那押金呢？"}, {"s": "A", "en": "It's two months' rent, and you get it back when you move out, as long as there's no damage.", "zh": "是兩個月的租金，搬走時只要沒有損壞就會退還。"}, {"s": "B", "en": "What's the minimum lease term?", "zh": "最短租期是多久？"}, {"s": "A", "en": "One year. After that, you can renew it or go month to month.", "zh": "一年。之後你可以續約，或改成月租。"}, {"s": "B", "en": "When would the apartment be available?", "zh": "這間公寓什麼時候可以入住？"}, {"s": "A", "en": "It's available from the first of next month.", "zh": "下個月一號就可以入住。"}, {"s": "B", "en": "Are pets allowed? I have a small cat.", "zh": "可以養寵物嗎？我有一隻小貓。"}, {"s": "A", "en": "Small pets are okay, but there's an extra pet deposit of two hundred dollars.", "zh": "小型寵物可以，但需要額外繳兩百元的寵物押金。"}, {"s": "B", "en": "Is the neighborhood safe? And is it close to public transportation?", "zh": "這附近安全嗎？離大眾運輸近嗎？", "h": "4. 周邊環境與決定"}, {"s": "A", "en": "Very safe. The subway station is a five-minute walk, and there's a supermarket on the corner.", "zh": "非常安全。捷運站走路五分鐘，轉角還有超市。"}, {"s": "B", "en": "That's convenient. Is parking available?", "zh": "很方便。有停車位嗎？"}, {"s": "A", "en": "Yes, there's an underground parking space for eighty dollars a month.", "zh": "有，有地下停車位，每個月八十元。"}, {"s": "B", "en": "I don't have a car, so I don't need that. I like the apartment. Can I think about it for a day?", "zh": "我沒有車，所以不需要。我喜歡這間公寓。我可以考慮一天嗎？"}, {"s": "A", "en": "Of course. But please let me know soon, because two other people are interested.", "zh": "當然。但請盡快告訴我，因為還有另外兩個人有興趣。"}, {"s": "B", "en": "I understand. I'll call you tomorrow morning. Could I take some photos?", "zh": "我了解。我明天早上會打給你。我可以拍幾張照片嗎？"}, {"s": "A", "en": "Sure. Here's my card. Feel free to call me with any questions.", "zh": "當然。這是我的名片。有任何問題歡迎打給我。"}, {"s": "B", "en": "Thank you for showing me around.", "zh": "謝謝你帶我參觀。"}, {"s": "A", "en": "My pleasure. I hope to hear from you soon!", "zh": "我的榮幸。希望很快收到你的消息！"}]},
  {"id": "interview", "icon": "🧑‍💼", "title": "求職面試", "en": "A Job Interview", "roles": {"A": "Interviewer 面試官", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning, and thank you for coming in today. Please have a seat.", "zh": "早安，謝謝你今天前來。請坐。", "h": "1. 開場"}, {"s": "B", "en": "Good morning. Thank you for having me.", "zh": "早安。謝謝你給我這個機會。"}, {"s": "A", "en": "Did you have any trouble finding our office?", "zh": "你找我們辦公室有遇到困難嗎？"}, {"s": "B", "en": "Not at all. The directions were very clear, and I arrived a little early.", "zh": "一點也沒有。指示很清楚，我還提早到了一點。"}, {"s": "A", "en": "Wonderful. Can I get you some water or coffee before we begin?", "zh": "太好了。開始前要不要來點水或咖啡？"}, {"s": "B", "en": "Water would be great, thank you.", "zh": "水就好，謝謝。"}, {"s": "A", "en": "Let's get started. Could you tell me a little about yourself?", "zh": "我們開始吧。可以先簡單介紹一下你自己嗎？"}, {"s": "B", "en": "Sure. I graduated with a degree in business, and I've worked in marketing for the past four years.", "zh": "當然。我商學系畢業，過去四年一直在行銷領域工作。", "h": "2. 自我介紹與經驗"}, {"s": "B", "en": "In my current job, I manage social media campaigns and work closely with the design team.", "zh": "目前的工作中，我負責管理社群媒體活動，並與設計團隊密切合作。"}, {"s": "A", "en": "That sounds interesting. What was your biggest achievement in that role?", "zh": "聽起來很有意思。你在那個職位上最大的成就是什麼？"}, {"s": "B", "en": "Last year, I led a campaign that increased our online sales by thirty percent in six months.", "zh": "去年我主導了一個活動，在六個月內讓我們的線上銷售增加了百分之三十。"}, {"s": "A", "en": "That's impressive. How did you achieve that?", "zh": "很令人印象深刻。你是怎麼做到的？"}, {"s": "B", "en": "We studied our customers' habits, and then we created short videos that showed how our products solve everyday problems.", "zh": "我們研究了顧客的習慣，然後製作短影片，展示產品如何解決日常問題。"}, {"s": "A", "en": "Did you face any challenges during the project?", "zh": "在這個專案中你有遇到什麼挑戰嗎？"}, {"s": "B", "en": "Yes. The budget was limited, so I had to be creative. I worked with small influencers instead of big celebrities.", "zh": "有的。預算有限，所以我必須有創意。我與小型網紅合作，而不是大明星。"}, {"s": "A", "en": "Why do you want to work for our company?", "zh": "你為什麼想來我們公司工作？", "h": "3. 動機與能力"}, {"s": "B", "en": "I've followed your brand for years, and I admire how you connect with young customers. I'd love to contribute to that.", "zh": "我關注你們的品牌好幾年了，很欣賞你們與年輕顧客連結的方式。我很希望能貢獻一己之力。"}, {"s": "A", "en": "What would you say is your greatest strength?", "zh": "你認為你最大的優點是什麼？"}, {"s": "B", "en": "I'm very organized, and I communicate well with different teams.", "zh": "我很有條理，也很擅長與不同團隊溝通。"}, {"s": "A", "en": "And what is an area you're trying to improve?", "zh": "那有什麼是你正在努力改進的地方？"}, {"s": "B", "en": "I sometimes take on too much work myself. I'm learning to delegate tasks and trust my teammates.", "zh": "我有時會自己攬太多工作。我正在學習分配任務並信任團隊成員。"}, {"s": "A", "en": "How do you handle stress and tight deadlines?", "zh": "你如何處理壓力和緊迫的截止日期？"}, {"s": "B", "en": "I make a priority list at the start of each day, and I break big tasks into smaller steps.", "zh": "我每天一開始會列出優先順序，並把大任務拆成小步驟。"}, {"s": "A", "en": "Let's say a teammate disagrees with your idea. What would you do?", "zh": "假設同事不同意你的想法，你會怎麼做？"}, {"s": "B", "en": "I would listen carefully first. Then we could test both ideas with a small experiment and look at the results.", "zh": "我會先仔細傾聽。然後我們可以用小實驗測試兩種想法，再看結果。"}, {"s": "A", "en": "Where do you see yourself in five years?", "zh": "你五年後希望自己在哪裡？", "h": "4. 工作條件與提問"}, {"s": "B", "en": "I hope to become a team leader and help train new employees.", "zh": "我希望成為團隊主管，並協助訓練新進員工。"}, {"s": "A", "en": "This position requires occasional overtime and some travel. Is that okay for you?", "zh": "這個職位偶爾需要加班，也會有一些出差。你可以接受嗎？"}, {"s": "B", "en": "Yes, I'm flexible. I just ask for some notice when possible.", "zh": "可以，我很有彈性。只要可能的話，希望能提前通知。"}, {"s": "A", "en": "When would you be able to start if we offered you the job?", "zh": "如果我們錄用你，你什麼時候可以開始上班？"}, {"s": "B", "en": "I need to give one month's notice at my current company, so I could start in about five weeks.", "zh": "我需要在目前公司提前一個月通知，所以大約五週後可以開始。"}, {"s": "A", "en": "Do you have any questions for us?", "zh": "你有什麼問題想問我們嗎？"}, {"s": "B", "en": "Yes. What does a typical day look like for this role?", "zh": "有的。這個職位平常一天的工作是什麼樣子？"}, {"s": "A", "en": "You'll start with a team meeting, then work on campaigns, and review results in the afternoon.", "zh": "你會從團隊會議開始，然後處理活動企劃，下午檢視成效。"}, {"s": "B", "en": "And are there opportunities for training and growth?", "zh": "還有培訓與成長的機會嗎？"}, {"s": "A", "en": "Absolutely. We offer workshops every quarter and support further education.", "zh": "當然有。我們每季都有工作坊，也支持進修。"}, {"s": "A", "en": "Great. We're interviewing a few more candidates this week, and we'll contact you by Friday.", "zh": "很好。我們這週還會面試幾位候選人，會在週五前聯絡你。", "h": "5. 結束面試"}, {"s": "B", "en": "Thank you. I really enjoyed our conversation.", "zh": "謝謝。我很喜歡我們的談話。"}, {"s": "A", "en": "It was a pleasure meeting you. Thank you for your time.", "zh": "很高興認識你。謝謝你撥冗前來。"}, {"s": "B", "en": "Thank you again. Have a wonderful day!", "zh": "再次謝謝您。祝您有美好的一天！"}]},
  {"id": "weather", "icon": "☀️", "title": "天氣閒聊", "en": "Talking About the Weather", "roles": {"A": "Neighbor 鄰居", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning! Beautiful day, isn't it?", "zh": "早安！今天天氣真好，不是嗎？", "h": "1. 今天的天氣"}, {"s": "B", "en": "It sure is. After all that rain last week, the sunshine feels wonderful.", "zh": "真的。經過上週那麼多雨，陽光感覺好舒服。"}, {"s": "A", "en": "I know. It rained for five days in a row. My garden was almost under water.", "zh": "我知道。連續下了五天雨。我的花園差點被水淹了。"}, {"s": "B", "en": "Oh no. Did your flowers survive?", "zh": "哦不。你的花有活下來嗎？"}, {"s": "A", "en": "Most of them did, but the tomatoes are in bad shape. Too much water.", "zh": "大部分有，但番茄的狀況很糟。水太多了。"}, {"s": "B", "en": "That's a shame. It's finally warm today, though. It must be around twenty-five degrees.", "zh": "真可惜。不過今天終於變暖和了。應該有二十五度左右。"}, {"s": "A", "en": "The radio said it would reach twenty-eight by the afternoon.", "zh": "廣播說下午會到二十八度。"}, {"s": "B", "en": "Wow, that's a big change from last week. It was so cold and windy.", "zh": "哇，和上週的差別好大。那時候又冷又有風。"}, {"s": "A", "en": "Do you know what the weather will be like this weekend?", "zh": "你知道這個週末的天氣會怎麼樣嗎？", "h": "2. 週末的預報"}, {"s": "B", "en": "I checked the forecast this morning. It says sunny on Saturday, but there's a chance of thunderstorms on Sunday afternoon.", "zh": "我今天早上查了預報。說週六晴天，但週日下午可能有雷雨。"}, {"s": "A", "en": "How likely is it?", "zh": "機率有多高？"}, {"s": "B", "en": "About sixty percent. So if we want to do something outside, Saturday is the day.", "zh": "大約百分之六十。所以如果我們想在戶外做些什麼，週六才是好日子。"}, {"s": "A", "en": "That's a good point. Are you doing anything special this weekend?", "zh": "這是個好觀點。你這個週末有什麼特別的安排嗎？"}, {"s": "B", "en": "I was thinking about going to the beach, but it might be too crowded when it's this warm.", "zh": "我本來想去海邊，但天氣這麼暖和，可能人會太多。"}, {"s": "A", "en": "True. Hot weather brings everyone out. How about the lake instead? It's usually quieter.", "zh": "沒錯。炎熱的天氣會讓每個人都出門。改去湖邊怎麼樣？通常比較安靜。"}, {"s": "B", "en": "That's a great idea. I haven't been there in a long time.", "zh": "好主意。我好久沒去那裡了。"}, {"s": "A", "en": "Do you like this kind of weather, or do you prefer cooler days?", "zh": "你喜歡這種天氣，還是比較喜歡涼爽的日子？", "h": "3. 季節與穿著"}, {"s": "B", "en": "I like spring and autumn the best. Summer is too hot and humid for me.", "zh": "我最喜歡春天和秋天。夏天對我來說又熱又潮濕。"}, {"s": "A", "en": "I agree. The humidity makes me tired. But I love winter, especially when it snows.", "zh": "我同意。濕度讓我覺得很累。但我喜歡冬天，尤其是下雪的時候。"}, {"s": "B", "en": "Does it snow a lot where you grew up?", "zh": "你長大的地方常下雪嗎？"}, {"s": "A", "en": "Yes, we usually had snow from December to March. We built snowmen every year.", "zh": "有，我們通常從十二月到三月都有雪。我們每年都堆雪人。"}, {"s": "B", "en": "That sounds lovely. In Taiwan, it almost never snows, except on the high mountains.", "zh": "聽起來很美。在台灣，除了高山上，幾乎從不下雪。"}, {"s": "A", "en": "So what do you wear when it gets cold?", "zh": "那天氣變冷的時候你都穿什麼？"}, {"s": "B", "en": "Just a light jacket and a scarf. Today I'm only wearing a T-shirt, though.", "zh": "只要一件薄外套和一條圍巾。不過今天我只穿了 T 恤。"}, {"s": "A", "en": "Smart. I wore a sweater this morning, and now I'm too warm.", "zh": "聰明。我今天早上穿了毛衣，現在太熱了。"}, {"s": "B", "en": "Maybe you should take it off and carry it.", "zh": "也許你應該把它脫掉拿在手上。"}, {"s": "A", "en": "Good idea. By the way, I'm planning a barbecue this Saturday afternoon. Would you like to come?", "zh": "好主意。對了，我打算這週六下午辦烤肉。你想來嗎？", "h": "4. 烤肉邀約"}, {"s": "B", "en": "I'd love to! What time should I come?", "zh": "我很樂意！我幾點到？"}, {"s": "A", "en": "Around two o'clock. We'll start grilling at three.", "zh": "大約兩點。我們三點開始烤。"}, {"s": "B", "en": "Wonderful. What can I bring?", "zh": "太好了。我可以帶什麼？"}, {"s": "A", "en": "Maybe some drinks and a salad? I'll provide the meat and the corn.", "zh": "也許帶一些飲料和一份沙拉？我來準備肉和玉米。"}, {"s": "B", "en": "Sure. I'll bring lemonade and a big fruit salad.", "zh": "沒問題。我會帶檸檬汁和一大份水果沙拉。"}, {"s": "A", "en": "Perfect. And if it rains, we can move everything into the garage.", "zh": "太好了。如果下雨，我們可以把一切搬進車庫。"}, {"s": "B", "en": "Good plan. I'll check the forecast again on Friday evening.", "zh": "好計畫。我週五晚上會再查一次預報。"}, {"s": "A", "en": "Me too. I'll send you a message if we need to change anything.", "zh": "我也是。如果需要改變任何事，我會傳訊息給你。"}, {"s": "B", "en": "Great. Thanks for the invitation. See you on Saturday!", "zh": "太好了。謝謝你的邀請。週六見！"}, {"s": "A", "en": "See you then. Enjoy the sunshine!", "zh": "到時見。好好享受陽光！"}]},
  {"id": "movie", "icon": "🎬", "title": "看電影買票", "en": "Buying Movie Tickets", "roles": {"A": "Ticket seller 售票員", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi, welcome to Star Cinema. What can I do for you?", "zh": "嗨，歡迎光臨星光電影院。有什麼可以為您服務的？", "h": "1. 選片與場次"}, {"s": "B", "en": "Hi. What movies are showing tonight?", "zh": "嗨。今晚有哪些電影在上映？"}, {"s": "A", "en": "We have a new action movie, a romantic comedy, and an animated film for kids. The action movie is the most popular.", "zh": "我們有一部新的動作片、一部愛情喜劇，還有一部兒童動畫。動作片最受歡迎。"}, {"s": "B", "en": "I'd like to see the romantic comedy. What time are the shows?", "zh": "我想看愛情喜劇。幾點有場次？"}, {"s": "A", "en": "There are shows at six thirty, eight forty-five, and eleven.", "zh": "有六點半、八點四十五分和十一點的場次。"}, {"s": "B", "en": "How long is the movie?", "zh": "這部電影多長？"}, {"s": "A", "en": "It's two hours and ten minutes, including the trailers.", "zh": "兩小時十分鐘，包含預告片。"}, {"s": "B", "en": "Then I'll take the six thirty show, so I can still get home early.", "zh": "那我要六點半的場次，這樣還可以早點回家。"}, {"s": "A", "en": "How many tickets would you like?", "zh": "您要幾張票？"}, {"s": "B", "en": "Two tickets, please. Are there any discounts for students?", "zh": "兩張票。學生有折扣嗎？"}, {"s": "A", "en": "Yes, students get two dollars off with a valid ID. Do you both have student IDs?", "zh": "有，出示有效學生證可折兩元。你們兩位都有學生證嗎？"}, {"s": "B", "en": "Only I do. My friend graduated last year.", "zh": "只有我有。我朋友去年畢業了。"}, {"s": "A", "en": "No problem. One student ticket and one adult ticket. Do you have a preference for seats?", "zh": "沒問題。一張學生票和一張全票。您對座位有偏好嗎？", "h": "2. 選座位"}, {"s": "B", "en": "We'd like to sit in the middle, not too close to the screen.", "zh": "我們想坐中間，不要離螢幕太近。"}, {"s": "A", "en": "Let me check the seating chart. Row ten is nearly full, but I have two seats together in row eleven, in the center.", "zh": "我看一下座位表。第十排快滿了，但第十一排中間有兩個相連的位子。"}, {"s": "B", "en": "That sounds perfect. Is there enough legroom there?", "zh": "聽起來很完美。那裡的腿部空間夠嗎？"}, {"s": "A", "en": "Yes, those seats are very comfortable. We also have premium seats that recline, for five dollars more.", "zh": "有，那些座位很舒服。我們也有可以斜躺的高級座位，每張多五元。"}, {"s": "B", "en": "I'll stay with the regular seats, thank you.", "zh": "我還是選一般座位，謝謝。"}, {"s": "A", "en": "Great. That's eleven E and eleven F. The total is twenty-three dollars.", "zh": "好的。是 11E 和 11F。總共二十三元。"}, {"s": "B", "en": "Can I pay with my phone?", "zh": "我可以用手機付款嗎？"}, {"s": "A", "en": "Yes, just tap it here. Would you like to add any snacks or drinks to your order?", "zh": "可以，在這裡感應就好。您想在訂單中加點零食或飲料嗎？", "h": "3. 零食與飲料"}, {"s": "B", "en": "Yes, what are the combos?", "zh": "好的，有哪些套餐？"}, {"s": "A", "en": "Combo one is a large popcorn and two small drinks for twelve dollars. Combo two has a medium popcorn and two drinks for ten.", "zh": "套餐一是一個大爆米花加兩杯小杯飲料，十二元。套餐二是一個中爆米花加兩杯飲料，十元。"}, {"s": "B", "en": "We'll take combo two. Can I get the popcorn with butter on the side?", "zh": "我們要套餐二。爆米花的奶油可以另外放旁邊嗎？"}, {"s": "A", "en": "Of course. What drinks would you like?", "zh": "當然可以。您想要什麼飲料？"}, {"s": "B", "en": "One cola and one orange juice, please.", "zh": "一杯可樂和一杯柳橙汁。"}, {"s": "A", "en": "Sure. Would you like to add some candy or chocolate?", "zh": "好的。要加一些糖果或巧克力嗎？"}, {"s": "B", "en": "No, thanks. That's enough for us.", "zh": "不用，謝謝。這樣對我們就夠了。"}, {"s": "A", "en": "Your new total is thirty-three dollars. Here are your tickets and your snacks.", "zh": "您的新總額是三十三元。這是您的票和零食。", "h": "4. 入場與注意事項"}, {"s": "B", "en": "Thank you. Which theater is it?", "zh": "謝謝。是哪一廳？"}, {"s": "A", "en": "Theater six, down the hall on the right. They will start letting people in about ten minutes before the show.", "zh": "六號廳，沿著走廊走，在右手邊。他們會在開演前大約十分鐘開始入場。"}, {"s": "B", "en": "Where are the restrooms?", "zh": "洗手間在哪裡？"}, {"s": "A", "en": "Next to the snack bar. You have plenty of time before the show.", "zh": "在零食櫃台旁邊。開演前您有很多時間。"}, {"s": "B", "en": "Is it okay to take my drink inside?", "zh": "我可以把飲料帶進去嗎？"}, {"s": "A", "en": "Yes, you can take all the food and drinks you buy here. Please remember to turn off your phones during the movie.", "zh": "可以，您在這裡買的所有食物和飲料都可以帶進去。電影放映時請記得關掉手機。"}, {"s": "B", "en": "Of course. And what if we're a few minutes late?", "zh": "當然。如果我們晚了幾分鐘怎麼辦？"}, {"s": "A", "en": "You can still go in. There are about fifteen minutes of trailers before the movie begins.", "zh": "還是可以進去。電影開始前大約有十五分鐘的預告片。"}, {"s": "B", "en": "Great. Thank you for your help.", "zh": "太好了。謝謝你的協助。"}, {"s": "A", "en": "You're welcome. Enjoy the movie!", "zh": "不客氣。祝您看得開心！"}]},
  {"id": "gym", "icon": "🏋️", "title": "健身房入會", "en": "Joining a Gym", "roles": {"A": "Staff 櫃台人員", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi, welcome to Fit Zone! Is this your first time here?", "zh": "嗨，歡迎來到健身天地！這是你第一次來嗎？", "h": "1. 參觀與詢問"}, {"s": "B", "en": "Yes, it is. I'm thinking about joining a gym, and a friend recommended this one.", "zh": "是的。我在考慮加入健身房，有朋友推薦這一間。"}, {"s": "A", "en": "That's great. Would you like a quick tour before we talk about the membership?", "zh": "太好了。在討論會員方案之前，你想先快速參觀一下嗎？"}, {"s": "B", "en": "Yes, please. I'd like to see the equipment first.", "zh": "好的，麻煩你。我想先看看器材。"}, {"s": "A", "en": "This is the main training area. We have treadmills, bikes, and free weights, and the machines for strength training are over there.", "zh": "這裡是主要訓練區。我們有跑步機、腳踏車和自由重量，肌力訓練器材在那邊。"}, {"s": "B", "en": "It looks very clean. Is it crowded in the evening?", "zh": "看起來很乾淨。晚上人多嗎？"}, {"s": "A", "en": "It's busiest between six and eight, after work. If you want a quieter time, mornings and early afternoons are best.", "zh": "下班後六點到八點最忙。如果你想要安靜一點的時間，早上和下午早一點最適合。"}, {"s": "B", "en": "Good to know. Do you have group classes too?", "zh": "知道了。你們也有團體課程嗎？"}, {"s": "A", "en": "Yes, we offer yoga, spinning, and dance classes. The schedule is on the wall over there.", "zh": "有，我們有瑜珈、飛輪和舞蹈課。課表在那邊的牆上。"}, {"s": "B", "en": "I'd like to try yoga. Do I need to sign up in advance?", "zh": "我想試試瑜珈。需要提前報名嗎？", "h": "2. 方案與價格"}, {"s": "A", "en": "Yes, you can reserve a spot on our app. Classes fill up quickly.", "zh": "需要，你可以在我們的 App 上預約位子。課程很快就會額滿。"}, {"s": "B", "en": "Okay. What kinds of memberships do you have?", "zh": "好的。你們有哪些會員方案？"}, {"s": "A", "en": "We have a monthly plan for fifty dollars, a six-month plan for two hundred forty, and a yearly plan for four hundred fifty.", "zh": "我們有月費方案五十元、六個月方案兩百四十元，以及年費方案四百五十元。"}, {"s": "B", "en": "The yearly plan is cheaper per month. Is there a contract?", "zh": "年費方案平均每個月比較便宜。有合約嗎？"}, {"s": "A", "en": "The monthly plan has no contract, and you can cancel any time. The longer plans require you to pay in advance.", "zh": "月費方案沒有合約，隨時可以取消。比較長的方案需要預先付款。"}, {"s": "B", "en": "I think I'd like to try the monthly plan first, to see if I like it.", "zh": "我想先試月費方案，看看我是否喜歡。"}, {"s": "A", "en": "That's a smart choice. Also, we have a special offer this week: no sign-up fee, which saves you thirty dollars.", "zh": "聰明的選擇。另外我們這週有優惠：免辦卡費，可以幫你省三十元。"}, {"s": "B", "en": "That's great. Does the membership include a locker and towels?", "zh": "太好了。會員資格有包含置物櫃和毛巾嗎？"}, {"s": "A", "en": "Lockers are free, but you need to bring your own lock. Towels are available for one dollar each.", "zh": "置物櫃免費，但你需要自備鎖頭。毛巾一條一元。"}, {"s": "A", "en": "Okay, I'll need some information from you. Could you fill out this form?", "zh": "好的，我需要你的一些資料。可以請你填寫這份表格嗎？", "h": "3. 辦理入會"}, {"s": "B", "en": "Sure. Is there a health questionnaire on it?", "zh": "好的。上面有健康問卷嗎？"}, {"s": "A", "en": "Yes, on the second page. Please let us know if you have any injuries or if you're taking medication.", "zh": "有，在第二頁。如果你有任何受傷或正在服藥，請告訴我們。"}, {"s": "B", "en": "I hurt my knee last year, but it's mostly better now.", "zh": "我去年膝蓋受過傷，但現在大致好了。"}, {"s": "A", "en": "Thanks for telling me. I'd recommend working with a trainer for your first session. It's free for new members.", "zh": "謝謝你告訴我。我建議你第一次訓練時跟教練一起進行。新會員免費。"}, {"s": "B", "en": "That would be very helpful. Can I book it now?", "zh": "那會很有幫助。我現在可以預約嗎？"}, {"s": "A", "en": "Of course. How about tomorrow at ten, with our trainer, Mike?", "zh": "當然。明天十點，和我們的教練麥克，如何？"}, {"s": "B", "en": "That works for me.", "zh": "我可以。"}, {"s": "A", "en": "Now, for payment, will it be cash or card?", "zh": "接下來是付款，您要付現還是刷卡？"}, {"s": "B", "en": "Card, please.", "zh": "刷卡。"}, {"s": "A", "en": "Your total is fifty dollars for the first month. Here's your membership card. Don't forget to bring it every time.", "zh": "第一個月總共五十元。這是你的會員卡。每次來都別忘了帶。", "h": "4. 開放時間與使用規則"}, {"s": "B", "en": "What are your opening hours?", "zh": "你們的營業時間是什麼時候？"}, {"s": "A", "en": "We're open from five thirty in the morning until eleven at night on weekdays, and from seven to ten on weekends.", "zh": "平日早上五點半到晚上十一點營業，週末是七點到十點。"}, {"s": "B", "en": "Is there a place to shower after my workout?", "zh": "運動後有地方可以淋浴嗎？"}, {"s": "A", "en": "Yes, the locker rooms have showers, and they come with shampoo and body wash.", "zh": "有，更衣室有淋浴間，也有提供洗髮精和沐浴乳。"}, {"s": "B", "en": "Are there any rules I should know about?", "zh": "有什麼規定是我需要知道的嗎？"}, {"s": "A", "en": "Please wipe down the machines after you use them, and put the weights back where you found them.", "zh": "使用完請擦拭器材，並把重量器材放回原本的位置。"}, {"s": "B", "en": "Of course. Thank you for all the information.", "zh": "當然。謝謝你提供的所有資訊。"}, {"s": "A", "en": "You're welcome. We look forward to seeing you tomorrow. Welcome to Fit Zone!", "zh": "不客氣。我們期待明天見到你。歡迎加入健身天地！"}]},
  {"id": "lost", "icon": "🎒", "title": "東西遺失", "en": "At the Lost and Found", "roles": {"A": "Staff 失物招領人員", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, I think I left my backpack on the train. Can you help me?", "zh": "不好意思，我想我把背包忘在火車上了。你可以幫我嗎？", "h": "1. 說明遺失經過"}, {"s": "A", "en": "I'm sorry to hear that. Let's see what we can do. When did you lose it?", "zh": "很遺憾聽到這件事。我們看看能怎麼幫忙。你是什麼時候弄丟的？"}, {"s": "B", "en": "About an hour ago. I got off at Central Station, and I realized it was gone when I reached the exit.", "zh": "大約一小時前。我在中央站下車，走到出口時才發現不見了。"}, {"s": "A", "en": "Which train were you on?", "zh": "你搭的是哪一班火車？"}, {"s": "B", "en": "The eleven fifteen from the airport, going to the city center. I was sitting in car number four.", "zh": "從機場開往市中心的十一點十五分那班。我坐在第四節車廂。"}, {"s": "A", "en": "Did you put the bag on the luggage rack or on the seat next to you?", "zh": "你把包包放在行李架上，還是旁邊的座位上？"}, {"s": "B", "en": "I put it on the seat next to me. I fell asleep for a few minutes, and I think I forgot it when I got off.", "zh": "我放在旁邊的座位上。我睡著了幾分鐘，我想是下車時忘了拿。"}, {"s": "A", "en": "That happens a lot. Don't worry. Many items are turned in by other passengers or by our cleaning staff.", "zh": "這種事很常發生。別擔心。很多物品會由其他乘客或我們的清潔人員交回來。"}, {"s": "A", "en": "Can you describe the bag for me?", "zh": "你可以向我描述一下那個包包嗎？", "h": "2. 描述物品"}, {"s": "B", "en": "It's a black backpack, medium size, with a small red tag on the zipper.", "zh": "是一個黑色的中型後背包，拉鍊上有一個小紅標籤。"}, {"s": "A", "en": "Is there a brand name on it?", "zh": "上面有品牌名稱嗎？"}, {"s": "B", "en": "Yes, it's a Northwind. The name is on the front pocket in white letters.", "zh": "有，是 Northwind。名字用白色字母印在前面的口袋。"}, {"s": "A", "en": "And what was inside?", "zh": "那裡面有什麼東西？"}, {"s": "B", "en": "My laptop in a gray case, a water bottle, a notebook, and my wallet.", "zh": "我的筆電，裝在灰色的保護套裡，一個水壺、一本筆記本，還有我的錢包。"}, {"s": "A", "en": "Was there anything with your name on it?", "zh": "裡面有任何寫著你名字的東西嗎？"}, {"s": "B", "en": "Yes, my business cards are in the front pocket, and my name is written inside the notebook.", "zh": "有，我的名片放在前面的口袋，筆記本裡面也寫了我的名字。"}, {"s": "A", "en": "That's very helpful. Please fill out this lost property form.", "zh": "那很有幫助。請填寫這張失物登記表。", "h": "3. 填表與查詢"}, {"s": "B", "en": "Of course. Do I need to write my phone number?", "zh": "當然。我需要寫電話號碼嗎？"}, {"s": "A", "en": "Yes, and your email address too, so we can contact you right away if we find it.", "zh": "需要，還有你的電子信箱，這樣如果我們找到了，可以馬上聯絡你。"}, {"s": "B", "en": "Here it is. Is the form complete?", "zh": "寫好了。表格完整嗎？"}, {"s": "A", "en": "Almost. You forgot to write the date and the time you lost it.", "zh": "差不多。你忘了寫遺失的日期和時間。"}, {"s": "B", "en": "Oh, thank you. I'll add that now.", "zh": "哦，謝謝你。我現在補上。"}, {"s": "A", "en": "Let me call the station at the end of the line. They check the trains when they arrive.", "zh": "我打電話給終點站。列車到站時，他們會檢查車廂。"}, {"s": "B", "en": "Thank you so much. How long will it take?", "zh": "非常謝謝你。大概要多久？"}, {"s": "A", "en": "Please wait here for a few minutes. Would you like a seat and some water?", "zh": "請在這裡等幾分鐘。你需要座位和水嗎？"}, {"s": "B", "en": "A seat would be nice. Thank you.", "zh": "有座位的話很好。謝謝。"}, {"s": "A", "en": "Good news. The cleaning staff found a black backpack on the train, in car number four.", "zh": "好消息。清潔人員在火車上第四節車廂找到一個黑色的後背包。", "h": "4. 找到與領取"}, {"s": "B", "en": "Oh, thank goodness! That must be mine.", "zh": "哦，謝天謝地！那一定是我的。"}, {"s": "A", "en": "They're bringing it to our office now. It will be here in about twenty minutes.", "zh": "他們現在正把它送到我們辦公室。大約二十分鐘後會到。"}, {"s": "B", "en": "That's wonderful. Do I need to show anything to get it back?", "zh": "太好了。我需要出示什麼才能拿回來嗎？"}, {"s": "A", "en": "Yes, you'll need to show your ID, and tell me what's inside the bag.", "zh": "需要，你需要出示證件，並告訴我包包裡面有什麼。"}, {"s": "B", "en": "Here is my passport. Inside, there's a laptop, a water bottle, a notebook, and a wallet.", "zh": "這是我的護照。裡面有一台筆電、一個水壺、一本筆記本和一個錢包。"}, {"s": "A", "en": "Great. That matches. Here is your bag. Please check that everything is there.", "zh": "很好。內容吻合。這是你的包包。請確認所有東西都在。"}, {"s": "B", "en": "Everything is here. The laptop, the wallet, even the cash. Thank you so much!", "zh": "全部都在。筆電、錢包，連現金都在。非常謝謝你！"}, {"s": "A", "en": "You're welcome. Please sign here to confirm that you received it.", "zh": "不客氣。請在這裡簽名，確認你已領取。"}, {"s": "B", "en": "Of course. Is there a fee for this service?", "zh": "當然。這項服務需要收費嗎？"}, {"s": "A", "en": "No, it's free. But next time, please keep your bag on your lap, or use the luggage rack.", "zh": "不用，是免費的。但下次請把包包放在腿上，或使用行李架。"}, {"s": "B", "en": "I will. I learned my lesson. Thank you again for your help.", "zh": "我會的。我學到教訓了。再次謝謝你的幫忙。"}, {"s": "A", "en": "My pleasure. Have a nice day!", "zh": "這是我的榮幸。祝你有美好的一天！"}]},
  {"id": "post", "icon": "📮", "title": "郵局寄包裹", "en": "Sending a Package at the Post Office", "roles": {"A": "Clerk 郵局人員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hello, I'd like to send this package to Japan.", "zh": "你好，我想把這個包裹寄到日本。", "h": "1. 檢查包裹"}, {"s": "A", "en": "Sure. Please put it on the scale.", "zh": "好的。請把它放在秤上。"}, {"s": "B", "en": "Here you go.", "zh": "給你。"}, {"s": "A", "en": "It weighs two point five kilograms. What's inside?", "zh": "重二點五公斤。裡面是什麼？"}, {"s": "B", "en": "It's a gift for my friend. There are some books, a sweater, and a box of tea.", "zh": "是給我朋友的禮物。裡面有幾本書、一件毛衣和一盒茶。"}, {"s": "A", "en": "Do you have any liquids, batteries, or perishable food in the package?", "zh": "包裹裡有沒有液體、電池或易腐食品？"}, {"s": "B", "en": "No, but the tea is sealed in a package. Is that okay?", "zh": "沒有，但茶葉是密封包裝的。這樣可以嗎？"}, {"s": "A", "en": "Yes, sealed tea is fine.", "zh": "可以，密封的茶葉沒問題。"}, {"s": "B", "en": "How long will it take to arrive?", "zh": "大概多久會寄到？", "h": "2. 選擇寄送方式"}, {"s": "A", "en": "By air mail, it takes about five to seven days.", "zh": "航空郵件大約需要五到七天。"}, {"s": "B", "en": "Is there a faster option?", "zh": "有比較快的方式嗎？"}, {"s": "A", "en": "Express service takes two to three days, but it costs more.", "zh": "快遞服務兩到三天就到，但費用比較高。"}, {"s": "B", "en": "How much is the difference?", "zh": "價差是多少？"}, {"s": "A", "en": "Air mail is thirty-two dollars, and express is fifty-five dollars.", "zh": "航空郵件是三十二元，快遞是五十五元。"}, {"s": "B", "en": "Hmm. My friend's birthday is next Monday, so I'll take the express service.", "zh": "嗯。我朋友的生日是下週一，所以我要用快遞。"}, {"s": "A", "en": "Good idea. Would you like insurance for the package?", "zh": "好主意。您要幫包裹保險嗎？"}, {"s": "B", "en": "What does insurance cover?", "zh": "保險涵蓋什麼？"}, {"s": "A", "en": "If the package is lost or damaged, you'll get your money back, up to one hundred dollars.", "zh": "如果包裹遺失或損壞，您可以拿回費用，最高一百元。"}, {"s": "B", "en": "It's only five dollars more, so yes, please.", "zh": "才多五元，所以好，麻煩你。"}, {"s": "B", "en": "Will my friend have to pay any customs fees?", "zh": "我朋友需要付任何關稅嗎？"}, {"s": "A", "en": "It depends on the value. Gifts under one hundred dollars are usually free of duty.", "zh": "要看價值。一百元以下的禮物通常免關稅。"}, {"s": "B", "en": "That's a relief. Can I put a birthday card inside the box?", "zh": "那就放心了。我可以在箱子裡放一張生日卡片嗎？"}, {"s": "A", "en": "Yes, you can. Just make sure the box is closed securely.", "zh": "可以。只要確保箱子封得牢固就好。"}, {"s": "A", "en": "Please fill out this customs form. You'll need to write the contents and the value.", "zh": "請填寫這張海關表格。您需要寫下內容物和價值。", "h": "3. 填表與付款"}, {"s": "B", "en": "Okay. Should I write the value of each item separately?", "zh": "好的。我需要分別寫每個物品的價值嗎？"}, {"s": "A", "en": "Yes, please. And write the recipient's full address in English or Japanese.", "zh": "是的，麻煩您。另外請用英文或日文寫收件人的完整地址。"}, {"s": "B", "en": "Let me see. Is this correct?", "zh": "我看看。這樣對嗎？"}, {"s": "A", "en": "Almost. You forgot to write the postal code here.", "zh": "差不多。您這裡忘了寫郵遞區號。"}, {"s": "B", "en": "Oh, thanks for pointing that out.", "zh": "哦，謝謝你提醒。"}, {"s": "A", "en": "Your total is sixty dollars, including insurance.", "zh": "您的總額是六十元，包含保險。"}, {"s": "B", "en": "Can I pay by credit card?", "zh": "我可以刷信用卡嗎？"}, {"s": "A", "en": "Yes. Please insert your card here.", "zh": "可以。請把卡片插入這裡。"}, {"s": "A", "en": "Here's your receipt. The tracking number is at the bottom.", "zh": "這是您的收據。追蹤號碼在下面。", "h": "4. 追蹤與買郵票"}, {"s": "B", "en": "Can I track the package online?", "zh": "我可以在網路上追蹤包裹嗎？"}, {"s": "A", "en": "Yes, just enter the number on our website.", "zh": "可以，只要在我們的網站輸入號碼就可以。"}, {"s": "B", "en": "Great. I also need to buy some stamps for postcards.", "zh": "太好了。我還需要買一些明信片用的郵票。"}, {"s": "A", "en": "How many would you like, and where are you sending them?", "zh": "您想要幾張，要寄到哪裡？"}, {"s": "B", "en": "Five stamps for international postcards, please.", "zh": "請給我五張國際明信片的郵票。"}, {"s": "A", "en": "That's two dollars each, so ten dollars.", "zh": "一張兩元，所以是十元。"}, {"s": "B", "en": "Here you go. Is there a mailbox nearby where I can drop them off?", "zh": "給你。附近有郵筒可以讓我投遞嗎？"}, {"s": "A", "en": "Yes, there's one right outside the front door. The last pickup today is at five o'clock.", "zh": "有，大門外就有一個。今天最後一次收信是五點。"}, {"s": "B", "en": "Perfect. Thank you for your help.", "zh": "太好了。謝謝你的幫忙。"}, {"s": "A", "en": "You're welcome. I hope your friend enjoys the gift!", "zh": "不客氣。希望你朋友喜歡這份禮物！"}]},
  {"id": "fastfood", "icon": "🍔", "title": "速食店點餐", "en": "Ordering at a Fast-Food Restaurant", "roles": {"A": "Cashier 收銀員", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi, welcome to Burger Barn! What can I get for you today?", "zh": "嗨，歡迎光臨漢堡穀倉！今天想吃點什麼？", "h": "1. 點套餐"}, {"s": "B", "en": "Hi. I'll have a cheeseburger combo, please.", "zh": "嗨。我要一份起司漢堡套餐。"}, {"s": "A", "en": "Would you like to make it a large combo for one dollar more?", "zh": "要不要多加一元升級成大份套餐？"}, {"s": "B", "en": "No, regular size is fine, thanks.", "zh": "不用，一般大小就可以，謝謝。"}, {"s": "A", "en": "Okay. What would you like for your side: fries, onion rings, or a salad?", "zh": "好的。配餐您要什麼：薯條、洋蔥圈還是沙拉？"}, {"s": "B", "en": "Fries, please.", "zh": "薯條，麻煩你。"}, {"s": "A", "en": "And what would you like to drink?", "zh": "那飲料要什麼？"}, {"s": "B", "en": "A medium Coke, please. Could I get no ice?", "zh": "中杯可樂。可以不要冰塊嗎？"}, {"s": "A", "en": "Sure. No ice.", "zh": "好的，不加冰。"}, {"s": "B", "en": "Can I also add a six-piece order of chicken nuggets?", "zh": "我可以再加點一份六塊雞塊嗎？", "h": "2. 加點與確認"}, {"s": "A", "en": "Of course. What kind of dipping sauce would you like? We have ketchup, barbecue, honey mustard, and ranch.", "zh": "當然。您想要什麼沾醬？我們有番茄醬、燒烤醬、蜂蜜芥末醬和田園醬。"}, {"s": "B", "en": "Barbecue and honey mustard, please.", "zh": "燒烤醬和蜂蜜芥末醬，麻煩你。"}, {"s": "A", "en": "Got it. Would you like to add a dessert? Our apple pie is hot and fresh.", "zh": "好的。要加點甜點嗎？我們的蘋果派剛出爐。"}, {"s": "B", "en": "That sounds good. One apple pie, please.", "zh": "聽起來不錯。一個蘋果派，麻煩你。"}, {"s": "A", "en": "Let me read your order back to you: one cheeseburger combo with fries and a medium Coke with no ice, six chicken nuggets with barbecue and honey mustard sauce, and one apple pie. Is that right?", "zh": "我複誦一下您的餐點：一份起司漢堡套餐，配薯條和不加冰的中杯可樂；六塊雞塊，附燒烤醬和蜂蜜芥末醬；還有一個蘋果派。對嗎？"}, {"s": "B", "en": "Yes, that's right. Oh, and can I have no pickles on the burger?", "zh": "對。哦，漢堡可以不要加酸黃瓜嗎？"}, {"s": "A", "en": "No problem. No pickles. Is that for here or to go?", "zh": "沒問題，不加酸黃瓜。請問內用還是外帶？"}, {"s": "B", "en": "For here, please.", "zh": "內用。"}, {"s": "A", "en": "Your total is twelve dollars and seventy-five cents.", "zh": "您的總額是十二元七角五分。", "h": "3. 付款與取餐"}, {"s": "B", "en": "Can I use this coupon? It's for a free apple pie.", "zh": "我可以用這張優惠券嗎？是免費蘋果派的。"}, {"s": "A", "en": "Let me check. Yes, it's valid. Then your new total is ten dollars and seventy-five cents.", "zh": "我看看。有效。那您的新總額是十元七角五分。"}, {"s": "B", "en": "Great. I'll pay by card.", "zh": "太好了。我刷卡。"}, {"s": "A", "en": "Please tap or insert your card.", "zh": "請感應或插入您的卡片。"}, {"s": "B", "en": "Done.", "zh": "好了。"}, {"s": "A", "en": "Here's your receipt and your number. It's forty-two. Please take a seat, and we'll call your number when your order is ready.", "zh": "這是您的收據和號碼。是四十二號。請先入座，餐點好了我們會叫您的號碼。"}, {"s": "B", "en": "Where can I find the napkins and ketchup?", "zh": "餐巾紙和番茄醬在哪裡？"}, {"s": "A", "en": "They're on the counter over there, next to the drink machine.", "zh": "在那邊的櫃台，飲料機旁邊。"}, {"s": "A", "en": "Number forty-two! Your order is ready.", "zh": "四十二號！您的餐點好了。", "h": "4. 餐點少了東西"}, {"s": "B", "en": "Thank you. Excuse me, I think something is missing. I don't see the fries.", "zh": "謝謝。不好意思，我覺得少了東西。我沒看到薯條。"}, {"s": "A", "en": "Oh, I'm sorry about that. Let me check the bag. You're right. I'll get you a fresh order of fries right away.", "zh": "哦，很抱歉。我檢查一下袋子。您說得對。我馬上為您拿一份新鮮的薯條。"}, {"s": "B", "en": "Thank you. And could I get a refill on my drink?", "zh": "謝謝。另外我的飲料可以續杯嗎？"}, {"s": "A", "en": "Sure. Our drinks have free refills.", "zh": "當然。我們的飲料可以免費續杯。"}, {"s": "B", "en": "That's great.", "zh": "太好了。"}, {"s": "A", "en": "Here are your fries. Sorry again for the mix-up.", "zh": "這是您的薯條。再次為弄錯抱歉。"}, {"s": "B", "en": "No worries. Everything looks great. Thanks!", "zh": "沒關係。一切看起來都很棒。謝謝！"}, {"s": "A", "en": "Enjoy your meal!", "zh": "請慢用！"}, {"s": "B", "en": "Excuse me, do you have a restroom I can use?", "zh": "不好意思，你們有洗手間可以借用嗎？", "h": "5. 其他小問題"}, {"s": "A", "en": "Yes, it's at the back, past the drink machine. The code is on your receipt.", "zh": "有，在後面，經過飲料機再往前。密碼印在您的收據上。"}, {"s": "B", "en": "Thank you. Also, could I get a few extra napkins and a bag for the leftovers?", "zh": "謝謝。另外可以多給我幾張餐巾紙和一個袋子裝剩下的餐點嗎？"}, {"s": "A", "en": "Of course. Here you go.", "zh": "當然。給您。"}, {"s": "B", "en": "Thanks. Have a great evening!", "zh": "謝謝。祝你有個美好的夜晚！"}]},
  {"id": "delivery", "icon": "🍕", "title": "電話訂外送", "en": "Ordering Delivery by Phone", "roles": {"A": "Staff 店員與外送員", "B": "You 你"}, "lines": [{"s": "A", "en": "Pizza Palace, how can I help you?", "zh": "披薩宮殿，有什麼可以為您服務的嗎？", "h": "1. 選披薩"}, {"s": "B", "en": "Hi, I'd like to order a large pizza for delivery.", "zh": "嗨，我想訂一個大披薩外送。"}, {"s": "A", "en": "Sure. Would you like one of our specialty pizzas, or would you like to build your own?", "zh": "好的。您要我們的招牌披薩，還是要自己搭配？"}, {"s": "B", "en": "What are your specialty pizzas?", "zh": "你們的招牌披薩有哪些？"}, {"s": "A", "en": "We have the Supreme, with pepperoni, sausage, peppers, and onions; the Hawaiian, with ham and pineapple; and the Veggie, with mushrooms, olives, and tomatoes.", "zh": "我們有豪華披薩，配料有臘腸、香腸、青椒和洋蔥；夏威夷披薩，有火腿和鳳梨；還有蔬菜披薩，有蘑菇、橄欖和番茄。"}, {"s": "B", "en": "I think I'll build my own.", "zh": "我想自己搭配。"}, {"s": "A", "en": "Okay. What kind of crust would you like: thin, regular, or deep dish?", "zh": "好的。餅皮您要哪種：薄皮、一般還是厚皮？"}, {"s": "B", "en": "Regular, please.", "zh": "一般的，麻煩你。"}, {"s": "A", "en": "And what toppings would you like?", "zh": "配料您想加什麼？"}, {"s": "B", "en": "Pepperoni and mushrooms, please. And could you put extra cheese on it?", "zh": "請加義式臘腸和蘑菇。可以多加起司嗎？"}, {"s": "A", "en": "Of course. Extra cheese is two dollars more.", "zh": "當然。多加起司要多兩元。"}, {"s": "B", "en": "That's fine. Do you have any sides?", "zh": "沒問題。你們有附餐嗎？", "h": "2. 附餐與飲料"}, {"s": "A", "en": "We have garlic bread, chicken wings, and salads.", "zh": "我們有蒜香麵包、雞翅和沙拉。"}, {"s": "B", "en": "I'll take an order of garlic bread and ten chicken wings.", "zh": "我要一份蒜香麵包和十隻雞翅。"}, {"s": "A", "en": "What flavor would you like for the wings: mild, hot, or barbecue?", "zh": "雞翅要什麼口味：微辣、辣還是燒烤？"}, {"s": "B", "en": "Barbecue, please.", "zh": "燒烤口味。"}, {"s": "A", "en": "Would you like anything to drink?", "zh": "您需要飲料嗎？"}, {"s": "B", "en": "A two-liter bottle of Sprite, please.", "zh": "請給我一瓶兩公升的雪碧。"}, {"s": "A", "en": "Great. Let me repeat your order: one large regular-crust pizza with pepperoni, mushrooms, and extra cheese; one garlic bread; ten barbecue wings; and a two-liter Sprite. Is that correct?", "zh": "好的。我複誦一下：一個大的一般餅皮披薩，加臘腸、蘑菇和額外起司；一份蒜香麵包；十隻燒烤雞翅；還有一瓶兩公升雪碧。對嗎？"}, {"s": "B", "en": "Yes, that's perfect.", "zh": "對，沒錯。"}, {"s": "A", "en": "Can I have your address, please?", "zh": "可以給我您的地址嗎？", "h": "3. 地址與付款"}, {"s": "B", "en": "It's twenty-five Maple Street, apartment three B.", "zh": "是楓樹街二十五號，3B 室。"}, {"s": "A", "en": "And is there a cross street nearby?", "zh": "附近有交叉路口嗎？"}, {"s": "B", "en": "Yes, it's near the corner of Maple Street and Second Avenue.", "zh": "有，就在楓樹街和第二大道的轉角附近。"}, {"s": "A", "en": "Got it. May I have a phone number in case the driver needs to call you?", "zh": "好的。可以給我電話號碼嗎？外送員可能需要聯絡您。"}, {"s": "B", "en": "Sure. It's five five five, one two three four.", "zh": "好的。是 555-1234。"}, {"s": "A", "en": "Thank you. Your total is thirty-four dollars and fifty cents, including delivery.", "zh": "謝謝。您的總額是三十四元五角，包含外送費。"}, {"s": "B", "en": "Can I pay in cash when it arrives?", "zh": "送到時我可以付現金嗎？"}, {"s": "A", "en": "Yes, you can pay the driver with cash or card.", "zh": "可以，您可以向外送員付現金或刷卡。"}, {"s": "B", "en": "Great. How long will it take?", "zh": "太好了。要多久才會送到？"}, {"s": "A", "en": "It should arrive in about thirty to forty minutes.", "zh": "大約三十到四十分鐘會到。"}, {"s": "B", "en": "Hi, I ordered a pizza about fifty minutes ago, and it hasn't arrived yet.", "zh": "嗨，我大約五十分鐘前訂了披薩，但還沒送到。", "h": "4. 催單與收貨"}, {"s": "A", "en": "I'm so sorry for the wait. Let me check your order. What's your name?", "zh": "很抱歉讓您久等。我查一下您的訂單。請問您的名字？"}, {"s": "B", "en": "It's under Chen.", "zh": "是陳。"}, {"s": "A", "en": "I see. The driver is just around the corner. He'll be there in about three minutes.", "zh": "我看到了。外送員就在轉角。大約三分鐘後會到。"}, {"s": "B", "en": "Okay, thank you.", "zh": "好的，謝謝。"}, {"s": "A", "en": "Since it was late, we'll give you a ten percent discount on your next order.", "zh": "因為晚到了，我們會在您下一次訂餐時給您九折優惠。"}, {"s": "B", "en": "That's very kind of you.", "zh": "你們真貼心。"}, {"s": "A", "en": "Hello! Here's your pizza. The total is thirty-four dollars and fifty cents.", "zh": "您好！這是您的披薩。總共是三十四元五角。"}, {"s": "B", "en": "Here you go. Keep the change.", "zh": "給你。不用找了。"}, {"s": "A", "en": "Thank you very much! Enjoy your meal!", "zh": "非常謝謝您！請慢用！"}, {"s": "B", "en": "Thanks. Have a good night!", "zh": "謝謝。晚安！"}]},
  {"id": "complaint", "icon": "😕", "title": "餐點有問題", "en": "A Problem with My Order", "roles": {"A": "Waiter 服務生", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, I'm sorry to bother you, but this isn't what I ordered.", "zh": "不好意思，抱歉打擾你，但這不是我點的。", "h": "1. 上錯餐點"}, {"s": "A", "en": "I'm so sorry. What did you order?", "zh": "真抱歉。您點的是什麼？"}, {"s": "B", "en": "I ordered the grilled fish with vegetables, but this is a steak.", "zh": "我點的是烤魚配蔬菜，但這是牛排。"}, {"s": "A", "en": "Let me check the order. You're right, it says grilled fish. I apologize for the mistake.", "zh": "我確認一下訂單。您說得對，上面寫的是烤魚。為這個錯誤向您道歉。"}, {"s": "B", "en": "It's okay. Mistakes happen. Could you bring the right dish, please?", "zh": "沒關係。難免會有錯誤。可以請你送上正確的餐點嗎？"}, {"s": "A", "en": "Of course. I'll go to the kitchen right now, and I'll ask them to prepare it as quickly as possible.", "zh": "當然。我現在就去廚房，請他們盡快準備。"}, {"s": "B", "en": "How long will it take?", "zh": "要等多久？"}, {"s": "A", "en": "About ten minutes. In the meantime, may I bring you some bread and a drink on the house?", "zh": "大約十分鐘。這段時間，我可以送一些麵包和飲料給您，由我們請客嗎？"}, {"s": "B", "en": "That would be nice, thank you. A glass of water, please.", "zh": "那很好，謝謝。請給我一杯水。"}, {"s": "A", "en": "Here's your water and some bread. Is the soup okay?", "zh": "這是您的水和一些麵包。湯還可以嗎？", "h": "2. 湯太冷、等太久"}, {"s": "B", "en": "Actually, the soup is cold. I ordered it half an hour ago, and I think it was sitting in the kitchen for a while.", "zh": "其實湯是冷的。我半小時前點的，我想它在廚房放了一段時間。"}, {"s": "A", "en": "I'm very sorry about that. Let me take it back and bring you a hot bowl.", "zh": "非常抱歉。我把它拿回去，為您換一碗熱的。"}, {"s": "B", "en": "Thank you. Also, my friend's order still hasn't arrived. We've been waiting for forty minutes.", "zh": "謝謝。另外，我朋友點的餐還沒送到。我們已經等了四十分鐘。"}, {"s": "A", "en": "Forty minutes is far too long. I'll check on it right away.", "zh": "四十分鐘太久了。我馬上去確認。"}, {"s": "B", "en": "He ordered the pasta with seafood. He's getting hungry.", "zh": "他點的是海鮮義大利麵。他快餓了。"}, {"s": "A", "en": "I understand. Let me speak to the chef, and I'll be back in two minutes.", "zh": "我了解。我去和主廚談談，兩分鐘後回來。"}, {"s": "A", "en": "I'm sorry for the long wait. The pasta will be ready in three minutes, and your fish is coming out now.", "zh": "很抱歉讓您久等。義大利麵三分鐘後就好，您的魚現在就出來了。"}, {"s": "B", "en": "Thank you for checking.", "zh": "謝謝你幫忙確認。"}, {"s": "A", "en": "Our manager would also like to speak with you. May I bring her over?", "zh": "我們經理也想跟您談一談。我可以請她過來嗎？", "h": "3. 經理出面處理"}, {"s": "B", "en": "Sure, that's fine.", "zh": "好的，可以。"}, {"s": "A", "en": "Hello, I'm Ms. Carter, the manager. I'm very sorry about the problems with your order tonight.", "zh": "您好，我是經理卡特女士。對於今晚您點餐所發生的問題，我非常抱歉。"}, {"s": "B", "en": "Thank you. It's been a bit of a difficult evening, but your waiter has been very helpful.", "zh": "謝謝。今晚有點不順，但你們的服務生很幫忙。"}, {"s": "A", "en": "I'm glad to hear he helped. We were short on staff tonight, but that's no excuse.", "zh": "很高興聽到他有幫上忙。我們今晚人手不足，但那並不是藉口。"}, {"s": "B", "en": "I understand. Restaurants get busy.", "zh": "我了解。餐廳有時候會很忙。"}, {"s": "A", "en": "To make it up to you, I'd like to offer you a free dessert for each of you, and a twenty percent discount on your bill.", "zh": "為了彌補您，我想請你們每人一份免費甜點，並且帳單打八折。"}, {"s": "B", "en": "That's very generous of you. Thank you.", "zh": "你們真慷慨。謝謝。"}, {"s": "A", "en": "It's the least we can do. Please let me know if there's anything else.", "zh": "這是我們至少該做的。如果還有什麼需要，請告訴我。"}, {"s": "B", "en": "Everything is fine now. The fish is delicious.", "zh": "現在一切都很好。魚很好吃。"}, {"s": "A", "en": "I'm so glad. Enjoy the rest of your meal.", "zh": "我很高興。請享用剩下的餐點。"}, {"s": "B", "en": "Excuse me, could we have the bill, please?", "zh": "不好意思，可以麻煩結帳嗎？", "h": "4. 結帳"}, {"s": "A", "en": "Of course. Here is your bill. The discount has already been applied.", "zh": "當然。這是您的帳單。折扣已經算進去了。"}, {"s": "B", "en": "Let me see. The total is forty-eight dollars. That's very reasonable.", "zh": "我看看。總共四十八元。很合理。"}, {"s": "A", "en": "Would you like to pay by card or cash?", "zh": "您要刷卡還是付現？"}, {"s": "B", "en": "By card, please. And could you add a tip for the waiter? He worked very hard.", "zh": "刷卡。可以幫我加一些小費給服務生嗎？他很努力。"}, {"s": "A", "en": "That's very kind. How much would you like to add?", "zh": "您真貼心。您想加多少？"}, {"s": "B", "en": "Ten dollars, please.", "zh": "十元，麻煩你。"}, {"s": "A", "en": "Thank you very much. Here's your receipt. We hope to see you again soon.", "zh": "非常感謝。這是您的收據。希望很快再見到您。"}, {"s": "B", "en": "We'll come back. Thanks for handling everything so well.", "zh": "我們會再來。謝謝你把一切處理得這麼好。"}]},
  {"id": "repair", "icon": "📱", "title": "修手機", "en": "Repairing a Phone", "roles": {"A": "Technician 維修人員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, my phone screen is cracked, and the battery drains very quickly. Can you fix it?", "zh": "嗨，我的手機螢幕裂了，電池也耗電很快。你可以修嗎？", "h": "1. 說明問題"}, {"s": "A", "en": "Sure. Let me take a look. What happened to the screen?", "zh": "當然。我看一下。螢幕發生了什麼事？"}, {"s": "B", "en": "I dropped it on the sidewalk last week. The glass broke, but the touch screen still works.", "zh": "我上週把它掉在人行道上。玻璃破了，但觸控螢幕還能用。"}, {"s": "A", "en": "Okay. And how long has the battery been draining fast?", "zh": "好的。電池耗電很快多久了？"}, {"s": "B", "en": "For about three months. By afternoon, it's usually below twenty percent.", "zh": "大約三個月了。到下午通常就低於百分之二十。"}, {"s": "A", "en": "How old is the phone?", "zh": "手機用多久了？"}, {"s": "B", "en": "I bought it about two and a half years ago.", "zh": "我大約兩年半前買的。"}, {"s": "A", "en": "That makes sense. Batteries usually lose capacity after two or three years. Let me run a test.", "zh": "這樣就說得通了。電池通常用兩三年後容量會下降。我來跑個測試。", "h": "2. 檢查與報價"}, {"s": "B", "en": "Okay. How long will it take?", "zh": "好的。要多久？"}, {"s": "A", "en": "About five minutes. Please have a seat.", "zh": "大約五分鐘。請坐。"}, {"s": "A", "en": "The test is finished. The screen needs to be replaced, and the battery is at sixty-eight percent of its original capacity.", "zh": "測試完成了。螢幕需要更換，電池只剩原本容量的百分之六十八。"}, {"s": "B", "en": "Is that bad?", "zh": "這樣很糟嗎？"}, {"s": "A", "en": "It's not terrible, but I'd recommend replacing it, since you're already opening the phone.", "zh": "還不算太糟，但既然您已經要拆開手機了，我建議一起換掉。"}, {"s": "B", "en": "How much will it cost to replace the screen?", "zh": "換螢幕要多少錢？"}, {"s": "A", "en": "The screen is one hundred twenty dollars, and the battery is forty dollars. If you do both, I can give you ten dollars off.", "zh": "螢幕一百二十元，電池四十元。如果兩個都換，我可以算您便宜十元。"}, {"s": "B", "en": "So one hundred fifty dollars in total. How long will it take?", "zh": "所以總共一百五十元。要多久？"}, {"s": "A", "en": "About two hours. The parts are in stock, so you can wait here, or come back this afternoon.", "zh": "大約兩小時。零件有庫存，您可以在這裡等，或下午再來取。"}, {"s": "B", "en": "Are the parts original or from another company?", "zh": "零件是原廠的還是其他廠牌的？", "h": "3. 決定維修與資料備份"}, {"s": "A", "en": "We offer both. The original parts are more expensive, and the other ones cost about thirty percent less, but they also have a warranty.", "zh": "兩種都有。原廠零件比較貴，其他廠牌的大約便宜三成，但也有保固。"}, {"s": "B", "en": "I'll go with the original parts, to be safe.", "zh": "我選原廠零件，比較保險。"}, {"s": "A", "en": "Then the total will be one hundred ninety dollars. Is that okay?", "zh": "那總額會是一百九十元。可以嗎？"}, {"s": "B", "en": "Yes, that's fine. Will I lose my data? I have a lot of photos on my phone.", "zh": "可以。我的資料會不見嗎？我手機裡有很多照片。"}, {"s": "A", "en": "Normally not, but there's always a small risk. I recommend that you back up your photos before the repair.", "zh": "通常不會，但總是有一點風險。我建議您在維修前先備份照片。"}, {"s": "B", "en": "I backed up my photos last night, but not the messages from today.", "zh": "我昨晚備份過照片了，但今天的訊息沒有備份。"}, {"s": "A", "en": "That should be fine. Please also turn off the find-my-phone feature, and tell me your passcode.", "zh": "那應該沒問題。請也關閉尋找手機功能，並告訴我您的解鎖密碼。"}, {"s": "B", "en": "Okay. Is it safe to give you my passcode?", "zh": "好的。把密碼給你安全嗎？"}, {"s": "A", "en": "Yes. We only use it to test the phone after the repair, and we don't look at your personal information.", "zh": "安全。我們只在修好後用來測試手機，不會查看您的個人資料。"}, {"s": "B", "en": "All right. I've turned that off, and my passcode is on this paper.", "zh": "好的。我已經關掉了，密碼寫在這張紙上。"}, {"s": "A", "en": "Thank you. Please sign this repair form. I'll call you when it's ready.", "zh": "謝謝。請簽這張維修單。修好時我會打給您。"}, {"s": "A", "en": "Your phone is ready. Please come and take a look.", "zh": "您的手機修好了。請過來看看。", "h": "4. 取機與保固"}, {"s": "B", "en": "That was fast. The screen looks like new!", "zh": "好快。螢幕看起來像新的一樣！"}, {"s": "A", "en": "I also cleaned the charging port, because it was full of dust. Please test everything before you leave.", "zh": "我也清理了充電孔，因為裡面都是灰塵。請在離開前測試所有功能。"}, {"s": "B", "en": "The touch screen works well. The camera and the speakers are fine too.", "zh": "觸控螢幕運作正常。相機和喇叭也沒問題。"}, {"s": "A", "en": "The battery is at one hundred percent health now. It should last you all day.", "zh": "電池現在是百分之百的健康度。應該可以讓您用一整天。"}, {"s": "B", "en": "That's great. Is there a warranty on the repair?", "zh": "太好了。維修有保固嗎？"}, {"s": "A", "en": "Yes, we offer a ninety-day warranty on both the parts and the labor.", "zh": "有，零件和工資都有九十天保固。"}, {"s": "B", "en": "Good to know. Should I buy a screen protector and a case?", "zh": "知道了。我應該買螢幕保護貼和保護殼嗎？"}, {"s": "A", "en": "I'd recommend it. A tempered glass protector costs fifteen dollars, and I can put it on for free.", "zh": "我建議買。鋼化玻璃保護貼十五元，我可以免費幫您貼。"}, {"s": "B", "en": "Yes, please. Thank you so much for your help.", "zh": "好的，麻煩你。非常謝謝你的協助。"}, {"s": "A", "en": "You're welcome. Take care of your phone!", "zh": "不客氣。請好好愛護您的手機！"}]},
  {"id": "laundry", "icon": "👕", "title": "洗衣店", "en": "At the Dry Cleaner's", "roles": {"A": "Attendant 店員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, I need to get some clothes cleaned.", "zh": "嗨，我需要洗一些衣服。", "h": "1. 送洗衣物"}, {"s": "A", "en": "Welcome. Let me take a look. What do you have today?", "zh": "歡迎。我看看。您今天帶了什麼來？"}, {"s": "B", "en": "I have three shirts, two pairs of pants, and a jacket.", "zh": "我有三件襯衫、兩條褲子和一件外套。"}, {"s": "A", "en": "Do you want them washed and folded, or dry cleaned?", "zh": "要水洗摺好，還是乾洗？"}, {"s": "B", "en": "The shirts and pants can be washed, but the jacket should be dry cleaned.", "zh": "襯衫和褲子可以水洗，但外套要乾洗。"}, {"s": "A", "en": "Let me check the tags. Yes, this wool jacket should be dry cleaned only.", "zh": "我看一下標籤。對，這件羊毛外套只能乾洗。"}, {"s": "B", "en": "Right. Also, could you iron the shirts?", "zh": "對。另外可以幫我燙襯衫嗎？"}, {"s": "A", "en": "Sure. Ironing is two dollars per shirt.", "zh": "當然。燙襯衫一件兩元。"}, {"s": "A", "en": "I see a stain on the sleeve of this jacket. Do you know what it is?", "zh": "我看到這件外套袖子上有污漬。你知道是什麼嗎？", "h": "2. 污漬與修補"}, {"s": "B", "en": "It's coffee. I spilled it last week.", "zh": "是咖啡。我上週打翻的。"}, {"s": "A", "en": "Okay. Coffee stains can be difficult after a week, but we'll try our best.", "zh": "好的。咖啡漬放了一週可能比較難處理，但我們會盡力。"}, {"s": "B", "en": "Thank you. Is there any chance it won't come out?", "zh": "謝謝。有沒有可能洗不掉？"}, {"s": "A", "en": "There's a small chance. If it doesn't come out, we'll let you know before we charge you.", "zh": "有一點可能性。如果洗不掉，我們會在收費前通知您。"}, {"s": "B", "en": "That sounds fair. And there's a button missing on one of the shirts. Can you fix it?", "zh": "聽起來很公平。另外有一件襯衫掉了一顆釦子。你們可以修嗎？"}, {"s": "A", "en": "Yes, we offer a repair service. Sewing on a button costs one dollar.", "zh": "可以，我們有修補服務。縫一顆釦子一元。"}, {"s": "B", "en": "Great. Please do that.", "zh": "太好了。麻煩你縫。"}, {"s": "B", "en": "When will everything be ready?", "zh": "什麼時候可以拿？", "h": "3. 取衣時間與費用"}, {"s": "A", "en": "The washed clothes will be ready tomorrow afternoon. The jacket will take until Thursday.", "zh": "水洗的衣服明天下午可以拿。外套要到週四。"}, {"s": "B", "en": "Do you offer same-day service? I might need the shirts sooner.", "zh": "你們有當日取件服務嗎？我可能比較早需要那些襯衫。"}, {"s": "A", "en": "Yes, it costs five dollars extra if you drop them off before ten in the morning. But it's already afternoon, so it won't be ready until tomorrow.", "zh": "有，如果早上十點前送洗要加五元。但現在已經下午了，所以明天才會好。"}, {"s": "B", "en": "That's okay. I can wait until Thursday for everything.", "zh": "沒關係。我可以等到週四再一次全部拿。"}, {"s": "A", "en": "Of course. Here is your ticket. Please bring it with you when you pick up.", "zh": "當然。這是您的取衣單。取衣時請帶來。"}, {"s": "B", "en": "What are your opening hours?", "zh": "你們的營業時間是什麼時候？"}, {"s": "A", "en": "We're open from eight to six on weekdays and from nine to two on Saturdays. We're closed on Sundays.", "zh": "我們平日八點到六點營業，週六是九點到兩點。週日休息。"}, {"s": "B", "en": "How much is the total?", "zh": "總共多少錢？"}, {"s": "A", "en": "The washing is twelve dollars, the dry cleaning is eight dollars, ironing is six dollars, and the button repair is one dollar. That's twenty-seven dollars in total.", "zh": "水洗十二元，乾洗八元，燙衣六元，縫釦子一元。總共二十七元。"}, {"s": "B", "en": "Do I pay now or when I pick up?", "zh": "我現在付還是取衣時付？"}, {"s": "A", "en": "You can pay when you pick up.", "zh": "取衣時付款就可以。"}, {"s": "B", "en": "Hi, I'm here to pick up my clothes. Here's my ticket.", "zh": "嗨，我來取衣服。這是我的取衣單。", "h": "4. 取衣"}, {"s": "A", "en": "Thank you. Let me find it. Here you are. Everything is clean and pressed.", "zh": "謝謝。我找一下。在這裡。全部都洗乾淨也燙好了。"}, {"s": "B", "en": "Wow, the stain on the jacket is gone!", "zh": "哇，外套上的污漬不見了！"}, {"s": "A", "en": "Yes, we were able to remove it.", "zh": "是的，我們成功去除了。"}, {"s": "B", "en": "That's wonderful. Thank you so much.", "zh": "太好了。非常謝謝你。"}, {"s": "A", "en": "That will be twenty-seven dollars, please.", "zh": "請付二十七元。"}, {"s": "B", "en": "Here you go. Do you offer a delivery service?", "zh": "給你。你們有送衣服到府的服務嗎？"}, {"s": "A", "en": "Yes, it's free for orders over thirty dollars.", "zh": "有的，超過三十元的訂單免運費。"}, {"s": "B", "en": "Good to know. I'll use it next time. Thanks!", "zh": "知道了。我下次會用。謝謝！"}, {"s": "A", "en": "You're welcome. Have a nice day!", "zh": "不客氣。祝您有美好的一天！"}]},
  {"id": "checkout", "icon": "🧳", "title": "飯店退房", "en": "Hotel Check-out", "roles": {"A": "Receptionist 櫃台", "B": "You 你"}, "lines": [{"s": "B", "en": "Good morning. I'd like to check out of room eight-oh-seven, please.", "zh": "早安。我想辦理 807 號房的退房。", "h": "1. 辦理退房"}, {"s": "A", "en": "Good morning. Let me pull up your account. Did you enjoy your stay?", "zh": "早安。我調出您的帳戶。您住得愉快嗎？"}, {"s": "B", "en": "Yes, very much. The room was clean and comfortable, and the staff was very friendly.", "zh": "是的，非常愉快。房間乾淨舒適，員工也很友善。"}, {"s": "A", "en": "I'm glad to hear that. Did you use anything from the minibar during your stay?", "zh": "很高興聽到這件事。您住宿期間有使用小冰箱裡的東西嗎？"}, {"s": "B", "en": "Yes, I had two bottles of water and a bag of chips.", "zh": "有，我喝了兩瓶水，吃了一包洋芋片。"}, {"s": "A", "en": "Thank you. Did you also order any room service or use the laundry service?", "zh": "謝謝。您也有叫客房服務或使用洗衣服務嗎？"}, {"s": "B", "en": "I ordered breakfast once on the second morning, and I sent a few shirts to the laundry.", "zh": "第二天早上我叫過一次早餐，也送了幾件襯衫去洗。"}, {"s": "A", "en": "Okay. Here is your bill. Please check that everything is correct.", "zh": "好的。這是您的帳單。請確認所有項目是否正確。"}, {"s": "B", "en": "Let me see. There's a charge for a spa treatment, but I didn't use the spa.", "zh": "我看看。這裡有一筆水療的費用，但我沒有使用水療。", "h": "2. 帳單有誤"}, {"s": "A", "en": "I'm so sorry. Let me check. It looks like it was charged to the wrong room. I'll remove it right away.", "zh": "真抱歉。我查一下。看起來是記到錯的房間了。我馬上把它刪掉。"}, {"s": "B", "en": "Thank you. Also, I think the parking fee is too high. I only parked for two nights.", "zh": "謝謝。另外，我覺得停車費太高了。我只停了兩晚。"}, {"s": "A", "en": "You're right. It shows three nights. I'll correct that. The new total is four hundred twenty dollars.", "zh": "您說得對。這裡顯示三晚。我來更正。新的總額是四百二十元。"}, {"s": "B", "en": "That looks right. Does that include the city tax?", "zh": "這樣就對了。有包含城市稅嗎？"}, {"s": "A", "en": "Yes, tax and the service charge are both included.", "zh": "有，稅金和服務費都包含在內。"}, {"s": "B", "en": "Can I pay with a credit card? And could you send the receipt to my email?", "zh": "我可以刷信用卡嗎？可以把收據寄到我的電子信箱嗎？"}, {"s": "A", "en": "Of course. Please insert your card, and may I have your email address?", "zh": "當然。請插入您的卡片，可以給我您的電子信箱嗎？"}, {"s": "B", "en": "My flight leaves at eight tonight. Could I leave my luggage here until this afternoon?", "zh": "我的班機今晚八點起飛。我可以把行李寄放在這裡到下午嗎？", "h": "3. 寄放行李與機場接送"}, {"s": "A", "en": "Certainly. We can store it free of charge. I'll give you a tag.", "zh": "當然。我們可以免費保管。我給您一張行李牌。"}, {"s": "B", "en": "Thank you. Is there a shuttle bus to the airport?", "zh": "謝謝。有到機場的接駁車嗎？"}, {"s": "A", "en": "Yes, it runs every thirty minutes from the front entrance. Would you like me to reserve a seat?", "zh": "有，每三十分鐘一班，從正門出發。要我幫您預約座位嗎？"}, {"s": "B", "en": "Yes, please, for four o'clock.", "zh": "好的，麻煩你，四點那班。"}, {"s": "A", "en": "It's reserved. It's fifteen dollars per person, payable on the bus.", "zh": "訂好了。每人十五元，上車付款。"}, {"s": "B", "en": "What if I decide to take a taxi instead?", "zh": "如果我決定改搭計程車呢？"}, {"s": "A", "en": "I can call one for you. It costs about forty dollars and takes thirty-five minutes.", "zh": "我可以幫您叫。大約四十元，需要三十五分鐘。"}, {"s": "B", "en": "The shuttle is fine. Excuse me, I think I left my phone charger in the room.", "zh": "接駁車就好。不好意思，我想我把手機充電器忘在房間裡了。", "h": "4. 遺漏物品與離開"}, {"s": "A", "en": "Let me call housekeeping. One moment, please.", "zh": "我打給房務部。請稍等。"}, {"s": "A", "en": "Good news. They found it. We'll bring it down in a minute.", "zh": "好消息。他們找到了。我們一分鐘後就送下來。"}, {"s": "B", "en": "Wonderful. Thank you so much.", "zh": "太好了。非常謝謝你。"}, {"s": "A", "en": "Here's your charger. Please check that it's yours.", "zh": "這是您的充電器。請確認是不是您的。"}, {"s": "B", "en": "Yes, that's mine. I'd also like to leave a tip for the housekeeper.", "zh": "對，是我的。我也想留一些小費給房務人員。"}, {"s": "A", "en": "That's very kind. You can leave it in an envelope here, and I'll make sure she gets it.", "zh": "您真貼心。您可以放在這個信封裡，我會確保她收到。"}, {"s": "B", "en": "Thank you. Would it be possible to leave a review for the hotel?", "zh": "謝謝。我可以為飯店留下評價嗎？"}, {"s": "A", "en": "Of course. We have a card here, or you can write one online.", "zh": "當然。這裡有評價卡，或者您也可以在網路上寫。"}, {"s": "B", "en": "Thank you for everything. It was a great stay.", "zh": "謝謝你們的一切。這次住得很棒。"}, {"s": "A", "en": "We hope to see you again soon. Safe travels!", "zh": "希望很快再見到您。旅途平安！"}]},
  {"id": "customs", "icon": "🛃", "title": "入境海關", "en": "Going Through Customs", "roles": {"A": "Officer 海關人員", "B": "You 你"}, "lines": [{"s": "A", "en": "Next, please. Good afternoon. May I see your passport and your arrival card?", "zh": "下一位。午安。可以看一下您的護照和入境卡嗎？", "h": "1. 護照查驗"}, {"s": "B", "en": "Good afternoon. Here you are.", "zh": "午安。給你。"}, {"s": "A", "en": "Thank you. What is the purpose of your visit?", "zh": "謝謝。您來訪的目的是什麼？"}, {"s": "B", "en": "I'm here for a vacation. I'm going to travel around the country for two weeks.", "zh": "我來度假。我會在這個國家旅遊兩週。"}, {"s": "A", "en": "How long will you be staying in total?", "zh": "您總共會停留多久？"}, {"s": "B", "en": "Fourteen days. I leave on the twenty-fourth of this month.", "zh": "十四天。我這個月二十四號離開。"}, {"s": "A", "en": "Do you have a return ticket?", "zh": "您有回程機票嗎？"}, {"s": "B", "en": "Yes, I have it right here on my phone.", "zh": "有，就在我的手機裡。"}, {"s": "A", "en": "And where will you be staying?", "zh": "您會住在哪裡？"}, {"s": "B", "en": "I'll stay at a hotel downtown for the first four nights. After that, I'll travel to other cities.", "zh": "前四晚我會住在市中心的飯店。之後我會到其他城市旅遊。"}, {"s": "A", "en": "Do you have the hotel reservation with you?", "zh": "您有帶飯店訂房資料嗎？"}, {"s": "B", "en": "Yes, here is the confirmation.", "zh": "有，這是確認信。"}, {"s": "A", "en": "Please place your index fingers on the scanner. Then look at the camera.", "zh": "請把兩隻食指放在掃描器上。然後看鏡頭。", "h": "2. 指紋與拍照"}, {"s": "B", "en": "Like this?", "zh": "像這樣嗎？"}, {"s": "A", "en": "Yes, perfect. Could you please take off your glasses for the photo?", "zh": "對，很好。拍照時可以請您把眼鏡拿下來嗎？"}, {"s": "B", "en": "Sorry. Is this okay?", "zh": "抱歉。這樣可以嗎？"}, {"s": "A", "en": "That's fine. Thank you. Have you visited our country before?", "zh": "可以。謝謝。您以前來過我們國家嗎？"}, {"s": "B", "en": "No, this is my first time.", "zh": "沒有，這是第一次。"}, {"s": "A", "en": "Welcome. Do you have enough money for your stay?", "zh": "歡迎。您有足夠的錢支付這趟旅程嗎？"}, {"s": "B", "en": "Yes, I have some cash and a credit card.", "zh": "有，我有一些現金和一張信用卡。"}, {"s": "A", "en": "Will you be working or studying during your stay?", "zh": "您停留期間會工作或就學嗎？"}, {"s": "B", "en": "No, I'm only a tourist. I'm not planning to work here.", "zh": "不會，我只是觀光客。我不打算在這裡工作。"}, {"s": "A", "en": "Good. Are you traveling with anyone else?", "zh": "好的。您有和其他人一起旅行嗎？"}, {"s": "B", "en": "No, I'm traveling alone, but I'm meeting a friend in the capital next week.", "zh": "沒有，我一個人旅行，但下週會在首都和一位朋友見面。"}, {"s": "A", "en": "Okay, here is your passport. Enjoy your trip.", "zh": "好的，這是您的護照。祝您旅途愉快。"}, {"s": "B", "en": "Excuse me, where can I pick up my luggage? I came on flight BR twelve.", "zh": "不好意思，我要去哪裡領行李？我搭的是 BR12 班機。", "h": "3. 領行李與申報"}, {"s": "A", "en": "Baggage claim is downstairs. Your flight is on carousel five.", "zh": "行李提領區在樓下。您的班機在五號轉盤。"}, {"s": "B", "en": "Thank you.", "zh": "謝謝。"}, {"s": "A", "en": "Good afternoon. Do you have anything to declare?", "zh": "午安。您有任何要申報的物品嗎？"}, {"s": "B", "en": "No, I don't think so.", "zh": "沒有，我想沒有。"}, {"s": "A", "en": "Are you carrying any fresh fruit, meat, or plants?", "zh": "您有攜帶任何新鮮水果、肉類或植物嗎？"}, {"s": "B", "en": "I only have some packaged snacks: dried mango and a few cookies. Do I need to declare them?", "zh": "我只有一些包裝好的零食：芒果乾和幾片餅乾。我需要申報嗎？"}, {"s": "A", "en": "Sealed, packaged snacks are fine. Are you carrying more than ten thousand dollars in cash?", "zh": "密封包裝的零食沒問題。您攜帶的現金有超過一萬元嗎？"}, {"s": "B", "en": "No, I only have about five hundred dollars.", "zh": "沒有，我只有大約五百元。"}, {"s": "A", "en": "Please place your suitcase on the table and open it.", "zh": "請把行李箱放在桌上並打開。"}, {"s": "B", "en": "Of course.", "zh": "當然。"}, {"s": "A", "en": "What is this?", "zh": "這是什麼？"}, {"s": "B", "en": "It's cold medicine. I bought it at a pharmacy at home.", "zh": "是感冒藥。我在家鄉的藥局買的。"}, {"s": "A", "en": "That's fine. Everything looks good. You may close your bag.", "zh": "沒問題。一切看起來都很好。您可以把行李箱關起來了。", "h": "4. 離開機場"}, {"s": "B", "en": "Thank you. Where can I exchange money?", "zh": "謝謝。我要去哪裡換錢？"}, {"s": "A", "en": "There's an exchange counter near exit B.", "zh": "B 出口附近有一個換匯櫃台。"}, {"s": "B", "en": "And where is the taxi stand?", "zh": "那計程車招呼站在哪裡？"}, {"s": "A", "en": "Outside exit A. If you want to take the train, follow the signs to the underground.", "zh": "在 A 出口外面。如果您想搭火車，請跟著指標往地下走。"}, {"s": "B", "en": "Thank you for your help.", "zh": "謝謝你的協助。"}, {"s": "A", "en": "You're welcome. Enjoy your stay!", "zh": "不客氣。祝您住得愉快！"}]},
  {"id": "trainticket", "icon": "🚆", "title": "買火車票", "en": "Buying a Train Ticket", "roles": {"A": "Ticket agent 售票員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hi, I'd like to buy two tickets to Boston, please.", "zh": "嗨，我想買兩張去波士頓的票。", "h": "1. 查詢班次與票價"}, {"s": "A", "en": "Sure. Is that one way or round trip?", "zh": "好的。是單程還是來回？"}, {"s": "B", "en": "Round trip. We're leaving tomorrow morning and coming back on Sunday evening.", "zh": "來回。我們明天早上出發，週日晚上回來。"}, {"s": "A", "en": "Let me check the schedule. For tomorrow morning, there's a train at seven forty, another at eight fifteen, and one at nine thirty.", "zh": "我查一下時刻表。明天早上有七點四十分、八點十五分和九點半的班次。"}, {"s": "B", "en": "What's the difference between them? Is one faster than the others?", "zh": "它們有什麼差別？有哪一班比較快嗎？"}, {"s": "A", "en": "The eight fifteen is an express train. It takes three hours. The other two take about four hours because they stop at more stations.", "zh": "八點十五分是特快車，要三個小時。另外兩班因為停靠比較多站，大約要四個小時。"}, {"s": "B", "en": "Then we'll take the express. How much are the tickets?", "zh": "那我們搭特快車。票價多少？"}, {"s": "A", "en": "The express is sixty dollars per person one way. The regular train is forty-five.", "zh": "特快車單程每人六十元。普通車是四十五元。"}, {"s": "B", "en": "That's a big difference. Is there a discount for round-trip tickets?", "zh": "差很多。來回票有折扣嗎？", "h": "2. 票種與座位"}, {"s": "A", "en": "Yes, a round-trip ticket on the express is one hundred ten dollars, so you save ten dollars.", "zh": "有，特快車的來回票是一百一十元，所以可以省十元。"}, {"s": "B", "en": "That's better. And are there any discounts for students? My friend is a student.", "zh": "那比較划算。學生有優惠嗎？我朋友是學生。"}, {"s": "A", "en": "Yes, students get fifteen percent off with a valid student ID. Does your friend have it with her?", "zh": "有，學生出示有效學生證可以打八五折。你朋友有帶在身上嗎？"}, {"s": "B", "en": "Yes, she does. Here it is.", "zh": "有，她有帶。在這裡。"}, {"s": "A", "en": "Thank you. Would you like seats next to each other?", "zh": "謝謝。你們想要坐在一起的座位嗎？"}, {"s": "B", "en": "Yes, please. And can we have a window seat? We'd like to enjoy the view.", "zh": "好的，麻煩你。而且可以給我們靠窗的位子嗎？我們想欣賞風景。"}, {"s": "A", "en": "Let me check. I have two seats together by the window in car five, seats twelve A and twelve B.", "zh": "我看一下。我有五號車廂靠窗的兩個連在一起的座位，12A 和 12B。"}, {"s": "B", "en": "That sounds perfect. Is it a quiet car?", "zh": "聽起來很完美。是安靜車廂嗎？"}, {"s": "A", "en": "No, but there's a quiet car in car one, if you prefer. Phones and loud talking are not allowed there.", "zh": "不是，但如果你們喜歡，一號車廂是安靜車廂。那裡不能講電話，也不能大聲說話。"}, {"s": "B", "en": "Car five is fine for us. Does the train have a dining car?", "zh": "五號車廂就可以了。火車上有餐車嗎？", "h": "3. 車上設施與月台"}, {"s": "A", "en": "Yes, it's in car seven. You can also bring your own food and drinks on board.", "zh": "有，在七號車廂。你們也可以自己帶食物和飲料上車。"}, {"s": "B", "en": "Good to know. Is there Wi-Fi on the train?", "zh": "知道了。火車上有 Wi-Fi 嗎？"}, {"s": "A", "en": "Yes, it's free, but the connection can be slow in tunnels.", "zh": "有，免費，但在隧道裡連線可能會很慢。"}, {"s": "B", "en": "Which platform does the train leave from?", "zh": "火車從哪個月台出發？"}, {"s": "A", "en": "It's platform six. The display board will confirm it about twenty minutes before departure.", "zh": "是六號月台。看板會在發車前大約二十分鐘確認。"}, {"s": "B", "en": "How early should we arrive at the station?", "zh": "我們應該提早多久到車站？"}, {"s": "A", "en": "I recommend arriving at least twenty minutes early, especially if you need to pick up your tickets.", "zh": "我建議至少提早二十分鐘到，尤其是如果你們需要取票。"}, {"s": "B", "en": "Do we need to print the tickets, or can we show them on the phone?", "zh": "我們需要印出車票，還是可以在手機上出示？"}, {"s": "A", "en": "You can use your phone. I'll send the e-tickets to your email right now. Could you give me your address?", "zh": "你們可以用手機。我現在就把電子車票寄到你的信箱。可以給我你的地址嗎？"}, {"s": "B", "en": "Sure. It's j-a-n-e, dot, l-i-n, at example dot com.", "zh": "好的。是 jane.lin@example.com。"}, {"s": "A", "en": "Got it. The total is two hundred nine dollars after the student discount. Cash or card?", "zh": "收到了。學生折扣後總共是兩百零九元。付現還是刷卡？", "h": "4. 付款與改票規定"}, {"s": "B", "en": "Card, please. By the way, what if we need to change the date of our return trip?", "zh": "刷卡。對了，如果我們需要更改回程的日期怎麼辦？"}, {"s": "A", "en": "You can change it online or at any ticket window, up to two hours before the train leaves. There's a ten-dollar fee for changes.", "zh": "你們可以在網路上或任何售票窗口更改，最晚在發車前兩小時。更改要收十元手續費。"}, {"s": "B", "en": "And if we miss the train?", "zh": "那如果我們錯過火車呢？"}, {"s": "A", "en": "You can take the next train with the same ticket, but only on the same day, and only if there are seats available.", "zh": "你們可以用同一張票搭下一班車，但只限當天，而且要有空位才行。"}, {"s": "B", "en": "That's helpful. What if the train is delayed?", "zh": "那很有幫助。如果火車誤點呢？"}, {"s": "A", "en": "If the delay is more than thirty minutes, you can get a partial refund. Just keep your ticket and fill out a form.", "zh": "如果誤點超過三十分鐘，你們可以拿到部分退款。只要保留車票並填寫表格。"}, {"s": "B", "en": "Thank you for explaining everything so clearly.", "zh": "謝謝你這麼清楚地說明一切。"}, {"s": "A", "en": "You're welcome. Here's your receipt. Have a wonderful trip!", "zh": "不客氣。這是您的收據。祝您旅途愉快！"}]},
  {"id": "rental", "icon": "🚗", "title": "租車", "en": "Renting a Car", "roles": {"A": "Agent 租車櫃台人員", "B": "You 你"}, "lines": [{"s": "B", "en": "Hello, I'd like to pick up a car. I made a reservation online under the name Chang.", "zh": "你好，我想取車。我在網路上以張的名字訂了車。", "h": "1. 選車"}, {"s": "A", "en": "Welcome. Let me find it. Yes, a compact car from today until Friday. Is that correct?", "zh": "歡迎。我找一下。有的，小型車，從今天到週五。對嗎？"}, {"s": "B", "en": "Yes. But can I upgrade to a larger car? Three friends will be traveling with me.", "zh": "對。但我可以升級成大一點的車嗎？有三個朋友會跟我一起旅行。"}, {"s": "A", "en": "Sure. We have a mid-size SUV available. It's twenty dollars more per day.", "zh": "可以。我們有一輛中型休旅車可用。每天多二十元。"}, {"s": "B", "en": "Does it have a big trunk for our luggage?", "zh": "它的後車廂夠大，可以放我們的行李嗎？"}, {"s": "A", "en": "Yes, there's plenty of space for four suitcases.", "zh": "有，足夠放四個行李箱。"}, {"s": "B", "en": "Is it an automatic? And does it come with GPS?", "zh": "是自排的嗎？有附衛星導航嗎？"}, {"s": "A", "en": "Yes, it's automatic, and GPS is included at no extra cost.", "zh": "是，自排的，導航不另外收費。"}, {"s": "B", "en": "Great. I'll take the SUV.", "zh": "太好了。我要這輛休旅車。"}, {"s": "A", "en": "May I see your driver's license and passport, please?", "zh": "可以看一下您的駕照和護照嗎？", "h": "2. 文件與保險"}, {"s": "B", "en": "Here are my license and my international driving permit.", "zh": "這是我的駕照和國際駕照。"}, {"s": "A", "en": "Thank you. Do you have a credit card for the deposit?", "zh": "謝謝。您有信用卡可以付押金嗎？"}, {"s": "B", "en": "Yes. How much is the deposit?", "zh": "有。押金是多少？"}, {"s": "A", "en": "Three hundred dollars. It will be refunded when you return the car in good condition.", "zh": "三百元。您在車況良好的情況下還車時就會退還。"}, {"s": "B", "en": "What does the basic insurance cover?", "zh": "基本保險涵蓋什麼？"}, {"s": "A", "en": "It covers collision and theft, but there's a five hundred dollar deductible.", "zh": "涵蓋碰撞和失竊，但有五百元的自負額。"}, {"s": "B", "en": "Is there a way to lower the deductible?", "zh": "有辦法降低自負額嗎？"}, {"s": "A", "en": "Yes, our full coverage is fifteen dolla
