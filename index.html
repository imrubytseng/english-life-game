<style>
:root{
  --ink:#16213e;
  --sky:#e6f0ff;
  --blue:#2f4bff;
  --sun:#ffd23f;
  --mint:#2ec4a0;
  --pink:#ff5d73;
  --paper:#ffffff;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;width:44px;height:44px;font-size:20px;box-shadow:3px 3px 0 var(--ink)}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.top h2{margin:0;font-size:20px;flex:1}
.pill{border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}

/* Home */
.logo{font-size:44px;line-height:1;font-weight:900;letter-spacing:-1px;margin:8px 0 6px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.logo .b1,.logo .b2{border:3px solid var(--ink);border-radius:18px;padding:6px 14px 8px;box-shadow:var(--shadow)}
.logo .b1{background:var(--sun);border-bottom-left-radius:2px;transform:rotate(-3deg)}
.logo .b2{background:var(--blue);color:#fff;border-bottom-right-radius:2px;transform:rotate(2deg)}
.sub{margin:14px 0 18px;font-size:15px;opacity:.85}
.notice{border:2.5px solid var(--ink);background:#fff3c4;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.challenge{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:3px solid var(--ink);background:var(--pink);color:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:22px}
.challenge:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.challenge .big{font-size:34px}
.challenge b{display:block;font-size:19px}
.challenge span{font-size:14px;opacity:.95}
.section-title{font-weight:800;margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:3px solid var(--ink);background:var(--paper);border-radius:18px;padding:14px 12px;text-align:left;box-shadow:var(--shadow);min-height:118px;display:flex;flex-direction:column;gap:2px}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.card .ic{font-size:34px;line-height:1.1}
.card b{font-size:16px;margin-top:6px}
.card small{font-size:13px;opacity:.75}
.card .done{align-self:flex-end;margin-top:auto;font-size:12px;font-weight:800;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:0 8px}

/* Learn */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:3px solid var(--ink);background:var(--paper);border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--blue);color:#fff}
.btn.sun{background:var(--sun)}
.btn.on{background:var(--mint)}
.btn[disabled]{opacity:.5;pointer-events:none}
.chat{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.row{display:flex;flex-direction:column;max-width:88%}
.row.A{align-self:flex-start;align-items:flex-start}
.row.B{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;font-weight:800;margin:0 6px 3px}
.bubble{border:3px solid var(--ink);border-radius:20px;padding:10px 14px;text-align:left;box-shadow:3px 3px 0 var(--ink);background:var(--paper);transition:transform .12s, background .12s}
.row.A .bubble{background:var(--sun);border-bottom-left-radius:4px}
.row.B .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bubble .en{font-weight:800;font-size:17px;line-height:1.35}
.bubble .zh{font-size:14px;opacity:.9;margin-top:4px}
.bubble.playing{transform:scale(1.03);box-shadow:5px 5px 0 var(--ink);outline:4px solid var(--mint);outline-offset:2px}
.hide-zh .zh{display:none}
.hide-en .en{filter:blur(7px);user-select:none}
.hint{font-size:13px;opacity:.75;margin:14px 2px 0}

/* Quiz */
.hearts{font-size:18px;letter-spacing:2px}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.qbox{border:3px solid var(--ink);background:var(--paper);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.qtype{font-size:14px;font-weight:800;margin-bottom:10px}
.speak{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:3px solid var(--ink);background:var(--sun);border-radius:16px;padding:16px;font-size:20px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.speak:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.showtxt{margin-top:10px;font-size:14px;text-decoration:underline;background:none;border:none;padding:6px 0;font-weight:700}
.qtext{margin-top:8px;font-weight:800;font-size:17px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:3px solid var(--ink);background:var(--paper);border-radius:16px;padding:12px 14px;text-align:left;font-weight:700;box-shadow:3px 3px 0 var(--ink);display:flex;gap:10px;align-items:center}
.opt .t{flex:1}
.opt .ear{border:2px solid var(--ink);background:var(--sky);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.right{background:var(--mint)}
.opt.wrong{background:var(--pink);color:#fff;animation:shake .35s}
.opt.lock{pointer-events:none}
.feedback{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin:14px 0;font-weight:700}
.feedback.ok{background:#c9f5e8}
.feedback.no{background:#ffd9de}
.feedback small{display:block;font-weight:500;margin-top:4px}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

/* Result */
.result{text-align:center;padding-top:20px}
.stars{font-size:54px;letter-spacing:6px}
.result h1{margin:6px 0;font-size:30px}
.score{display:inline-block;border:3px solid var(--ink);background:var(--sun);border-radius:18px;padding:8px 20px;font-size:22px;font-weight:900;box-shadow:var(--shadow);margin:10px 0 22px}
.result .btns{display:flex;flex-direction:column;gap:12px}

.cat-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;font-weight:900;font-size:17px}
.cat-title small{font-weight:700;font-size:13px;opacity:.7}
.stickybar{position:sticky;bottom:12px;margin-top:22px;z-index:5}
.stickybar .btn{width:100%;font-size:17px;padding:14px}
.modal{position:fixed;inset:0;background:rgba(22,33,62,.55);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:22px 20px;max-width:380px;width:100%;text-align:center}
.modal h3{margin:0 0 6px;font-size:22px}
.modal p{margin:0 0 16px;font-size:15px}
.modal .btns{display:flex;flex-direction:column;gap:10px}
.qzh{margin-top:6px;font-size:14px;opacity:.8}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink);text-align:center;color:var(--blue)}
.field{display:block;margin:10px 0 8px;font-weight:700}
.field select{width:100%;padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:inherit;margin-top:4px}
.cat{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:12px;border:3px solid var(--ink);background:var(--paper);border-radius:16px;padding:12px 16px;font-weight:900;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
.cat.open{background:var(--sun)}
.cat:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.catinfo{font-size:14px;font-weight:800}
.catinfo i{font-style:normal;margin-left:6px}

/* 插圖 */
.banner{position:relative;min-height:128px;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;display:flex;align-items:center;gap:14px;padding:14px 16px;
  background-image:radial-gradient(rgba(255,255,255,.75) 2px, transparent 2.6px);background-size:18px 18px}
.bn-main{flex:none;width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:46px;box-shadow:3px 3px 0 var(--ink);animation:bob 3s ease-in-out infinite}
.bn-text{display:flex;flex-direction:column;position:relative;z-index:1;max-width:48%}
.bn-text b{font-size:21px;line-height:1.2}
.bn-text small{font-size:13px;opacity:.8;margin-top:2px}
.bn{position:absolute;font-size:30px;animation:bob 3.4s ease-in-out infinite}
.bn.p1{top:10px;right:20px;animation-delay:-.6s}
.bn.p2{top:52px;right:76px;font-size:26px;animation-delay:-1.4s}
.bn.p3{bottom:8px;right:22px;font-size:34px;animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes hop{50%{transform:translateY(-5px) scale(1.06)}}
.line{display:flex;gap:8px;align-items:flex-end}
.row.B .line{flex-direction:row-reverse}
.line .bubble{flex:0 1 auto;min-width:0}
.avatar{width:46px;height:46px;flex:none;filter:drop-shadow(2px 2px 0 var(--ink))}
.row.speaking .avatar{animation:hop .45s ease-in-out infinite}
.row{max-width:94%}
.card{position:relative}
.card .ic{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);font-size:30px;line-height:1}
.cprops{position:absolute;top:10px;right:10px;font-size:20px;letter-spacing:2px}
.qbox{position:relative}
.qtype{padding-right:56px}
.qart{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:24px}
.mascot{font-size:78px;line-height:1;animation:bob 2.6s ease-in-out infinite;margin-bottom:4px}
.part{align-self:center;margin:10px 0 0;border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:3px 14px;font-weight:900;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.dur{font-weight:800;opacity:.85}
.donebar{border:3px solid var(--ink);background:#c9f5e8;border-radius:16px;padding:12px 14px;font-weight:800;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============ 資料：生活情境對話 ============ */
// s: 'A' = 對方（店員等） / 'B' = 你
const SCENES = [
  {"id": "restaurant", "icon": "🍽️", "title": "餐廳點餐", "en": "Dinner at a Restaurant", "roles": {"A": "Waiter 服務生", "B": "You 你"}, "lines": [{"s": "A", "en": "Good evening, and welcome to Maple Garden! Do you have a reservation?", "zh": "晚安，歡迎光臨楓園餐廳！請問有訂位嗎？", "h": "1. 入座與看菜單"}, {"s": "B", "en": "Good evening. Yes, I booked a table for two at seven o'clock. It's under the name Lin.", "zh": "晚安。有，我訂了七點兩個人的位子，名字是林。"}, {"s": "A", "en": "Let me check. Yes, Lin, party of two. Would you prefer a table by the window or a quieter booth in the back?", "zh": "我查一下。有的，林，兩位。您想坐窗邊，還是後面比較安靜的包廂座？"}, {"s": "B", "en": "A quiet booth sounds great. We'd like to have a nice conversation.", "zh": "安靜的包廂座聽起來很棒。我們想好好聊聊天。"}, {"s": "A", "en": "Perfect. Please follow me. Here you are. This is your table.", "zh": "太好了。請跟我來。這邊請，這是您的位子。"}, {"s": "B", "en": "Thank you. It's lovely in here.", "zh": "謝謝。這裡真漂亮。"}, {"s": "A", "en": "I'm glad you like it. Here are your menus. Can I start you off with something to drink?", "zh": "很高興您喜歡。這是菜單。要先為您送上飲料嗎？"}, {"s": "B", "en": "Yes, please. What do you recommend?", "zh": "好的。你有什麼推薦的嗎？"}, {"s": "A", "en": "Our homemade lemonade is very popular, and we also have a nice selection of tea and wine.", "zh": "我們的自製檸檬汁很受歡迎，另外也有各式茶和葡萄酒。"}, {"s": "B", "en": "I'll have the lemonade, and my friend would like a glass of iced tea.", "zh": "我要檸檬汁，我朋友想要一杯冰茶。"}, {"s": "A", "en": "Sure. I'll bring those right out, and then I'll come back to take your order.", "zh": "好的。我馬上送來，之後再回來幫您點餐。"}, {"s": "A", "en": "Here are your drinks. Are you ready to order, or do you need a few more minutes?", "zh": "這是您的飲料。準備好點餐了嗎？還是需要再多一點時間？", "h": "2. 點餐"}, {"s": "B", "en": "I think we're ready. Could you tell me what's in the seafood pasta?", "zh": "我想我們準備好了。可以告訴我海鮮義大利麵裡有什麼嗎？"}, {"s": "A", "en": "It has shrimp, clams, and squid in a light garlic and white wine sauce.", "zh": "裡面有蝦子、蛤蜊和花枝，搭配清爽的蒜香白酒醬。"}, {"s": "B", "en": "That sounds delicious, but I'm allergic to shrimp. Can you make it without shrimp?", "zh": "聽起來很美味，但我對蝦子過敏。可以不加蝦子嗎？"}, {"s": "A", "en": "Of course. I'll tell the kitchen right away. We can add extra clams instead.", "zh": "當然可以。我馬上告訴廚房。我們可以多加一些蛤蜊代替。"}, {"s": "B", "en": "That would be wonderful. Thank you for being so helpful.", "zh": "那太好了。謝謝你這麼幫忙。"}, {"s": "B", "en": "And my friend will have the grilled salmon with mashed potatoes.", "zh": "我朋友要點烤鮭魚佐馬鈴薯泥。"}, {"s": "A", "en": "Good choice. How would you like the salmon cooked?", "zh": "好選擇。鮭魚要幾分熟？"}, {"s": "B", "en": "Medium, please.", "zh": "五分熟，麻煩你。"}, {"s": "A", "en": "Would you like a salad or soup to start?", "zh": "開胃菜要沙拉還是湯？"}, {"s": "B", "en": "We'll share a Caesar salad, please.", "zh": "我們一起分享一份凱薩沙拉。"}, {"s": "A", "en": "Great. Let me repeat your order: one seafood pasta without shrimp, one grilled salmon cooked medium, and a Caesar salad to share. Is that correct?", "zh": "好的。我複誦一次餐點：一份不加蝦的海鮮義大利麵、一份五分熟烤鮭魚，還有一份分享的凱薩沙拉。這樣對嗎？"}, {"s": "B", "en": "Yes, that's all correct.", "zh": "對，全部正確。"}, {"s": "A", "en": "Wonderful. Your food will be ready in about fifteen minutes.", "zh": "太好了。您的餐點大約十五分鐘後備妥。"}, {"s": "A", "en": "Here's your Caesar salad. Please enjoy.", "zh": "這是您的凱薩沙拉。請慢用。", "h": "3. 用餐中"}, {"s": "B", "en": "Thank you. Could we also get some extra bread and a little more water?", "zh": "謝謝。可以再給我們一些麵包和多一點水嗎？"}, {"s": "A", "en": "Absolutely. I'll bring them in a moment.", "zh": "沒問題。我稍後就送來。"}, {"s": "A", "en": "Here are your main dishes. The plate is hot, so please be careful.", "zh": "這是您的主餐。盤子很燙，請小心。"}, {"s": "B", "en": "Wow, this looks amazing! Could I have some black pepper, please?", "zh": "哇，這看起來太棒了！可以給我一些黑胡椒嗎？"}, {"s": "A", "en": "Of course. Here you go. Enjoy your meal!", "zh": "當然。給您。請慢用！"}, {"s": "A", "en": "How is everything? Is the pasta okay?", "zh": "一切都還好嗎？義大利麵還可以嗎？"}, {"s": "B", "en": "It's delicious. The sauce is perfect, and the clams are so fresh.", "zh": "很好吃。醬汁剛剛好，蛤蜊也很新鮮。"}, {"s": "A", "en": "I'm so glad to hear that. Let me know if you need anything else.", "zh": "聽到真是太好了。如果還需要什麼，請告訴我。"}, {"s": "A", "en": "May I clear your plates? Would you like to see our dessert menu?", "zh": "我可以收盤子了嗎？您想看看甜點菜單嗎？", "h": "4. 甜點與結帳"}, {"s": "B", "en": "Yes, please. What's the most popular dessert?", "zh": "好的。最受歡迎的甜點是什麼？"}, {"s": "A", "en": "Our chocolate lava cake. It comes with vanilla ice cream.", "zh": "我們的巧克力熔岩蛋糕，附香草冰淇淋。"}, {"s": "B", "en": "We'll share one, and two cups of coffee, please.", "zh": "我們分享一份，再來兩杯咖啡。"}, {"s": "A", "en": "Coming right up.", "zh": "馬上來。"}, {"s": "B", "en": "Excuse me, could we have the check, please?", "zh": "不好意思，可以麻煩結帳嗎？"}, {"s": "A", "en": "Certainly. Here is your bill. The total is eighty-six dollars.", "zh": "當然。這是您的帳單。總共是八十六元。"}, {"s": "B", "en": "Is the service charge included?", "zh": "有包含服務費嗎？"}, {"s": "A", "en": "No, it isn't. The tip is up to you.", "zh": "沒有包含。小費由您決定。"}, {"s": "B", "en": "I see. Can I pay by credit card?", "zh": "了解。我可以刷卡嗎？"}, {"s": "A", "en": "Yes, of course. I'll bring the card machine to your table.", "zh": "可以的。我把刷卡機拿到您的桌邊。"}, {"s": "B", "en": "Here you go. I'll add a fifteen percent tip.", "zh": "給你。我會加百分之十五的小費。"}, {"s": "A", "en": "Thank you so much. Here's your receipt.", "zh": "非常感謝。這是您的收據。"}, {"s": "B", "en": "Thank you for the wonderful service. Everything was great.", "zh": "謝謝你們的優質服務。一切都很棒。"}, {"s": "A", "en": "It was our pleasure. We hope to see you again soon. Have a lovely evening!", "zh": "這是我們的榮幸。希望很快再見到您。祝您有美好的夜晚！"}, {"s": "B", "en": "You too. Good night!", "zh": "你也是。晚安！"}]},
  {"id": "directions", "icon": "🗺️", "title": "問路", "en": "Asking for Directions", "roles": {"A": "Local 當地人", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, could you help me? I'm trying to get to the central train station.", "zh": "不好意思，可以請你幫我嗎？我想去中央火車站。", "h": "1. 詢問路線"}, {"s": "A", "en": "Sure. It's not too far from here. Are you walking?", "zh": "當然。離這裡不太遠。你是用走的嗎？"}, {"s": "B", "en": "Yes, I'm on foot. About how long will it take?", "zh": "對，我走路。大概要多久？"}, {"s": "A", "en": "About fifteen minutes. Go straight down this street until you reach the traffic light.", "zh": "大約十五分鐘。沿著這條街直走，走到紅綠燈。"}, {"s": "B", "en": "Okay, straight until the traffic light.", "zh": "好的，直走到紅綠燈。"}, {"s": "A", "en": "Then turn left and walk past the big department store.", "zh": "然後左轉，走過那間大百貨公司。"}, {"s": "B", "en": "Is the department store the tall building with the red sign?", "zh": "那間百貨公司是有紅色招牌的高樓嗎？"}, {"s": "A", "en": "Yes, exactly. The station is right behind it, across from the bus stop.", "zh": "對，沒錯。車站就在它後面，公車站的對面。"}, {"s": "B", "en": "Sorry, could you say that again more slowly? I want to make sure I understand.", "zh": "抱歉，可以說慢一點再說一次嗎？我想確定我聽懂了。", "h": "2. 確認與詢問"}, {"s": "A", "en": "No problem. Straight to the light, left at the light, past the department store, and the station is on your right.", "zh": "沒問題。直走到紅綠燈，在紅綠燈左轉，經過百貨公司，車站就在你的右手邊。"}, {"s": "B", "en": "Got it. Is there a convenience store on the way? I need to buy some water.", "zh": "懂了。路上有便利商店嗎？我需要買水。"}, {"s": "A", "en": "Yes, there's one next to the bank, about halfway there.", "zh": "有，在銀行旁邊，大約走到一半的地方。"}, {"s": "B", "en": "Perfect. Is it safe to walk there at night?", "zh": "太好了。晚上走過去安全嗎？"}, {"s": "A", "en": "Yes, the streets are well lit, and there are always people around.", "zh": "安全，街道照明很好，而且隨時都有人在附近。"}, {"s": "B", "en": "Thank you. By the way, is there an ATM near the station?", "zh": "謝謝。對了，車站附近有提款機嗎？"}, {"s": "A", "en": "There's one inside the station, next to the ticket office, and another one outside the main entrance.", "zh": "車站裡面售票處旁邊有一台，正門外面還有一台。"}, {"s": "B", "en": "Excuse me, I think I'm lost. I was looking for the train station, but I can't find the department store.", "zh": "不好意思，我想我迷路了。我在找火車站，但是找不到那間百貨公司。", "h": "3. 迷路了"}, {"s": "A", "en": "Oh, you went too far. You passed the traffic light. Where are you now?", "zh": "哦，你走過頭了。你已經過了紅綠燈。你現在在哪裡？"}, {"s": "B", "en": "I'm standing in front of a flower shop on a corner.", "zh": "我站在轉角一間花店前面。"}, {"s": "A", "en": "Okay. Turn around and walk back two blocks. When you see the pharmacy on your left, turn right.", "zh": "好的。轉身往回走兩個街口。看到左邊的藥局時，右轉。"}, {"s": "B", "en": "Turn around, two blocks, then right at the pharmacy. Is that correct?", "zh": "轉身、走兩個街口、在藥局右轉。這樣對嗎？"}, {"s": "A", "en": "Yes. Or you can take the number twelve bus. The stop is just across the street.", "zh": "對。或者你也可以搭十二號公車。公車站就在對面。"}, {"s": "B", "en": "How often does the bus come?", "zh": "公車多久來一班？"}, {"s": "A", "en": "Every ten minutes or so. It takes you right to the station in five minutes.", "zh": "大約每十分鐘一班。五分鐘就可以直接到車站。"}, {"s": "B", "en": "That sounds easier. Do I pay on the bus?", "zh": "聽起來比較輕鬆。我是上車付錢嗎？"}, {"s": "A", "en": "Yes, it costs two dollars, and you need exact change.", "zh": "對，兩元，而且需要剛好的零錢。"}, {"s": "B", "en": "I only have a ten-dollar bill. Is there a place to break it nearby?", "zh": "我只有一張十元鈔票。附近有地方可以換零錢嗎？"}, {"s": "A", "en": "The convenience store is just around the corner. Just buy a bottle of water there.", "zh": "便利商店就在轉角。在那裡買一瓶水就可以換開了。"}, {"s": "B", "en": "Good idea. Thank you so much for your help.", "zh": "好主意。非常謝謝你的幫忙。", "h": "4. 道謝與閒聊"}, {"s": "A", "en": "You're welcome. Where are you from, by the way?", "zh": "不客氣。對了，你從哪裡來？"}, {"s": "B", "en": "I'm from Taiwan. I'm visiting for a few days.", "zh": "我來自台灣。我來這裡玩幾天。"}, {"s": "A", "en": "Welcome! Have you tried the local food yet?", "zh": "歡迎！你試過當地的食物了嗎？"}, {"s": "B", "en": "Not yet. Do you have any recommendations?", "zh": "還沒有。你有什麼推薦的嗎？"}, {"s": "A", "en": "Try the noodle restaurant near the station. It's cheap, and the locals love it.", "zh": "去車站附近那家麵店吧。很便宜，當地人都很愛。"}, {"s": "B", "en": "I will. Is it open late?", "zh": "我會去的。它開到很晚嗎？"}, {"s": "A", "en": "Yes, until eleven at night. The beef noodles are the best.", "zh": "有，開到晚上十一點。牛肉麵是最好吃的。"}, {"s": "B", "en": "Thanks again. Have a great day!", "zh": "再次謝謝你。祝你有美好的一天！"}, {"s": "A", "en": "You too. Safe travels!", "zh": "你也是。旅途平安！"}]},
  {"id": "shopping", "icon": "🛍️", "title": "買衣服", "en": "Shopping for a Jacket", "roles": {"A": "Sales clerk 店員", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi there! Welcome to Urban Style. Let me know if you need any help.", "zh": "嗨！歡迎光臨都會風格。需要幫忙的話請告訴我。", "h": "1. 挑選外套"}, {"s": "B", "en": "Thanks. I'm looking for a light jacket for spring.", "zh": "謝謝。我在找適合春天穿的輕薄外套。"}, {"s": "A", "en": "We have several styles. Do you prefer something casual or more formal?", "zh": "我們有好幾種款式。你喜歡休閒一點還是正式一點的？"}, {"s": "B", "en": "Something casual that I can wear every day.", "zh": "可以每天穿的休閒款。"}, {"s": "A", "en": "How about this denim jacket? It's one of our best sellers.", "zh": "這件牛仔外套如何？是我們最暢銷的商品之一。"}, {"s": "B", "en": "It's nice. Do you have it in any other colors?", "zh": "很不錯。有其他顏色嗎？"}, {"s": "A", "en": "Yes, it also comes in black, light blue, and olive green.", "zh": "有，也有黑色、淺藍色和橄欖綠。"}, {"s": "B", "en": "I like the olive green. Do you have it in a medium?", "zh": "我喜歡橄欖綠。有 M 號嗎？"}, {"s": "A", "en": "Let me check in the back. Yes, here's a medium.", "zh": "我去後面看看。有的，這是 M 號。"}, {"s": "B", "en": "Thanks. Is this jacket machine washable?", "zh": "謝謝。這件外套可以用洗衣機洗嗎？"}, {"s": "A", "en": "Yes, you can wash it in cold water, but please don't use a dryer.", "zh": "可以，你可以用冷水洗，但請不要用烘衣機。"}, {"s": "B", "en": "Good to know. Is it water resistant?", "zh": "知道了。它防水嗎？"}, {"s": "A", "en": "It's lightly water resistant, so it's fine in a little rain, but not in a heavy storm.", "zh": "它有輕微防潑水，小雨沒問題，但大暴雨就不行了。"}, {"s": "B", "en": "Great. Can I try it on?", "zh": "太好了。我可以試穿嗎？", "h": "2. 試穿"}, {"s": "A", "en": "Of course. The fitting room is at the back, on the right.", "zh": "當然。試衣間在後面，右手邊。"}, {"s": "A", "en": "How does it fit?", "zh": "合身嗎？"}, {"s": "B", "en": "The shoulders are a little tight, and the sleeves are a bit short.", "zh": "肩膀有點緊，袖子也有點短。"}, {"s": "A", "en": "Would you like to try a large?", "zh": "要不要試試 L 號？"}, {"s": "B", "en": "Yes, please.", "zh": "好的，麻煩你。"}, {"s": "A", "en": "Here you go.", "zh": "給你。"}, {"s": "B", "en": "This one fits much better. It's comfortable, and the color looks good on me.", "zh": "這件合身多了。穿起來很舒服，顏色也很適合我。"}, {"s": "A", "en": "It really suits you. That color goes well with your skin tone.", "zh": "真的很適合你。這個顏色很襯你的膚色。"}, {"s": "B", "en": "How much is it?", "zh": "這件多少錢？", "h": "3. 價錢與優惠"}, {"s": "A", "en": "It's eighty-nine dollars, but it's on sale for twenty percent off this week.", "zh": "原價八十九元，不過這週打八折。"}, {"s": "B", "en": "Oh, great. So what's the final price?", "zh": "哦，太好了。那最後價格是多少？"}, {"s": "A", "en": "That comes to seventy-one dollars and twenty cents.", "zh": "是七十一元二角。"}, {"s": "B", "en": "That's reasonable. Do you have any matching pants?", "zh": "很合理。你們有搭配的褲子嗎？"}, {"s": "A", "en": "Yes, these cotton pants go well with it. They're forty dollars.", "zh": "有，這些棉褲很搭。四十元。"}, {"s": "B", "en": "Hmm, I'll think about it. I'll just take the jacket for now.", "zh": "嗯，我再考慮一下。我現在先買外套就好。"}, {"s": "A", "en": "No problem. Would you like to become a member? You'll get ten percent off your next purchase.", "zh": "沒問題。您想加入會員嗎？下次購物可以享九折。"}, {"s": "B", "en": "Sure. What do I need to do?", "zh": "好啊。我需要做什麼？"}, {"s": "A", "en": "Just give me your name and phone number.", "zh": "只要給我您的姓名和電話號碼。"}, {"s": "B", "en": "Okay. Here you go.", "zh": "好的。給你。"}, {"s": "A", "en": "You're all set. Will that be cash or card?", "zh": "好了。請問付現還是刷卡？", "h": "4. 結帳與換貨"}, {"s": "B", "en": "Card, please.", "zh": "刷卡。"}, {"s": "A", "en": "Please insert your card. Done. Do you need a bag?", "zh": "請插入您的卡片。好了。需要袋子嗎？"}, {"s": "B", "en": "No, thanks. I brought my own bag.", "zh": "不用，謝謝。我自己有帶袋子。"}, {"s": "A", "en": "Here's your receipt. Please keep it in case you need to exchange the jacket. You have seven days.", "zh": "這是您的收據。請留著，以便需要換貨時使用。您有七天的時間。"}, {"s": "B", "en": "Good to know. What if I want a different size later?", "zh": "知道了。如果我之後想換尺寸呢？"}, {"s": "A", "en": "Just bring it back with the tags on, and we'll be happy to exchange it.", "zh": "只要帶著吊牌回來，我們很樂意為您換貨。"}, {"s": "B", "en": "That's very convenient. Thank you for your help.", "zh": "那很方便。謝謝你的幫忙。"}, {"s": "A", "en": "My pleasure. Have a great day, and come back soon!", "zh": "這是我的榮幸。祝你有美好的一天，歡迎再來！"}, {"s": "B", "en": "I will. Bye!", "zh": "我會的。再見！"}]},
  {"id": "hotel", "icon": "🏨", "title": "飯店入住與服務", "en": "Hotel Check-in and Stay", "roles": {"A": "Receptionist 櫃台", "B": "You 你"}, "lines": [{"s": "A", "en": "Good afternoon, and welcome to the Grand Bay Hotel. How can I help you?", "zh": "午安，歡迎來到大灣飯店。有什麼可以為您服務的嗎？", "h": "1. 辦理入住"}, {"s": "B", "en": "Hi, I'd like to check in, please. I have a reservation under Chen.", "zh": "嗨，我想辦理入住。我以陳的名字訂了房。"}, {"s": "A", "en": "Thank you. Let me look that up. Could I see your passport and a credit card, please?", "zh": "謝謝。我查一下。可以看一下您的護照和一張信用卡嗎？"}, {"s": "B", "en": "Sure. Here you go.", "zh": "當然，給你。"}, {"s": "A", "en": "I see a reservation for a double room with a city view for three nights. Is that correct?", "zh": "我看到您訂了三晚、可看到城市景觀的雙人房。對嗎？"}, {"s": "B", "en": "Yes, that's right. Is it possible to get a room on a higher floor?", "zh": "對。可以安排高樓層的房間嗎？"}, {"s": "A", "en": "Let me check. I can give you room twelve oh six on the twelfth floor.", "zh": "我看一下。我可以給您十二樓的 1206 號房。"}, {"s": "B", "en": "That's perfect. Thank you.", "zh": "太好了，謝謝。"}, {"s": "A", "en": "Breakfast is included, and it's served from seven to ten in the restaurant on the second floor.", "zh": "房價含早餐，早餐在二樓餐廳供應，時間是七點到十點。"}, {"s": "B", "en": "Great. Is there a gym or a swimming pool in the hotel?", "zh": "太好了。飯店有健身房或游泳池嗎？"}, {"s": "A", "en": "Yes, both are on the sixth floor. The gym is open twenty-four hours, and the pool closes at ten p.m.", "zh": "有的，兩個都在六樓。健身房二十四小時開放，游泳池晚上十點關閉。"}, {"s": "A", "en": "Here are your key cards. The elevators are to your right.", "zh": "這是您的房卡。電梯在您的右手邊。", "h": "2. 房間與設施"}, {"s": "B", "en": "Thank you. What's the Wi-Fi password?", "zh": "謝謝。Wi-Fi 密碼是什麼？"}, {"s": "A", "en": "It's printed on the key card holder. You'll need your room number to log in.", "zh": "印在房卡套上，登入時需要輸入您的房號。"}, {"s": "B", "en": "Perfect. Could you send someone to help with my luggage?", "zh": "太好了。可以請人幫我拿行李嗎？"}, {"s": "A", "en": "Of course. A bellhop will bring your bags up in a few minutes.", "zh": "當然。行李員幾分鐘後會把您的行李送上去。"}, {"s": "B", "en": "Hello, this is room twelve oh six. My key card isn't working.", "zh": "你好，這裡是 1206 號房。我的房卡打不開。", "h": "3. 房卡打不開"}, {"s": "A", "en": "I'm sorry about that. Please come down to the front desk, and I'll reset it for you.", "zh": "很抱歉。請到櫃台來，我幫您重新設定。"}, {"s": "B", "en": "Okay, I'll be right down.", "zh": "好的，我馬上下去。"}, {"s": "A", "en": "Here is your new card. Please try it again.", "zh": "這是新的房卡。請再試一次。"}, {"s": "B", "en": "It works now. Thank you so much.", "zh": "現在可以了。非常謝謝。"}, {"s": "B", "en": "By the way, could I get a wake-up call tomorrow at six thirty?", "zh": "對了，明天早上六點半可以幫我設定晨喚嗎？", "h": "4. 詢問各種服務"}, {"s": "A", "en": "Certainly. I've set it for six thirty.", "zh": "當然。我已經設定好六點半了。"}, {"s": "B", "en": "Also, can you recommend a good restaurant nearby for dinner?", "zh": "另外，你可以推薦附近好吃的晚餐餐廳嗎？"}, {"s": "A", "en": "Yes. There's an excellent seafood restaurant just two blocks away. It's very popular, so I'd recommend making a reservation.", "zh": "可以。兩個街口外有一家很棒的海鮮餐廳。非常受歡迎，建議先訂位。"}, {"s": "B", "en": "Could you make a reservation for me?", "zh": "可以幫我訂位嗎？"}, {"s": "A", "en": "Of course. What time, and how many people?", "zh": "當然。幾點、幾位？"}, {"s": "B", "en": "Seven thirty, for two people.", "zh": "七點半，兩位。"}, {"s": "A", "en": "All set. I booked a table for two at seven thirty under the name Chen.", "zh": "訂好了。我以陳的名字訂了七點半兩個人的位子。"}, {"s": "B", "en": "Wonderful. How do I get there?", "zh": "太好了。要怎麼走過去？"}, {"s": "A", "en": "Turn left out of the hotel, walk two blocks, and you'll see it on your right. It's about a five-minute walk.", "zh": "出飯店後左轉，走兩個街口，右手邊就會看到。走路大約五分鐘。"}, {"s": "B", "en": "Thanks. One last thing: do you offer a laundry service?", "zh": "謝謝。最後一件事：你們有洗衣服務嗎？"}, {"s": "A", "en": "Yes. Just put your clothes in the bag in your closet, and we'll return them the next day.", "zh": "有的。把衣服放進衣櫃裡的袋子，我們隔天會送回來。"}, {"s": "B", "en": "Great. You've been very helpful.", "zh": "太好了。你幫了我很多忙。"}, {"s": "A", "en": "My pleasure. Please call us anytime if you need anything. Enjoy your stay!", "zh": "這是我的榮幸。有任何需要隨時打給我們。祝您住得愉快！"}, {"s": "B", "en": "Thank you. Have a good day!", "zh": "謝謝。祝你有美好的一天！"}]},
  {"id": "taxi", "icon": "🚕", "title": "搭計程車", "en": "Taking a Taxi in a New City", "roles": {"A": "Driver 司機", "B": "You 你"}, "lines": [{"s": "A", "en": "Hello! Where are you headed today?", "zh": "哈囉！您今天要去哪裡？", "h": "1. 上車"}, {"s": "B", "en": "Hi. I'd like to go to the Grand Central Hotel on Park Avenue, please.", "zh": "嗨。我想去公園大道的中央大飯店。"}, {"s": "A", "en": "Sure thing. Do you have any luggage? Let me put it in the trunk.", "zh": "沒問題。您有行李嗎？我幫您放進後車廂。"}, {"s": "B", "en": "Yes, I have two suitcases. Thank you.", "zh": "有，我有兩個行李箱。謝謝。"}, {"s": "B", "en": "Do you know about how much it will cost?", "zh": "你知道大概要多少錢嗎？"}, {"s": "A", "en": "Usually around thirty dollars, depending on traffic.", "zh": "通常大約三十元，要看路況。"}, {"s": "A", "en": "Please buckle up. Is the temperature okay for you?", "zh": "請繫好安全帶。這個溫度您還可以嗎？"}, {"s": "B", "en": "It's a little warm. Could you turn up the air conditioning?", "zh": "有點熱。可以把冷氣開大一點嗎？"}, {"s": "A", "en": "Sure. Is that better?", "zh": "好的。這樣好一點嗎？"}, {"s": "B", "en": "Yes, much better. Thank you.", "zh": "對，好多了。謝謝。"}, {"s": "A", "en": "Is this your first time in the city?", "zh": "這是您第一次來這座城市嗎？", "h": "2. 路上聊天"}, {"s": "B", "en": "Yes, I just arrived this morning. I'm here for a week.", "zh": "是的，我今天早上才到。我會在這裡待一週。"}, {"s": "A", "en": "Welcome! Are you here for business or for fun?", "zh": "歡迎！您是來出差還是來玩？"}, {"s": "B", "en": "For fun. I'd love to see the famous places. What do you recommend?", "zh": "來玩。我很想看看有名的景點。你有什麼推薦的嗎？"}, {"s": "A", "en": "You should visit the old town and the harbor. The night market is fantastic too.", "zh": "您應該去老城區和海港。夜市也很棒。"}, {"s": "B", "en": "That sounds great. How far is the old town from my hotel?", "zh": "聽起來很棒。老城區離我的飯店多遠？"}, {"s": "A", "en": "It's only about fifteen minutes by bus.", "zh": "搭公車大約只要十五分鐘。"}, {"s": "B", "en": "Perfect. Can you also recommend a good local restaurant?", "zh": "太好了。你也能推薦一家不錯的當地餐廳嗎？"}, {"s": "A", "en": "Try the noodle shop near the harbor. It's cheap, and the locals love it.", "zh": "去海港附近那家麵店吧。很便宜，當地人都很愛。"}, {"s": "B", "en": "What's the best way to get around the city?", "zh": "在市區移動最好的方式是什麼？"}, {"s": "A", "en": "The subway is cheap and fast, and you can buy a day pass at any station.", "zh": "地鐵又便宜又快，在任何一站都可以買一日券。"}, {"s": "B", "en": "Is it safe to take taxis at night?", "zh": "晚上搭計程車安全嗎？"}, {"s": "A", "en": "Yes, but always use a licensed taxi with a meter, like this one.", "zh": "安全，但一定要搭有牌照、有跳表的計程車，像這輛。"}, {"s": "B", "en": "Good to know. Thanks for the advice.", "zh": "知道了。謝謝你的建議。"}, {"s": "B", "en": "I'll definitely go there. Is the traffic usually bad here?", "zh": "我一定會去。這裡通常塞車嚴重嗎？"}, {"s": "A", "en": "Today there's a lot of traffic on the main road, so I'll take a shortcut through the side streets.", "zh": "今天主要道路很塞，所以我會抄近路穿過小街。"}, {"s": "B", "en": "Sounds good. How long will it take?", "zh": "聽起來不錯。要多久？"}, {"s": "A", "en": "About twenty-five minutes.", "zh": "大約二十五分鐘。"}, {"s": "B", "en": "Actually, could we stop at a bank first? I need to get some cash.", "zh": "其實，我們可以先停一下銀行嗎？我需要領一些現金。", "h": "3. 臨時改變行程"}, {"s": "A", "en": "Of course. There's an ATM on the next corner. I'll wait for you.", "zh": "當然可以。下一個轉角有提款機。我會等您。"}, {"s": "B", "en": "Thank you. I'll be quick.", "zh": "謝謝。我會很快。"}, {"s": "B", "en": "Sorry for the wait.", "zh": "抱歉讓你久等。"}, {"s": "A", "en": "No problem. Let's get back on the road.", "zh": "沒關係。我們繼續上路吧。"}, {"s": "A", "en": "Here we are, the Grand Central Hotel. The fare is thirty-two dollars.", "zh": "我們到了，中央大飯店。車資是三十二元。", "h": "4. 到達與付款"}, {"s": "B", "en": "Can I pay by credit card?", "zh": "我可以刷信用卡嗎？"}, {"s": "A", "en": "Yes, we take cards. Just tap it here.", "zh": "可以，我們可以刷卡。在這裡感應就好。"}, {"s": "B", "en": "Okay. I'd like to add a tip.", "zh": "好的。我想加小費。"}, {"s": "A", "en": "Thank you, I appreciate that. Let me help you with your luggage.", "zh": "謝謝，我很感激。我來幫您拿行李。"}, {"s": "B", "en": "Thank you so much. Could I have a receipt?", "zh": "非常謝謝。可以給我收據嗎？"}, {"s": "A", "en": "Of course. Here you go.", "zh": "當然。給您。"}, {"s": "A", "en": "If you need a ride back to the airport, here's my card. Just give me a call.", "zh": "如果您需要回機場，這是我的名片。打給我就可以了。"}, {"s": "B", "en": "That's great. I'll call you the day before I leave.", "zh": "太好了。我離開前一天會打給你。"}, {"s": "B", "en": "Thanks for the ride and the great tips.", "zh": "謝謝你載我，還有給了這麼棒的建議。"}, {"s": "A", "en": "My pleasure. Enjoy your trip!", "zh": "我的榮幸。祝您旅途愉快！"}]},
  {"id": "pharmacy", "icon": "💊", "title": "藥局買藥", "en": "At the Pharmacy", "roles": {"A": "Pharmacist 藥師", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi there. Welcome to Green Cross Pharmacy. How can I help you?", "zh": "你好。歡迎光臨綠十字藥局。有什麼可以為您服務的嗎？", "h": "1. 說明症狀"}, {"s": "B", "en": "Hi. I've had a sore throat and a runny nose for two days, and I have a mild headache.", "zh": "嗨。我喉嚨痛和流鼻水兩天了，還有輕微頭痛。"}, {"s": "A", "en": "I'm sorry to hear that. Do you have a fever?", "zh": "很遺憾聽到這件事。您有發燒嗎？"}, {"s": "B", "en": "No, I took my temperature this morning, and it was normal.", "zh": "沒有，我今天早上量過體溫，是正常的。"}, {"s": "A", "en": "Do you have a cough?", "zh": "您有咳嗽嗎？"}, {"s": "B", "en": "A little, but mostly my throat hurts when I swallow.", "zh": "一點點，但主要是吞嚥時喉嚨會痛。"}, {"s": "A", "en": "Do you have any allergies to medication?", "zh": "您對藥物有任何過敏嗎？"}, {"s": "B", "en": "Yes, I'm allergic to penicillin.", "zh": "有，我對盤尼西林過敏。"}, {"s": "A", "en": "Thank you for telling me. Are you taking any other medicine right now?", "zh": "謝謝您告訴我。您目前有在服用其他藥物嗎？"}, {"s": "B", "en": "Just a daily vitamin.", "zh": "只有每天一顆維他命。"}, {"s": "A", "en": "Okay. For a cold like this, I recommend a throat lozenge and a cold medicine.", "zh": "好的。像這樣的感冒，我建議您使用喉糖和感冒藥。", "h": "2. 藥師建議"}, {"s": "B", "en": "What's the difference between these two cold medicines?", "zh": "這兩種感冒藥有什麼差別？"}, {"s": "A", "en": "This one has an ingredient that can make you sleepy, so it's best to take it at night. This one is non-drowsy, so you can take it during the day.", "zh": "這一種含有會讓人想睡的成分，所以最好晚上吃。這一種不會嗜睡，可以白天服用。"}, {"s": "B", "en": "I need to drive to work, so I'll take the non-drowsy one in the morning.", "zh": "我需要開車上班，所以早上我會吃不嗜睡的那種。"}, {"s": "A", "en": "That's a good idea. Take one tablet every six hours, and don't take more than four tablets in one day.", "zh": "好主意。每六小時吃一錠，一天不要超過四錠。"}, {"s": "B", "en": "Should I take it with food?", "zh": "要配食物一起吃嗎？"}, {"s": "A", "en": "It's better to take it after a meal to avoid an upset stomach.", "zh": "最好飯後吃，避免胃不舒服。"}, {"s": "B", "en": "Got it. What about the headache?", "zh": "了解。那頭痛呢？"}, {"s": "A", "en": "The cold medicine already includes a pain reliever, so you shouldn't need anything extra.", "zh": "這個感冒藥已經含有止痛成分，所以您應該不需要再吃別的。"}, {"s": "B", "en": "Is there anything I can do at home to feel better?", "zh": "在家有什麼可以讓我好過一點的方法嗎？", "h": "3. 居家照顧與領處方藥"}, {"s": "A", "en": "Drink lots of warm water, get plenty of rest, and gargle with salt water a few times a day.", "zh": "多喝溫水、充分休息，並且每天用鹽水漱口幾次。"}, {"s": "B", "en": "Okay. And how long until I feel better?", "zh": "好的。大概多久會好？"}, {"s": "A", "en": "Most colds go away in about a week. If your symptoms get worse, or if you get a high fever, please see a doctor.", "zh": "大多數感冒大約一週會好。如果症狀惡化或發高燒，請去看醫生。"}, {"s": "B", "en": "I will. Oh, I also need to pick up a prescription for my mother. Her name is Linda Chen.", "zh": "我會的。哦，我還要幫我媽媽領處方藥。她叫琳達·陳。"}, {"s": "A", "en": "Let me check. Yes, it's ready. Could I see your ID, please?", "zh": "我看一下。有的，已經準備好了。可以看一下您的證件嗎？"}, {"s": "B", "en": "Here you go.", "zh": "給你。"}, {"s": "A", "en": "Thank you. These are her blood pressure pills. She should take one every morning.", "zh": "謝謝。這些是她的血壓藥。她應該每天早上吃一顆。"}, {"s": "B", "en": "Okay. Is there anything she should avoid?", "zh": "好的。她有什麼需要避免的嗎？"}, {"s": "A", "en": "She shouldn't drink grapefruit juice while taking this medicine.", "zh": "服用這個藥時不要喝葡萄柚汁。"}, {"s": "B", "en": "I'll tell her.", "zh": "我會告訴她。"}, {"s": "A", "en": "Would you like to buy anything else today? We have a sale on vitamin C.", "zh": "您今天還想買別的嗎？我們維他命 C 有特價。", "h": "4. 結帳"}, {"s": "B", "en": "Yes, I'll take a bottle of vitamin C, and also a box of tissues.", "zh": "好的，我要一瓶維他命 C，還有一盒面紙。"}, {"s": "A", "en": "Sure. Your total is thirty-one dollars and fifty cents.", "zh": "好的。您的總額是三十一元五角。"}, {"s": "B", "en": "Do you accept insurance for the prescription?", "zh": "處方藥你們接受保險嗎？"}, {"s": "A", "en": "Yes. With your mother's insurance, the prescription is only ten dollars.", "zh": "接受。使用您母親的保險，處方藥只要十元。"}, {"s": "B", "en": "That's great. Here is the card.", "zh": "太好了。這是保險卡。"}, {"s": "A", "en": "Thank you. Your new total is twenty-nine dollars and fifty cents.", "zh": "謝謝。您的新總額是二十九元五角。"}, {"s": "B", "en": "Here's my credit card.", "zh": "這是我的信用卡。"}, {"s": "A", "en": "Here's your receipt. I hope you feel better soon!", "zh": "這是您的收據。希望您早日康復！"}, {"s": "B", "en": "Thank you so much for your help. Take care!", "zh": "非常謝謝你的幫忙。保重！"}]},
  {"id": "airport", "icon": "✈️", "title": "機場報到與登機", "en": "Airport Check-in and Boarding", "roles": {"A": "Airport staff 機場人員", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning! Where are you flying today?", "zh": "早安！您今天要飛往哪裡？", "h": "1. 櫃台報到"}, {"s": "B", "en": "Good morning. I'm flying to Los Angeles on flight BR twelve.", "zh": "早安。我要搭 BR12 班機去洛杉磯。"}, {"s": "A", "en": "Great. May I see your passport, please?", "zh": "好的。可以看一下您的護照嗎？"}, {"s": "B", "en": "Sure, here you go.", "zh": "當然，給你。"}, {"s": "A", "en": "Thank you. Are you traveling alone today?", "zh": "謝謝。您今天一個人旅行嗎？"}, {"s": "B", "en": "Yes, I'm traveling alone.", "zh": "對，我一個人。"}, {"s": "A", "en": "Did you pack your bags yourself?", "zh": "行李是您自己打包的嗎？"}, {"s": "B", "en": "Yes, I did.", "zh": "是的。"}, {"s": "A", "en": "Do you have any liquids, batteries, or sharp objects in your checked bag?", "zh": "您托運的行李裡，有沒有放液體、電池或尖銳物品？"}, {"s": "B", "en": "I have a small bottle of perfume, but it's sealed. And my power bank is in my carry-on bag.", "zh": "我有一小瓶香水，但是密封好的。行動電源放在我的隨身行李裡。"}, {"s": "A", "en": "That's perfect. Power banks must always go in your carry-on.", "zh": "這樣很好。行動電源一定要放在隨身行李。"}, {"s": "A", "en": "Would you like a window seat or an aisle seat?", "zh": "您想要靠窗還是靠走道的座位？", "h": "2. 座位與托運行李"}, {"s": "B", "en": "A window seat, please. Is there one available near the front?", "zh": "麻煩靠窗。前面有空位嗎？"}, {"s": "A", "en": "Let me see. I have seat fourteen A. It's by the window, and it's close to the front of the economy cabin.", "zh": "我看看。我有 14A，在窗邊，靠近經濟艙前面。"}, {"s": "B", "en": "That's perfect. Thank you.", "zh": "太好了，謝謝。"}, {"s": "A", "en": "Please put your suitcase on the scale.", "zh": "請把行李箱放到秤上。"}, {"s": "B", "en": "Okay. Is it under the weight limit?", "zh": "好的。有沒有超過重量限制？"}, {"s": "A", "en": "It's twenty-three point five kilograms. The limit is twenty-three, so it's a little over.", "zh": "是二十三點五公斤。限制是二十三公斤，所以稍微超重了。"}, {"s": "B", "en": "Oh, I'm sorry. Can I take something out?", "zh": "哦，抱歉。我可以拿一些東西出來嗎？"}, {"s": "A", "en": "Sure. You can move some items to your carry-on bag.", "zh": "可以。您可以把一些東西移到隨身行李。"}, {"s": "B", "en": "Let me take out my jacket and two books.", "zh": "我把外套和兩本書拿出來。"}, {"s": "A", "en": "That works. Now it's twenty-two point eight kilograms.", "zh": "這樣可以了。現在是二十二點八公斤。"}, {"s": "A", "en": "Here is your boarding pass. Your flight leaves from gate twelve, and boarding starts at nine thirty.", "zh": "這是您的登機證。班機從十二號登機門出發，九點半開始登機。"}, {"s": "B", "en": "Thank you. What time does the gate close?", "zh": "謝謝。登機門幾點關閉？"}, {"s": "A", "en": "It closes at ten ten, so please arrive at least twenty minutes early.", "zh": "十點十分關閉，所以請至少提早二十分鐘到。"}, {"s": "A", "en": "Please place your bag, laptop, and jacket in the trays.", "zh": "請把包包、筆電和外套放進籃子裡。", "h": "3. 安全檢查"}, {"s": "B", "en": "Do I need to take off my shoes?", "zh": "我需要脫鞋嗎？"}, {"s": "A", "en": "No, you can keep them on. But please take out your phone and belt.", "zh": "不用，您可以穿著。但請把手機和皮帶拿出來。"}, {"s": "B", "en": "Okay. Is that everything?", "zh": "好的。這樣就可以了嗎？"}, {"s": "A", "en": "Yes. Please walk through the scanner with your arms down.", "zh": "是的。請手放下走過掃描門。"}, {"s": "A", "en": "I'm sorry, I need to check your bag. Do you have a water bottle inside?", "zh": "抱歉，我需要檢查您的包包。裡面有水瓶嗎？"}, {"s": "B", "en": "Oh, yes. I forgot to empty it.", "zh": "哦，有。我忘記倒掉了。"}, {"s": "A", "en": "You can pour it out over there, or you can finish it before you go through.", "zh": "您可以到那邊倒掉，或喝完再通過。"}, {"s": "B", "en": "I'll drink it now. Sorry about that.", "zh": "我現在喝掉。抱歉。"}, {"s": "A", "en": "No worries. You're all set. Have a nice flight!", "zh": "沒關係。都沒問題了。祝您飛行愉快！"}, {"s": "B", "en": "Excuse me, which way is gate twelve?", "zh": "不好意思，十二號登機門怎麼走？", "h": "4. 前往登機門"}, {"s": "A", "en": "Go straight down this hall, and take the escalator up. Gate twelve is on the left.", "zh": "沿著這條走廊直走，搭手扶梯上去。十二號登機門在左邊。"}, {"s": "B", "en": "How long does it take to walk there?", "zh": "走過去要多久？"}, {"s": "A", "en": "About ten minutes.", "zh": "大約十分鐘。"}, {"s": "B", "en": "Great. And is there a place to buy water nearby?", "zh": "太好了。附近有地方可以買水嗎？"}, {"s": "A", "en": "Yes, there's a convenience store right next to the gate.", "zh": "有，登機門旁邊就有一間便利商店。"}, {"s": "B", "en": "Perfect. Thanks for your help.", "zh": "太好了。謝謝你的幫忙。"}, {"s": "A", "en": "You're welcome. Have a safe trip!", "zh": "不客氣。旅途平安！"}]},
  {"id": "phone", "icon": "📞", "title": "電話預約", "en": "Booking an Appointment by Phone", "roles": {"A": "Receptionist 櫃台", "B": "You 你"}, "lines": [{"s": "A", "en": "Good afternoon, Sunny Dental Clinic. This is Amy speaking. How can I help you?", "zh": "午安，陽光牙醫診所，我是艾咪。有什麼可以為您服務的？", "h": "1. 預約時間"}, {"s": "B", "en": "Hi, Amy. I'd like to make an appointment for a check-up and a teeth cleaning.", "zh": "嗨，艾咪。我想預約檢查和洗牙。"}, {"s": "A", "en": "Certainly. Have you been to our clinic before?", "zh": "沒問題。您之前來過我們診所嗎？"}, {"s": "B", "en": "No, this will be my first time.", "zh": "沒有，這是第一次。"}, {"s": "A", "en": "Welcome. Which day works best for you?", "zh": "歡迎。哪一天對您比較方便？"}, {"s": "B", "en": "Do you have anything available next Tuesday?", "zh": "下週二有空檔嗎？"}, {"s": "A", "en": "Let me check the schedule. We have an opening at ten in the morning and another at three in the afternoon.", "zh": "我查一下時間表。我們早上十點和下午三點各有一個空檔。"}, {"s": "B", "en": "Unfortunately I work in the morning. Three o'clock would be perfect.", "zh": "可惜我早上要上班。三點最好。"}, {"s": "A", "en": "Great. Let me book that for you. May I have your full name, please?", "zh": "好的。我幫您預約。請問您的全名？"}, {"s": "B", "en": "Sure. My name is David Wang. That's D-A-V-I-D, W-A-N-G.", "zh": "好的。我叫大衛·王。D-A-V-I-D，W-A-N-G。"}, {"s": "A", "en": "Thank you, Mr. Wang. And what's the best phone number to reach you?", "zh": "謝謝您，王先生。請問用哪個電話號碼聯絡您最方便？", "h": "2. 聯絡資料與保險"}, {"s": "B", "en": "It's nine one two, three four five, six seven eight.", "zh": "是 912-345-678。"}, {"s": "A", "en": "Let me repeat that: nine one two, three four five, six seven eight. Is that right?", "zh": "我複誦一次：912-345-678。對嗎？"}, {"s": "B", "en": "Yes, that's correct.", "zh": "對，沒錯。"}, {"s": "A", "en": "Do you have dental insurance?", "zh": "您有牙醫保險嗎？"}, {"s": "B", "en": "Yes, I do. Do I need to bring my insurance card?", "zh": "有。我需要帶保險卡嗎？"}, {"s": "A", "en": "Yes, please bring your card and a photo ID.", "zh": "是的，請帶保險卡和附照片的證件。"}, {"s": "B", "en": "Okay. Is there anything I need to do before the appointment?", "zh": "好的。預約前我需要做什麼準備嗎？"}, {"s": "A", "en": "Please arrive fifteen minutes early to fill out some forms. And please brush your teeth before you come.", "zh": "請提早十五分鐘到，填寫一些表格。也請在來之前先刷牙。"}, {"s": "B", "en": "Of course. How long will the appointment take?", "zh": "當然。預約大概需要多久？"}, {"s": "A", "en": "About an hour.", "zh": "大約一小時。"}, {"s": "B", "en": "Oh, wait. I just remembered I have a meeting next Tuesday afternoon. Could I change it to Wednesday?", "zh": "哦，等一下。我剛想起來下週二下午有會議。我可以改成週三嗎？", "h": "3. 臨時改期"}, {"s": "A", "en": "No problem. On Wednesday, we have an opening at two thirty and another at four.", "zh": "沒問題。週三我們兩點半和四點各有一個空檔。"}, {"s": "B", "en": "Two thirty works for me.", "zh": "兩點半可以。"}, {"s": "A", "en": "Perfect. I've changed it to next Wednesday at two thirty.", "zh": "好的。我已經改成下週三兩點半。"}, {"s": "B", "en": "Thank you. And what if I need to cancel?", "zh": "謝謝。如果我需要取消呢？"}, {"s": "A", "en": "Please call us at least twenty-four hours before. Otherwise, there's a twenty-dollar cancellation fee.", "zh": "請至少提前二十四小時打給我們。否則會收取二十元的取消費。"}, {"s": "B", "en": "I understand. Where exactly is your clinic?", "zh": "我了解。你們診所確切在哪裡？", "h": "4. 地點與確認"}, {"s": "A", "en": "We're at one hundred Main Street, on the second floor, right above the pharmacy.", "zh": "我們在主街一百號二樓，就在藥局樓上。"}, {"s": "B", "en": "Is there parking nearby?", "zh": "附近有停車位嗎？"}, {"s": "A", "en": "Yes, there's a public parking lot behind the building.", "zh": "有，大樓後面有公共停車場。"}, {"s": "B", "en": "Also, do you offer any payment plans for larger treatments?", "zh": "另外，如果是比較大的治療，你們有提供分期付款嗎？"}, {"s": "A", "en": "Yes, we accept most insurance plans, and we also offer monthly payments.", "zh": "有的，我們接受大部分的保險，也提供按月付款。"}, {"s": "B", "en": "That's good to know.", "zh": "知道了。"}, {"s": "B", "en": "Great. Could you send me a reminder?", "zh": "太好了。可以寄提醒給我嗎？"}, {"s": "A", "en": "Of course. We'll send you a text message the day before.", "zh": "當然。我們會在前一天傳簡訊給您。"}, {"s": "A", "en": "Is there anything else I can help you with today?", "zh": "今天還有什麼我可以幫忙的嗎？"}, {"s": "B", "en": "No, that's everything. I'm looking forward to the visit.", "zh": "沒有了，就這些。我很期待這次看診。"}, {"s": "B", "en": "Thank you so much, Amy.", "zh": "非常謝謝你，艾咪。"}, {"s": "A", "en": "You're welcome, Mr. Wang. To confirm: next Wednesday at two thirty. We'll see you then!", "zh": "不客氣，王先生。再確認一次：下週三兩點半。到時見！"}, {"s": "B", "en": "See you then. Goodbye!", "zh": "到時見。再見！"}]},
  {"id": "work", "icon": "💼", "title": "日常工作溝通", "en": "Talking with Your Manager", "roles": {"A": "Manager 主管", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning. Do you have a minute? I'd like to check in about the project.", "zh": "早安。你有空嗎？我想了解一下專案的進度。", "h": "1. 進度報告"}, {"s": "B", "en": "Of course. Good morning. Let me bring my laptop so I can show you the latest numbers.", "zh": "當然。早安。我帶我的筆電，這樣可以給你看最新的數字。"}, {"s": "A", "en": "Great. How is the new website coming along?", "zh": "太好了。新網站進行得怎麼樣？"}, {"s": "B", "en": "It's going well. We finished the design last week, and the developers started building the pages on Monday.", "zh": "進行得很順利。我們上週完成了設計，開發人員週一開始製作頁面。"}, {"s": "A", "en": "That's good to hear. Are we still on schedule to launch on the thirtieth?", "zh": "很高興聽到這件事。我們還能在三十號如期上線嗎？"}, {"s": "B", "en": "Mostly. We're about two days behind on the payment page, but I think we can catch up.", "zh": "大致可以。付款頁面落後了大約兩天，但我想我們可以趕上。"}, {"s": "A", "en": "What's causing the delay?", "zh": "是什麼原因造成延遲？", "h": "2. 遇到問題"}, {"s": "B", "en": "The payment system we chose needs extra security tests, and the testing team is busy with another project.", "zh": "我們選的付款系統需要額外的安全測試，而測試團隊正忙著另一個專案。"}, {"s": "A", "en": "I see. How long will the tests take?", "zh": "我明白了。測試需要多久？"}, {"s": "B", "en": "About three days if we start tomorrow, but the team can't start until Thursday.", "zh": "如果明天開始大約三天，但團隊要到週四才能開始。"}, {"s": "A", "en": "Hmm. Have you talked to the testing team's manager?", "zh": "嗯。你跟測試團隊的主管談過了嗎？"}, {"s": "B", "en": "Not yet. I wanted to ask you first, because I'm not sure whether we should wait or find outside help.", "zh": "還沒有。我想先問你，因為我不確定我們應該等待還是找外部協助。"}, {"s": "A", "en": "Let me talk to her this afternoon. I'll ask if two of her people can help us on Wednesday.", "zh": "我今天下午去跟她談。我會問問她的兩位同仁週三能不能來幫我們。"}, {"s": "B", "en": "That would be very helpful. Thank you.", "zh": "那會很有幫助。謝謝你。"}, {"s": "A", "en": "In the meantime, what else can your team do to save time?", "zh": "在這段時間，你的團隊還能做什麼來節省時間？"}, {"s": "B", "en": "We can work on the mobile version at the same time, instead of waiting until the payment page is ready.", "zh": "我們可以同時製作手機版，而不是等到付款頁面完成。"}, {"s": "A", "en": "Good idea. Do you have enough people for that?", "zh": "好主意。你們有足夠的人手嗎？"}, {"s": "B", "en": "Actually, I wanted to ask for some help. Could we bring in a part-time designer for two weeks?", "zh": "其實，我想請求一些協助。我們可以找一位兼職設計師來兩週嗎？", "h": "3. 提出請求"}, {"s": "A", "en": "What would the designer do?", "zh": "設計師要做什麼？"}, {"s": "B", "en": "Create the product images and the banners. Right now our designer is doing everything, and she's exhausted.", "zh": "製作商品圖片和橫幅廣告。現在我們的設計師什麼都在做，她累壞了。"}, {"s": "A", "en": "I understand. What's the budget for that?", "zh": "我了解。預算是多少？"}, {"s": "B", "en": "About two thousand dollars. I have a quote from a freelancer who worked with us last year.", "zh": "大約兩千元。我有一份去年和我們合作過的自由工作者的報價。"}, {"s": "A", "en": "Send me the quote and a short explanation, and I'll talk to finance. I think we can approve it.", "zh": "把報價和簡短的說明寄給我，我會跟財務部談。我想我們可以核准。"}, {"s": "B", "en": "Thank you. I'll send it to you by noon.", "zh": "謝謝你。我中午前寄給你。"}, {"s": "A", "en": "Is there anything else you need from me?", "zh": "還有什麼需要我協助的嗎？"}, {"s": "B", "en": "Just one thing. Could you join the client meeting on Friday? They'll feel more comfortable if you're there.", "zh": "只有一件事。你可以參加週五的客戶會議嗎？如果你在場，他們會比較安心。"}, {"s": "A", "en": "Of course. What time is it?", "zh": "當然。幾點？"}, {"s": "B", "en": "Two o'clock, in meeting room B. I'll send you the invitation.", "zh": "兩點，在 B 會議室。我會寄邀請給你。"}, {"s": "A", "en": "By the way, I wanted to say that your last presentation was excellent. The client was very impressed.", "zh": "對了，我想說你上次的簡報非常出色。客戶印象很深刻。", "h": "4. 回饋與收尾"}, {"s": "B", "en": "Thank you. That means a lot. The whole team worked hard on it.", "zh": "謝謝你。這對我意義重大。整個團隊都很努力。"}, {"s": "A", "en": "I know. Please tell them I said thank you.", "zh": "我知道。請告訴他們我說謝謝。"}, {"s": "B", "en": "I will. Is there anything I should improve?", "zh": "我會的。有什麼我應該改進的嗎？"}, {"s": "A", "en": "One suggestion: try to share problems earlier. Don't wait until a delay becomes serious.", "zh": "一個建議：試著更早分享問題。不要等到延遲變嚴重才說。"}, {"s": "B", "en": "That's fair. I'll give you a weekly update, and I'll tell you right away if something changes.", "zh": "很合理。我會每週向你更新進度，如果有任何變化會馬上告訴你。"}, {"s": "A", "en": "Perfect. That's all from me. Let's catch up again on Friday morning.", "zh": "太好了。我這邊就這些。我們週五早上再碰面。"}, {"s": "B", "en": "Sounds good. I'll prepare a short report for Friday.", "zh": "好的。我會為週五準備一份簡短的報告。"}, {"s": "A", "en": "Thanks. Have a productive day.", "zh": "謝謝。祝你今天工作順利。"}, {"s": "B", "en": "You too. Thank you for your support.", "zh": "你也是。謝謝你的支持。"}]},
  {"id": "coffee", "icon": "☕", "title": "咖啡店點餐", "en": "Ordering at a Coffee Shop", "roles": {"A": "Barista 店員", "B": "You 你"}, "lines": [{"s": "A", "en": "Good morning! Welcome to Sunrise Coffee. What can I get started for you?", "zh": "早安！歡迎光臨日出咖啡。我可以先為您準備什麼？", "h": "1. 點飲料"}, {"s": "B", "en": "Good morning. I'd like a latte, please.", "zh": "早安。我想要一杯拿鐵。"}, {"s": "A", "en": "Sure. What size would you like: small, medium, or large?", "zh": "好的。您要什麼尺寸：小杯、中杯還是大杯？"}, {"s": "B", "en": "Medium, please.", "zh": "中杯，麻煩你。"}, {"s": "A", "en": "Hot or iced?", "zh": "要熱的還是冰的？"}, {"s": "B", "en": "Iced, please. And could I get oat milk instead of regular milk?", "zh": "冰的。另外可以用燕麥奶代替一般牛奶嗎？"}, {"s": "A", "en": "Of course. Oat milk is fifty cents extra.", "zh": "當然可以。燕麥奶要加五十分錢。"}, {"s": "B", "en": "That's fine.", "zh": "沒問題。"}, {"s": "A", "en": "Would you like any flavor in it, like vanilla or caramel?", "zh": "要加任何口味嗎？像是香草或焦糖。"}, {"s": "B", "en": "Just a little vanilla, and less ice, please.", "zh": "只要一點點香草，冰塊少一點。"}, {"s": "A", "en": "Got it. A medium iced oat latte with vanilla and less ice. Anything else?", "zh": "好的。一杯中杯冰燕麥拿鐵，加香草、少冰。還需要別的嗎？"}, {"s": "B", "en": "Yes. What kind of pastries do you have today?", "zh": "有。你們今天有哪些糕點？", "h": "2. 點餐點"}, {"s": "A", "en": "We have croissants, blueberry muffins, and banana bread. The croissants are fresh out of the oven.", "zh": "我們有可頌、藍莓馬芬和香蕉麵包。可頌剛出爐。"}, {"s": "B", "en": "Mmm, I'll have a plain croissant. Can you warm it up?", "zh": "嗯，我要一個原味可頌。可以幫我加熱嗎？"}, {"s": "A", "en": "Absolutely. Would you like butter or jam with it?", "zh": "沒問題。要附奶油還是果醬？"}, {"s": "B", "en": "Strawberry jam, please.", "zh": "草莓果醬，麻煩你。"}, {"s": "A", "en": "Great. Would you like to try our seasonal special? It's a pumpkin spice cookie.", "zh": "好的。您想試試我們的季節限定嗎？是南瓜香料餅乾。"}, {"s": "B", "en": "That sounds tempting, but I'll skip it today.", "zh": "聽起來很誘人，但我今天先不要。"}, {"s": "A", "en": "No problem. Will that be for here or to go?", "zh": "沒問題。內用還是外帶？"}, {"s": "B", "en": "For here. Is it okay if I sit by the window and use my laptop for a while?", "zh": "內用。我可以坐在窗邊用一下筆電嗎？"}, {"s": "A", "en": "Of course. There are outlets by the window seats, and the Wi-Fi is free.", "zh": "當然可以。窗邊座位旁有插座，Wi-Fi 也是免費的。"}, {"s": "B", "en": "Wonderful. What's the Wi-Fi password?", "zh": "太好了。Wi-Fi 密碼是什麼？"}, {"s": "A", "en": "It's printed on your receipt.", "zh": "印在您的收據上。"}, {"s": "A", "en": "Your total is nine dollars and twenty cents.", "zh": "您的總額是九元二角。", "h": "3. 結帳與集點"}, {"s": "B", "en": "Can I pay with my phone?", "zh": "我可以用手機付款嗎？"}, {"s": "A", "en": "Yes, just tap it here.", "zh": "可以，在這裡感應就好。"}, {"s": "B", "en": "Okay. Oh, I also have a stamp card. Can I get a stamp?", "zh": "好的。哦，我也有集點卡。可以蓋章嗎？"}, {"s": "A", "en": "Sure. That's your ninth stamp, so your next drink is free!", "zh": "當然。這是您的第九個章，所以您下一杯飲料免費！"}, {"s": "B", "en": "Really? That's great news!", "zh": "真的嗎？這真是好消息！"}, {"s": "A", "en": "Here's your receipt and your table number. We'll bring everything to you.", "zh": "這是您的收據和桌號。我們會把餐點送到您的桌邊。"}, {"s": "A", "en": "Here's your iced latte and croissant. Careful, the plate is warm.", "zh": "這是您的冰拿鐵和可頌。小心，盤子是溫的。", "h": "4. 餐點有問題"}, {"s": "B", "en": "Thank you. Excuse me, I think this drink has regular milk in it. It doesn't taste like oat milk.", "zh": "謝謝。不好意思，我覺得這杯飲料是一般牛奶。喝起來不像燕麥奶。"}, {"s": "A", "en": "Oh, I'm so sorry! Let me check. You're right, I used the wrong milk. I'll make you a new one right away.", "zh": "哦，真抱歉！我確認一下。您說得對，我用錯牛奶了。我馬上為您重做一杯。"}, {"s": "B", "en": "Thank you. I appreciate it.", "zh": "謝謝。我很感激。"}, {"s": "A", "en": "Here's your new latte. It's on the house.", "zh": "這是您的新拿鐵。這杯我們請客。"}, {"s": "B", "en": "That's very kind of you. It tastes perfect now.", "zh": "你人真好。現在味道剛剛好。"}, {"s": "A", "en": "I'm glad. Please let me know if you need anything else. Enjoy!", "zh": "太好了。需要什麼請告訴我。請慢用！"}, {"s": "B", "en": "Excuse me, could I get a glass of water, please?", "zh": "不好意思，可以給我一杯水嗎？", "h": "5. 離開前"}, {"s": "A", "en": "Sure. I'll bring it to your table right away.", "zh": "當然。我馬上送到您的桌邊。"}, {"s": "B", "en": "Thank you. The croissant was delicious, by the way.", "zh": "謝謝。對了，可頌很好吃。"}, {"s": "A", "en": "I'm happy to hear that. We bake them fresh every morning at six.", "zh": "聽到真開心。我們每天早上六點現烤。"}, {"s": "B", "en": "I'll definitely come back tomorrow. Have a great day!", "zh": "我明天一定會再來。祝你有美好的一天！"}, {"s": "A", "en": "See you tomorrow! Enjoy your free drink!", "zh": "明天見！享用您的免費飲料吧！"}]},
  {"id": "supermarket", "icon": "🛒", "title": "超市購物", "en": "Grocery Shopping", "roles": {"A": "Staff 超市店員", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, could you help me find a few things?", "zh": "不好意思，可以請你幫我找一些東西嗎？", "h": "1. 詢問商品位置"}, {"s": "A", "en": "Sure. What are you looking for?", "zh": "當然。你在找什麼？"}, {"s": "B", "en": "I need olive oil and some pasta.", "zh": "我需要橄欖油和一些義大利麵。"}, {"s": "A", "en": "Olive oil is in aisle four, next to the vinegar. The pasta is in aisle six.", "zh": "橄欖油在第四走道，醋的旁邊。義大利麵在第六走道。"}, {"s": "B", "en": "Great. Where are the fresh vegetables?", "zh": "太好了。新鮮蔬菜在哪裡？"}, {"s": "A", "en": "Right at the entrance, on your left. Today we have a special on tomatoes and broccoli.", "zh": "就在入口，左手邊。今天番茄和花椰菜有特價。"}, {"s": "B", "en": "Perfect. Do you have organic eggs?", "zh": "太好了。你們有有機雞蛋嗎？"}, {"s": "A", "en": "Yes, they're in the refrigerated section at the back, next to the milk.", "zh": "有，在後面冷藏區，牛奶旁邊。"}, {"s": "B", "en": "Thanks. One more thing: do you sell fresh bread?", "zh": "謝謝。還有一件事：你們有賣新鮮麵包嗎？"}, {"s": "A", "en": "Yes, the bakery is in the corner. The bread is baked fresh every morning.", "zh": "有，烘焙區在角落。麵包每天早上現烤。"}, {"s": "B", "en": "Is there a sale on fruit today?", "zh": "今天水果有特價嗎？"}, {"s": "A", "en": "Yes, strawberries are two boxes for five dollars, and the apples are thirty percent off.", "zh": "有，草莓兩盒五元，蘋果打七折。"}, {"s": "B", "en": "Wow, that's a good deal. Are the strawberries sweet?", "zh": "哇，真划算。草莓甜嗎？"}, {"s": "A", "en": "They're very sweet. They came in fresh this morning.", "zh": "非常甜。今天早上剛到貨。"}, {"s": "B", "en": "Great. I'll get two boxes then.", "zh": "太好了。那我拿兩盒。"}, {"s": "B", "en": "Hi, I'd like half a pound of sliced turkey, please.", "zh": "嗨，我想要半磅的火雞肉片。", "h": "2. 熟食櫃台"}, {"s": "A", "en": "Sure. How thin would you like it?", "zh": "好的。要切多薄？"}, {"s": "B", "en": "Pretty thin, please.", "zh": "薄一點，麻煩你。"}, {"s": "A", "en": "Here you go. Anything else?", "zh": "給您。還需要什麼嗎？"}, {"s": "B", "en": "Yes, how much is the roast chicken?", "zh": "有，烤雞多少錢？"}, {"s": "A", "en": "It's eight ninety-nine each, and it's still warm.", "zh": "一隻八元九角九，而且還是熱的。"}, {"s": "B", "en": "I'll take one, please.", "zh": "我要一隻。"}, {"s": "A", "en": "Great. I'll wrap it up for you.", "zh": "好的。我幫您包起來。"}, {"s": "A", "en": "Hi, did you find everything you were looking for?", "zh": "嗨，您都找到需要的東西了嗎？", "h": "3. 結帳"}, {"s": "B", "en": "Yes, thanks. Oh wait, I forgot to get milk. Can you hold on for a moment?", "zh": "找到了，謝謝。啊等一下，我忘了拿牛奶。可以等我一下嗎？"}, {"s": "A", "en": "No problem. Take your time.", "zh": "沒問題。慢慢來。"}, {"s": "B", "en": "Sorry about that. Here it is.", "zh": "抱歉。拿來了。"}, {"s": "A", "en": "That's okay. Do you have a membership card?", "zh": "沒關係。您有會員卡嗎？"}, {"s": "B", "en": "Yes, here it is.", "zh": "有，在這裡。"}, {"s": "A", "en": "Thank you. Your total comes to fifty-six dollars and eighty cents.", "zh": "謝謝。您的總額是五十六元八角。"}, {"s": "B", "en": "Here's a coupon for five dollars off. Is it still valid?", "zh": "這是一張折五元的優惠券。還有效嗎？"}, {"s": "A", "en": "Let me check. Yes, it's valid until the end of this month.", "zh": "我看看。有，有效期限到本月底。"}, {"s": "B", "en": "Great.", "zh": "太好了。"}, {"s": "A", "en": "Your new total is fifty-one dollars and eighty cents. Cash or card?", "zh": "您的新總額是五十一元八角。付現還是刷卡？"}, {"s": "B", "en": "Card, please.", "zh": "刷卡。"}, {"s": "A", "en": "Please enter your PIN.", "zh": "請輸入您的密碼。"}, {"s": "B", "en": "Done.", "zh": "好了。"}, {"s": "A", "en": "Would you like to donate one dollar to the local food bank today?", "zh": "您今天想捐一元給在地的食物銀行嗎？"}, {"s": "B", "en": "Sure, I'd be happy to.", "zh": "好啊，我很樂意。"}, {"s": "A", "en": "Thank you. That's very generous of you.", "zh": "謝謝您。您真慷慨。"}, {"s": "A", "en": "Would you like a paper bag or a plastic bag?", "zh": "您要紙袋還是塑膠袋？", "h": "4. 裝袋與離開"}, {"s": "B", "en": "I brought my own reusable bags. Can you put the cold items together?", "zh": "我自備了環保袋。可以把冷藏的東西放在一起嗎？"}, {"s": "A", "en": "Of course. I'll put the chicken and the milk in this bag.", "zh": "當然。我把雞肉和牛奶放進這個袋子。"}, {"s": "B", "en": "Thank you. Could I get a receipt, please?", "zh": "謝謝。可以給我收據嗎？"}, {"s": "A", "en": "Here's your receipt. If you want to return anything, you have thirty days.", "zh": "這是您的收據。如果想退貨，您有三十天的時間。"}, {"s": "B", "en": "Good to know. Do you offer free delivery for large orders?", "zh": "知道了。你們大量訂單有提供免費配送嗎？"}, {"s": "A", "en": "Yes, for orders over one hundred dollars, delivery is free within five miles.", "zh": "有的，超過一百元的訂單，五英里內免費配送。"}, {"s": "B", "en": "That's helpful. I'll keep it in mind. Have a great day!", "zh": "那很有幫助。我會記住的。祝你有美好的一天！"}, {"s": "A", "en": "You too. Thanks for shopping with us!", "zh": "你也是。謝謝您的光臨！"}]},
  {"id": "intro", "icon": "👋", "title": "自我介紹", "en": "Meeting New People", "roles": {"A": "New friend 新朋友", "B": "You 你"}, "lines": [{"s": "A", "en": "Hi, I'm Emily. I don't think we've met before.", "zh": "嗨，我是艾蜜莉。我想我們以前沒見過。", "h": "1. 打招呼"}, {"s": "B", "en": "Hi, Emily. Nice to meet you. I'm Ming. I just joined the language club last week.", "zh": "嗨，艾蜜莉。很高興認識你。我是小明。我上週剛加入語言社。"}, {"s": "A", "en": "Oh, welcome! How do you like it so far?", "zh": "哦，歡迎！到目前為止你覺得怎麼樣？"}, {"s": "B", "en": "I really like it. Everyone has been very friendly, and the activities are fun.", "zh": "我很喜歡。大家都很友善，活動也很有趣。"}, {"s": "A", "en": "I'm glad to hear that. How do you pronounce your name? Is it Ming?", "zh": "很高興聽到這件事。你的名字怎麼唸？是 Ming 嗎？"}, {"s": "B", "en": "Yes, that's right. It means bright in Chinese.", "zh": "對，沒錯。在中文裡是「明亮」的意思。"}, {"s": "A", "en": "That's a beautiful meaning. Where are you from, Ming?", "zh": "這個意思很美。你從哪裡來，小明？", "h": "2. 家鄉與工作"}, {"s": "B", "en": "I'm from Taiwan. I came here six months ago for work.", "zh": "我來自台灣。我六個月前因為工作來到這裡。"}, {"s": "A", "en": "Oh, cool! What do you do for a living?", "zh": "哦，好酷！你是做什麼工作的？"}, {"s": "B", "en": "I work for a software company. I design mobile apps. How about you?", "zh": "我在一家軟體公司工作。我設計手機 App。你呢？"}, {"s": "A", "en": "I'm a high school teacher. I teach history.", "zh": "我是高中老師。我教歷史。"}, {"s": "B", "en": "That sounds like a rewarding job. Do your students enjoy history?", "zh": "聽起來是份很有成就感的工作。你的學生喜歡歷史嗎？"}, {"s": "A", "en": "Some of them do. I try to make it fun with stories and games.", "zh": "有些喜歡。我試著用故事和遊戲讓它變得有趣。"}, {"s": "B", "en": "I wish I'd had a teacher like you. How long have you lived here?", "zh": "真希望我以前也有像你這樣的老師。你住在這裡多久了？"}, {"s": "A", "en": "My whole life. I grew up just ten minutes from here.", "zh": "我一輩子都住在這裡。我是在離這裡只有十分鐘的地方長大的。"}, {"s": "B", "en": "Then you must know all the best places. Could you recommend some to me?", "zh": "那你一定知道所有最棒的地方。你可以推薦一些給我嗎？"}, {"s": "A", "en": "Of course. There's a great café on Oak Street, and a beautiful park by the river.", "zh": "當然。橡樹街有一家很棒的咖啡店，河邊有一座很美的公園。"}, {"s": "A", "en": "What do you like to do in your free time?", "zh": "你空閒時喜歡做什麼？", "h": "3. 興趣"}, {"s": "B", "en": "I love hiking and taking photos. On weekends, I usually go to the mountains.", "zh": "我喜歡健行和拍照。週末我通常會去山上。"}, {"s": "A", "en": "Really? I love hiking too. Do you have a favorite trail?", "zh": "真的嗎？我也喜歡健行。你有最喜歡的步道嗎？"}, {"s": "B", "en": "There's a trail near the lake that I like a lot. The sunrise there is wonderful.", "zh": "湖邊有一條步道我很喜歡。那裡的日出很美。"}, {"s": "A", "en": "I know that one! I went there last summer. Do you also like cooking?", "zh": "我知道那條！我去年夏天去過。你也喜歡做菜嗎？"}, {"s": "B", "en": "A little. I can make some Taiwanese dishes, like beef noodle soup and fried rice.", "zh": "一點點。我會做一些台灣料理，像是牛肉麵和炒飯。"}, {"s": "A", "en": "That sounds delicious! I've never tried Taiwanese food. I'd love to taste it.", "zh": "聽起來好好吃！我從來沒吃過台灣料理。我很想嚐嚐。"}, {"s": "B", "en": "I'd be happy to cook for you sometime.", "zh": "我很樂意找時間煮給你吃。"}, {"s": "A", "en": "Do you play any sports or instruments?", "zh": "你有玩任何運動或樂器嗎？"}, {"s": "B", "en": "I played the piano when I was a child, but I don't practice much anymore.", "zh": "我小時候彈過鋼琴，但現在不太練了。"}, {"s": "A", "en": "It's never too late to start again. Well, it was really nice talking to you.", "zh": "現在重新開始永遠不嫌晚。嗯，和你聊天真的很愉快。", "h": "4. 交換聯絡方式"}, {"s": "B", "en": "I enjoyed it too. Would you like to exchange phone numbers?", "zh": "我也聊得很開心。你想交換電話號碼嗎？"}, {"s": "A", "en": "Sure. Or we could connect on social media, if that's easier for you.", "zh": "好啊。或者如果你比較方便，我們也可以在社群媒體上互相追蹤。"}, {"s": "B", "en": "Let's do both. What's your username?", "zh": "我們兩個都做吧。你的帳號是什麼？"}, {"s": "A", "en": "It's emily underscore reads, all lowercase.", "zh": "是 emily_reads，全部小寫。"}, {"s": "B", "en": "Got it. I'll send you a message so that you have mine.", "zh": "好了。我傳訊息給你，這樣你就有我的帳號了。"}, {"s": "A", "en": "Perfect. The club is meeting again next Thursday at seven. Will you be there?", "zh": "太好了。社團下週四七點又要聚會。你會來嗎？"}, {"s": "B", "en": "Yes, I'll be there. Maybe we can go hiking together one weekend too.", "zh": "會，我會去。也許我們哪個週末也可以一起去健行。"}, {"s": "A", "en": "I'd love that. See you next Thursday, Ming!", "zh": "我很樂意。下週四見，小明！"}, {"s": "B", "en": "See you, Emily. Have a great evening!", "zh": "再見，艾蜜莉。祝你有個美好的夜晚！"}]},
  {"id": "invite", "icon": "🎉", "title": "邀約朋友出去玩", "en": "Making Plans with a Friend", "roles": {"A": "Friend 朋友", "B": "You 你"}, "lines": [{"s": "B", "en": "Hey, are you doing anything this weekend?", "zh": "嘿，你這個週末有安排嗎？", "h": "1. 提出邀約"}, {"s": "A", "en": "Not yet. Why, do you have something in mind?", "zh": "還沒有。怎麼了，你有什麼想法嗎？"}, {"s": "B", "en": "I was thinking we could do something fun together. We haven't hung out in a long time.", "zh": "我在想我們可以一起做點有趣的事。我們好久沒有一起出去了。"}, {"s": "A", "en": "That's true. I'd love to. What do you want to do?", "zh": "確實是。我很樂意。你想做什麼？"}, {"s": "B", "en": "We could go to the beach. The weather forecast says it will be sunny and warm on Saturday.", "zh": "我們可以去海邊。天氣預報說週六會是晴朗又溫暖。"}, {"s": "A", "en": "That sounds nice, but I'm not a big fan of crowded beaches.", "zh": "聽起來不錯，但我不太喜歡人擠人的海灘。"}, {"s": "B", "en": "Good point. Then how about a picnic in the park? It's quieter, and we could bring food.", "zh": "有道理。那去公園野餐如何？比較安靜，我們也可以帶食物。", "h": "2. 決定活動"}, {"s": "A", "en": "I like that idea better. We could also bring a ball or some cards to play.", "zh": "我比較喜歡這個主意。我們也可以帶球或撲克牌去玩。"}, {"s": "B", "en": "Great. Should we invite anyone else?", "zh": "太好了。我們要邀請其他人嗎？"}, {"s": "A", "en": "Maybe Lisa and Jack. They always have fun ideas.", "zh": "也許麗莎和傑克。他們總是有好玩的點子。"}, {"s": "B", "en": "Good idea. I'll text them tonight. What kind of food should we bring?", "zh": "好主意。我今晚傳訊息給他們。我們該帶什麼食物？"}, {"s": "A", "en": "I can make sandwiches, and you could bring some fruit and drinks.", "zh": "我可以做三明治，你可以帶一些水果和飲料。"}, {"s": "B", "en": "Sounds like a plan. I'll also bring a blanket to sit on.", "zh": "聽起來是個好計畫。我也會帶一條毯子來坐。"}, {"s": "A", "en": "What time should we meet?", "zh": "我們幾點碰面？", "h": "3. 時間與地點"}, {"s": "B", "en": "How about eleven? That way we can have lunch there and stay for the afternoon.", "zh": "十一點如何？這樣我們可以在那裡吃午餐，並待一整個下午。"}, {"s": "A", "en": "Eleven is a little early for me. Could we make it eleven thirty?", "zh": "十一點對我來說有點早。可以改成十一點半嗎？"}, {"s": "B", "en": "Sure, eleven thirty works. Where exactly should we meet?", "zh": "可以，十一點半沒問題。我們確切要在哪裡碰面？"}, {"s": "A", "en": "Let's meet at the main entrance of Riverside Park, next to the big fountain.", "zh": "我們在河濱公園的正門碰面，大噴泉旁邊。"}, {"s": "B", "en": "Do you know how to get there? I can pick you up if you want.", "zh": "你知道怎麼去嗎？如果你想的話，我可以去接你。"}, {"s": "A", "en": "That would be great. My place is on the way, near the subway station.", "zh": "那太好了。我家就在路上，靠近捷運站。"}, {"s": "B", "en": "Okay, I'll be at your place at eleven. I'll text you when I arrive.", "zh": "好的，我十一點到你家。到的時候我傳訊息給你。"}, {"s": "A", "en": "Hey, I just checked the weather again, and it might rain on Saturday afternoon.", "zh": "嘿，我剛又查了天氣，週六下午可能會下雨。", "h": "4. 臨時變動"}, {"s": "B", "en": "Oh no. What should we do then?", "zh": "哦不。那我們該怎麼辦？"}, {"s": "A", "en": "We could move it to Sunday if it's raining on Saturday. Are you free then?", "zh": "如果週六下雨，我們可以改到週日。你那天有空嗎？"}, {"s": "B", "en": "Sunday morning I have a dentist appointment, but I'm free after one.", "zh": "週日早上我有牙醫預約，但一點後就有空了。"}, {"s": "A", "en": "Then we could meet at two on Sunday instead.", "zh": "那我們可以改成週日兩點碰面。"}, {"s": "B", "en": "Good plan. Let's decide tomorrow evening, after we check the forecast again.", "zh": "好計畫。我們明天晚上看過最新預報後再決定。"}, {"s": "A", "en": "Sounds good. In case it rains both days, we could go to the movies.", "zh": "聽起來不錯。萬一兩天都下雨，我們可以去看電影。"}, {"s": "B", "en": "Perfect, there's a new comedy I want to see.", "zh": "太好了，有一部我想看的新喜劇片。"}, {"s": "A", "en": "Oh, I want to see that one too!", "zh": "哦，我也想看那部！"}, {"s": "B", "en": "Then it's settled. Whatever the weather is, we'll have a great time.", "zh": "那就這麼說定了。不管天氣如何，我們都會玩得很開心。"}, {"s": "A", "en": "Thanks for inviting me. I've been stuck at home too much lately.", "zh": "謝謝你邀請我。我最近待在家的時間太多了。"}, {"s": "B", "en": "Anytime. I'll message the group chat tonight and let you know what everyone says.", "zh": "隨時歡迎。我今晚會在群組裡傳訊息，再告訴你大家怎麼說。"}, {"s": "A", "en": "Great. Talk to you later!", "zh": "太好了。晚點聊！"}, {"s": "B", "en": "Bye! See you Saturday!", "zh": "再見！週六見！"}]},
  {"id": "return", "icon": "📦", "title": "電話客服退換貨", "en": "Returning an Item by Phone", "roles": {"A": "Customer service 客服人員", "B": "You 你"}, "lines": [{"s": "A", "en": "Thank you for calling Bright Mart customer service. My name is Karen. How can I help you today?", "zh": "感謝您致電明亮商場客服。我是凱倫。今天有什麼可以為您服務的嗎？", "h": "1. 提供訂單資料"}, {"s": "B", "en": "Hi, Karen. I received a package yesterday, and I'd like to return one of the items.", "zh": "嗨，凱倫。我昨天收到一個包裹，我想退其中一項商品。"}, {"s": "A", "en": "I'm sorry to hear that. May I have your order number, please?", "zh": "很抱歉聽到這件事。可以給我您的訂單編號嗎？"}, {"s": "B", "en": "Sure. It's A as in apple, seven seven four two nine.", "zh": "好的。是 A，Apple 的 A，77429。"}, {"s": "A", "en": "Thank you. Could I also have your full name and the email address on the account?", "zh": "謝謝。我也可以請教您的全名和帳號的電子信箱嗎？"}, {"s": "B", "en": "My name is Linda Chen, and my email is linda dot chen at example dot com.", "zh": "我的名字是琳達·陳，電子信箱是 linda.chen@example.com。"}, {"s": "A", "en": "Thank you, Ms. Chen. I found your order. Which item would you like to return?", "zh": "謝謝您，陳小姐。我找到您的訂單了。您想退哪一項商品？"}, {"s": "B", "en": "The blue wireless headphones.", "zh": "藍色的無線耳機。"}, {"s": "A", "en": "May I ask what the problem is?", "zh": "請問是什麼問題呢？", "h": "2. 說明問題"}, {"s": "B", "en": "The left earphone doesn't work. There's no sound at all.", "zh": "左邊的耳機不能用。完全沒有聲音。"}, {"s": "A", "en": "I'm sorry about that. Have you tried charging them fully?", "zh": "很抱歉。您有試著把它們充飽電嗎？"}, {"s": "B", "en": "Yes, I charged them overnight, and I also reset them by following the manual.", "zh": "有，我充了一整晚的電，也照著說明書重新設定過了。"}, {"s": "A", "en": "I understand. It sounds like a defect. Did you use them in water or drop them?", "zh": "我了解。聽起來是瑕疵品。您有在水中使用或摔到它們嗎？"}, {"s": "B", "en": "No, I only used them once at home, and they've been in the box since then.", "zh": "沒有，我只在家裡用過一次，之後就一直放在盒子裡。"}, {"s": "A", "en": "Thank you for telling me. That's covered by our warranty, so you won't have to pay anything.", "zh": "謝謝您告訴我。這在我們的保固範圍內，所以您不需要付任何費用。"}, {"s": "B", "en": "What are my options?", "zh": "我有哪些選擇？", "h": "3. 退款或換貨"}, {"s": "A", "en": "You can choose a full refund to your original payment method, or a replacement at no extra cost.", "zh": "您可以選擇退全額款項到原本的付款方式，或免費換一個新的。"}, {"s": "B", "en": "How long would the refund take?", "zh": "退款要多久？"}, {"s": "A", "en": "It takes five to seven business days after we receive the returned item.", "zh": "在我們收到退回商品後，需要五到七個工作天。"}, {"s": "B", "en": "And how about the replacement?", "zh": "那換貨呢？"}, {"s": "A", "en": "We ship the new one within two days after we receive your return.", "zh": "我們收到退貨後兩天內會寄出新的。"}, {"s": "B", "en": "I'd like a replacement, because I still want the headphones.", "zh": "我想要換貨，因為我還是想要這副耳機。"}, {"s": "A", "en": "Let me check the stock. Yes, the blue color is in stock, so we can send one out right away.", "zh": "我確認一下庫存。有的，藍色有貨，所以我們可以馬上寄出。"}, {"s": "B", "en": "That's great. What do I need to do next?", "zh": "太好了。我接下來需要做什麼？"}, {"s": "A", "en": "I'll email you a prepaid return label in a few minutes.", "zh": "我幾分鐘後會寄給您一張預付運費的退貨標籤。", "h": "4. 退貨流程"}, {"s": "B", "en": "Do I need to keep the original box?", "zh": "我需要保留原本的盒子嗎？"}, {"s": "A", "en": "Yes, please pack the headphones in the original box, with all the accessories and the cables.", "zh": "是的，請把耳機連同所有配件和線材放回原本的盒子。"}, {"s": "B", "en": "Do I have to pay for the return shipping?", "zh": "我需要付退貨運費嗎？"}, {"s": "A", "en": "No, it's free with the prepaid label.", "zh": "不用，使用預付標籤是免費的。"}, {"s": "B", "en": "Where can I drop off the package?", "zh": "我可以在哪裡寄出包裹？"}, {"s": "A", "en": "At any post office or courier point. Or I can schedule a pickup from your home, if you prefer.", "zh": "任何郵局或快遞收件點都可以。或者如果您願意，我可以安排到府收件。"}, {"s": "B", "en": "A pickup would be easier. Can you schedule it for tomorrow?", "zh": "到府收件比較方便。可以安排明天嗎？"}, {"s": "A", "en": "Of course. The courier will come between nine and five. You'll get a confirmation by email.", "zh": "當然。快遞會在九點到五點之間到。您會收到確認電子郵件。"}, {"s": "B", "en": "And what if the replacement doesn't arrive on time?", "zh": "如果換的新商品沒有準時到達呢？"}, {"s": "A", "en": "You'll receive a tracking number once it's shipped. If there's any problem, just call us with your order number.", "zh": "寄出後您會收到追蹤編號。如果有任何問題，只要帶著您的訂單編號打給我們。"}, {"s": "B", "en": "That's very clear. Thank you for your help, Karen.", "zh": "非常清楚。謝謝你的協助，凱倫。"}, {"s": "A", "en": "You're welcome, Ms. Chen. Is there anything else I can help you with?", "zh": "不客氣，陳小姐。還有什麼我可以幫忙的嗎？"}, {"s": "B", "en": "No, that's everything. Have a great day!", "zh": "沒有了，就這些。祝你有美好的一天！"}, {"s": "A", "en": "Thank you for calling Bright Mart. Goodbye!", "zh": "感謝您致電明亮商場。再見！"}]},
  {"id": "subway", "icon": "🚇", "title": "搭捷運", "en": "Taking the Subway", "roles": {"A": "Station staff 站務員", "B": "You 你"}, "lines": [{"s": "B", "en": "Excuse me, I'd like to go to the National Museum. Which line should I take?", "zh": "不好意思，我想去國家博物館。我該搭哪一條線？", "h": "1. 買票與問路線"}, {"s": "A", "en": "Take the blue line and get off at Central Station. Then transfer to the green line and go three more stops.", "zh": "搭藍線，在中央站下車。然後換綠線，再坐三站。"}, {"s": "B", "en": "So blue line first, then green line. Is that right?", "zh": "所以先搭藍線，再搭綠線。對嗎？"}, {"s": "A", "en": "That's right. The whole trip takes about thirty minutes.", "zh": "沒錯。整趟大約三十分鐘。"}, {"s": "B", "en": "How much is a single ticket?", "zh": "單程票多少錢？"}, {"s": "A", "en": "It depends on the distance. To the museum, it's three dollars and fifty cents.", "zh": "要看距離。到博物館是三元五角。"}, {"s": "B", "en": "Is there a day pass for tourists? I'm planning to visit several places today.", "zh": "有給觀光客的一日券嗎？我今天打算去好幾個地方。"}, {"s": "A", "en": "Yes, a day pass costs ten dollars, and you can ride as many times as you like until midnight.", "zh": "有，一日券十元，到午夜之前你想搭幾次都可以。"}, {"s": "B", "en": "That sounds better. I'll take a day pass, please.", "zh": "聽起來比較划算。我要一張一日券。"}, {"s": "A", "en": "Sure. You can buy it from that machine over there.", "zh": "好的。你可以在那邊的機器購買。"}, {"s": "B", "en": "The machine only takes coins and small bills. What should I do with a twenty-dollar bill?", "zh": "機器只收硬幣和小鈔。我拿二十元的鈔票該怎麼辦？", "h": "2. 售票機與月台"}, {"s": "A", "en": "Come to the window, and I'll change it for you.", "zh": "來窗口，我幫你換開。"}, {"s": "B", "en": "Thank you. Here is the twenty.", "zh": "謝謝。這是二十元。"}, {"s": "A", "en": "Here's your change, and your day pass. Please tap it on the gate when you enter.", "zh": "這是您的找零和一日券。進站時請在閘門上感應。"}, {"s": "B", "en": "Where is the platform for the blue line?", "zh": "藍線的月台在哪裡？"}, {"s": "A", "en": "Go down the stairs, and then turn right. Platform two, heading east. The signs are in English too.", "zh": "下樓梯，然後右轉。二號月台，往東方向。標示也有英文。"}, {"s": "B", "en": "How do I know which direction to take?", "zh": "我怎麼知道該搭哪個方向？"}, {"s": "A", "en": "Look at the last station name on the sign. For Central Station, follow the sign that says East End.", "zh": "看標示上的終點站名稱。要去中央站，就跟著寫著東端的標示走。"}, {"s": "B", "en": "Okay. How often do the trains come?", "zh": "好的。列車多久來一班？"}, {"s": "A", "en": "Every five minutes during the day, and every ten minutes at night.", "zh": "白天每五分鐘一班，晚上每十分鐘一班。"}, {"s": "B", "en": "Excuse me, does this train go to Central Station?", "zh": "不好意思，這班車有到中央站嗎？", "h": "3. 搭車與換車"}, {"s": "A", "en": "Yes, it does. It's the third stop from here.", "zh": "有，從這裡算起是第三站。"}, {"s": "B", "en": "Thanks. Is it okay to sit in the blue seats near the doors?", "zh": "謝謝。我可以坐門邊的藍色座位嗎？"}, {"s": "A", "en": "Those are priority seats for elderly people, pregnant women, and people with disabilities. Please give them up if someone needs them.", "zh": "那些是博愛座，給老年人、孕婦和身心障礙者。如果有人需要，請讓座。"}, {"s": "B", "en": "I see. Is it okay to eat or drink on the train?", "zh": "我明白了。可以在車上吃東西或喝飲料嗎？"}, {"s": "A", "en": "No, eating and drinking are not allowed. And please keep your voice down when you talk on the phone.", "zh": "不可以，車上禁止飲食。講電話時也請放低音量。"}, {"s": "B", "en": "Understood. How will I know when we arrive?", "zh": "了解。我怎麼知道什麼時候到站？"}, {"s": "A", "en": "There's an announcement in English, and a display screen above the doors shows the next station.", "zh": "會有英文廣播，車門上方的螢幕也會顯示下一站。"}, {"s": "B", "en": "Excuse me, my day pass doesn't open the exit gate.", "zh": "不好意思，我的一日券打不開出站閘門。", "h": "4. 出站問題"}, {"s": "A", "en": "Let me see. When did you tap it?", "zh": "我看看。你什麼時候感應的？"}, {"s": "B", "en": "I tapped it when I entered, but now the gate shows a red light.", "zh": "我進站時感應過了，但現在閘門顯示紅燈。"}, {"s": "A", "en": "Please hold it flat on the reader and try once more.", "zh": "請把卡片平放在感應區，再試一次。"}, {"s": "B", "en": "Still red. What should I do?", "zh": "還是紅燈。我該怎麼辦？"}, {"s": "A", "en": "Let me check it on my machine. Ah, the card needs to be reactivated. It's done now.", "zh": "我用我的機器檢查一下。啊，這張卡需要重新啟用。現在好了。"}, {"s": "B", "en": "It works now! Thank you. Which exit is closest to the museum?", "zh": "現在可以了！謝謝。哪個出口離博物館最近？"}, {"s": "A", "en": "Exit three. When you leave the station, walk straight for five minutes.", "zh": "三號出口。出站後直走五分鐘。"}, {"s": "B", "en": "And what time does the last train leave?", "zh": "那末班車幾點開？"}, {"s": "A", "en": "The last train is at midnight. You can check the schedule on the board.", "zh": "末班車是午夜十二點。你可以看看板上的時刻表。"}, {"s": "B", "en": "Thank you for all your help.", "zh": "謝謝你的所有協助。"}, {"s": "A", "en": "You're welcome. Have a nice day!", "zh": "不客氣。祝你有美好的一天！"}]},
